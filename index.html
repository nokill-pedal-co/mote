    // stomach, the thread of the gut, and next season's eggs
    const sA = mid(F, 2, 0.6, 0), ga = Math.atan2(nrm[3].fy, nrm[3].fx);
    ctx.beginPath(); ctx.ellipse(sA.x, sA.y, R * 0.62, rad[3] * 0.52, ga, 0, TAU); ctx.fillStyle = P.fill(has.gut ? 0.2 : 0.1); ctx.fill(); ctx.strokeStyle = P.ink(0.45); px(ctx, 0.95); ctx.stroke();
    ctx.fillStyle = o.diet < -0.2 ? hsl(128, 45, 70, 0.55 * P.dim) : o.diet > 0.2 ? hsl(340, 50, 76, 0.55 * P.dim) : P.acc(0.5); ctx.beginPath();
    for (let i = 0; i < 12; i++) dot(ctx, sA.x + (U.hash(i * 3) - 0.5) * R * 0.9 * Math.cos(ga) + Math.sin(t + i) * u, sA.y + (U.hash(i * 7) - 0.5) * rad[3] * 0.7 + Math.cos(t * 0.8 + i) * u, 0.85 * u);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(sA.x - nrm[3].fx * R * 0.6, sA.y - nrm[3].fy * R * 0.6); ctx.lineTo(q[5].x, q[5].y); ctx.strokeStyle = P.ink(0.3); px(ctx, 0.9); ctx.stroke();
    ctx.beginPath(); for (const f of [0.1, 0.6]) { const e = mid(F, 3, f, 0.55); dot(ctx, e.x, e.y, R * 0.13); } ctx.strokeStyle = P.acc(0.45); px(ctx, 0.9); ctx.stroke();
    if (has.chloroplast) { ctx.fillStyle = hsl(128, 50, 68, 0.6 * P.dim); ctx.beginPath(); for (let i = 0; i < 8; i++) { const e = mid(F, 2 + (i % 2), U.hash(i * 5), (U.hash(i * 9) - 0.5) * 1.3); dot(ctx, e.x, e.y, 1.3 * u); } ctx.fill(); }
    ctx.restore();
    // one red eye
    if (!o.dormant) { const ex = head.x + fx * rad[0] * 0.1, ey = head.y + fy * rad[0] * 0.1; ctx.beginPath(); ctx.arc(ex, ey, Math.max(1.3 * u, R * 0.06), 0, TAU); ctx.fillStyle = hsl(8, 80, 58, 0.95); ctx.fill(); B.glow(ctx, ex, ey, R * 0.28, 8, 80, 60, 0.35); }
    if (!o.dormant) B.glow(ctx, m.x, m.y, mr * (1.6 + o.beat), P.hue + 150, 60, 80, 0.2 + 0.3 * o.beat);
    ctx.restore();
  }

  // ---------------------------------------------------------------- water bear: eight legs, and no sense of danger

  // Asleep in earnest: legs drawn in, body folded to a barrel. The tun.
  function drawTun(ctx, sp, o) {
    const R = o.R, P = pen(sp, o);
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.ang); ctx.globalCompositeOperation = 'lighter';
    B.glow(ctx, 0, 0, R * 2.2, P.hue, P.sat, 70, 0.08);
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.25, R * 0.92, 0, 0, TAU); solid(ctx, P, 0.1);
    ctx.strokeStyle = P.ink(0.85); px(ctx, 2.2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.12, R * 0.8, 0, 0, TAU); ctx.strokeStyle = P.ink(0.3); px(ctx, 0.9); ctx.stroke();
    ctx.beginPath();
    for (let k = -3; k <= 3; k++) { const x = k / 4 * R * 1.2, h = R * 0.9 * Math.sqrt(Math.max(0, 1 - (x / (R * 1.25)) ** 2)); ctx.moveTo(x, -h); ctx.quadraticCurveTo(x - R * 0.12, 0, x, h); }
    ctx.strokeStyle = P.ink(0.4); px(ctx, 0.9); ctx.stroke();
    ctx.restore();
  }

  function drawBear(ctx, sp, o, a) {
    if (o.dormant) return drawTun(ctx, sp, o);
    const R = o.R, t = o.t, P = pen(sp, o), u = B.unit, has = sp.has, v = sp.v, K = sp.K, stage = sp.stage;
    const still = o.sleep ? 0.12 : 1, gait = t * (2.2 + 6.5 * o.speed);
    const F = frame(sp, o, a, i => Math.sin(gait - i * 1.1) * R * 0.07 * (0.25 + o.speed) * still);
    const q = F.q, nrm = F.nrm, rad = F.rad, head = q[0], fx = nrm[0].fx, fy = nrm[0].fy, hx = nrm[0].x, hy = nrm[0].y;
    const tuck = o.sleep ? 0.45 : 1 - 0.45 * U.clamp01((o.fear - 0.6) / 0.4);
    const glass = has.camouflage ? 0.6 + 0.2 * Math.sin(t * 1.7) : 1;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalCompositeOperation = 'lighter';
    if (!LOD || o.flash > 0.05) B.glow(ctx, q[2].x, q[2].y, R * (3 + o.flash + 0.3 * o.beat), P.hue, P.sat + 20, 70, (0.14 + 0.14 * o.energy + 0.4 * o.flash) * sp.glow * P.dim);
    if (has.warmblood) B.glow(ctx, q[2].x, q[2].y, R * 1.8, 26, 70, 62, 0.14);
    ctx.globalAlpha = glass;

    // ---- eight legs: three pairs to walk on, one behind to hold on with
    const Lg = R * (0.6 + 0.45 * v.limb) * tuck;
    for (let pair = 0; pair < 4; pair++) {
      const i = pair + 1, n = nrm[i];
      for (const s of [1, -1]) {
        const base = side(F, i, s, 0.86);
        const swing = Math.sin(gait + pair * 1.55 + (s > 0 ? 0 : Math.PI)) * 0.5 * (0.15 + o.speed) * still;
        const out = Math.atan2(n.y * s, n.x * s), back = Math.atan2(-n.fy, -n.fx);
        const dir = pair === 3 ? back + s * (0.55 + swing * 0.5) : out + U.angDiff(out, back) * (0.12 + pair * 0.1) - swing * s;
        const tx = base.x + Math.cos(dir) * Lg, ty = base.y + Math.sin(dir) * Lg, pxn = -Math.sin(dir), pyn = Math.cos(dir), w0 = R * 0.24, w1 = R * 0.12;
        ctx.beginPath();
        ctx.moveTo(base.x + pxn * w0, base.y + pyn * w0); ctx.lineTo(tx + pxn * w1, ty + pyn * w1);
        ctx.quadraticCurveTo(tx + Math.cos(dir) * w1 * 1.3, ty + Math.sin(dir) * w1 * 1.3, tx - pxn * w1, ty - pyn * w1);
        ctx.lineTo(base.x - pxn * w0, base.y - pyn * w0);
        solid(ctx, P, 0.07); ctx.strokeStyle = P.ink(0.7); px(ctx, 1); ctx.stroke();
        if (LOD) continue;
        // a ring where the leg folds, and claws like fine hooks
        ctx.beginPath(); ctx.moveTo(base.x + Math.cos(dir) * Lg * 0.5 + pxn * w0 * 0.75, base.y + Math.sin(dir) * Lg * 0.5 + pyn * w0 * 0.75); ctx.lineTo(base.x + Math.cos(dir) * Lg * 0.5 - pxn * w0 * 0.75, base.y + Math.sin(dir) * Lg * 0.5 - pyn * w0 * 0.75);
        ctx.strokeStyle = P.ink(0.22); px(ctx, 0.75); ctx.stroke();
        ctx.beginPath();
        const cl = R * (has.fins ? 0.34 : 0.2);
        for (const d of [-0.7, -0.25, 0.25, 0.7]) { ctx.moveTo(tx + pxn * w1 * d, ty + pyn * w1 * d); ctx.quadraticCurveTo(tx + Math.cos(dir + d * 0.5) * cl, ty + Math.sin(dir + d * 0.5) * cl, tx + Math.cos(dir + d * 1.5) * cl * 0.9, ty + Math.sin(dir + d * 1.5) * cl * 0.9); }
        ctx.strokeStyle = P.ink(0.8); px(ctx, 0.8); ctx.stroke();
      }
    }
    // fine hairs for feeling the water
    if (has.tentacles || v.crest > 0.45) {
      const amt = has.tentacles ? 1 : (v.crest - 0.45) * 1.8;
      ctx.beginPath();
      for (const s of [1, -1]) {
        const b = side(F, 0, s, 0.9);
        ctx.moveTo(b.x, b.y); for (let i = 1; i <= 8; i++) { const k = i / 8, w = Math.sin(t * 1.8 + k * 3 + s) * R * 0.12 * k; ctx.lineTo(b.x + (hx * s * 1.1 + fx * 0.5) * R * (0.6 + amt) * k + fx * w, b.y + (hy * s * 1.1 + fy * 0.5) * R * (0.6 + amt) * k + fy * w); }
        if (v.crest > 0.62) for (let i = 1; i < 5; i++) { const c = side(F, i, s), n = nrm[i]; ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + (n.x * s - n.fx * 0.8) * R * 0.55 * amt, c.y + (n.y * s - n.fy * 0.8) * R * 0.55 * amt); }
      }
      ctx.strokeStyle = P.ink(0.5); px(ctx, 0.8); ctx.stroke();
    }

    // ---- the body
    const snout = { x: head.x + fx * rad[0] * 1.25, y: head.y + fy * rad[0] * 1.25 };
    const out = [snout, { x: head.x + fx * rad[0] * 0.8 + hx * rad[0] * 0.7, y: head.y + fy * rad[0] * 0.8 + hy * rad[0] * 0.7 }];
    for (let i = 0; i < K; i++) out.push(side(F, i, 1));
    out.push({ x: q[K - 1].x - nrm[K - 1].fx * rad[K - 1] * 0.9, y: q[K - 1].y - nrm[K - 1].fy * rad[K - 1] * 0.9 });
    for (let i = K - 1; i >= 0; i--) out.push(side(F, i, -1));
    out.push({ x: head.x + fx * rad[0] * 0.8 - hx * rad[0] * 0.7, y: head.y + fy * rad[0] * 0.8 - hy * rad[0] * 0.7 });
    blob(ctx, out); solid(ctx, P, 0.085);
    rim(ctx, P);

    ctx.save(); blob(ctx, out); ctx.clip();
    grain(ctx, P, 150, t, i => mid(F, i % (K - 1), U.hash(i * 3), (U.hash(i * 7) * 2 - 1) * 0.95));
    // folds of the skin between segments
    ctx.beginPath();
    for (let i = 0; i < K - 1; i++) for (const f of [0.5, 0.78]) { const l = mid(F, i, f, 1), r = mid(F, i, f, -1), c = mid(F, i, f + 0.16, 0); ctx.moveTo(l.x, l.y); ctx.quadraticCurveTo(c.x, c.y, r.x, r.y); }
    ctx.strokeStyle = P.ink(0.2); px(ctx, 0.8); ctx.stroke();
    if (has.shell) {
      // plates along the back, pricked with pores
      ctx.beginPath();
      for (let i = 1; i < 5; i++) { const a0 = mid(F, i, -0.3, 0.7), a1 = mid(F, i, 0.3, 0.72), b1 = mid(F, i, 0.3, -0.72), b0 = mid(F, i, -0.3, -0.7); ctx.moveTo(a0.x, a0.y); ctx.lineTo(a1.x, a1.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b0.x, b0.y); ctx.closePath(); }
      ctx.strokeStyle = P.ink(0.48); px(ctx, 1); ctx.stroke();
      ctx.fillStyle = P.ink(0.35); ctx.beginPath(); for (let i = 1; i < 5; i++) for (let k = 0; k < 6; k++) { const e = mid(F, i, (U.hash(i * 9 + k) - 0.5) * 0.5, (U.hash(i * 5 + k * 3) - 0.5) * 1.2); dot(ctx, e.x, e.y, 0.7 * u); } ctx.fill();
    }
    // bands and stipple, if its genes call for them
    const band = Math.max(0, v.stripe - 0.5) * 1.6 + (has.muscle ? 0.3 : 0);
    if (band > 0.03) { ctx.beginPath(); for (let i = 1; i < 5; i++) for (const f of [-0.08, 0.08]) { const l = mid(F, i, f, 1), r = mid(F, i, f, -1); ctx.moveTo(l.x, l.y); ctx.lineTo(r.x, r.y); } ctx.strokeStyle = P.acc(Math.min(0.5, band)); px(ctx, 0.9); ctx.stroke(); }
    const spot = Math.max(0, v.spots - 0.48) * 1.8;
    if (spot > 0.03) { ctx.fillStyle = P.acc(Math.min(0.7, spot)); ctx.beginPath(); for (let i = 0; i < 46; i++) { const e = mid(F, 1 + (i % 4), U.hash(i * 3) - 0.3, (U.hash(i * 7) - 0.5) * 1.5); dot(ctx, e.x, e.y, (0.6 + U.hash(i) * 0.8) * u); } ctx.fill(); }

    // the workings: mouth tube, piercing stylets, the bulb that pumps, the gut
    const bulb = mid(F, 0, 0.75, 0), br = rad[0] * 0.36, jab = o.eat * R * 0.22;
    ctx.beginPath(); ctx.moveTo(snout.x - fx * R * 0.12, snout.y - fy * R * 0.12); ctx.lineTo(bulb.x, bulb.y); ctx.strokeStyle = P.ink(0.55); px(ctx, 1); ctx.stroke();
    ctx.beginPath(); for (const s of [1, -1]) { ctx.moveTo(snout.x - fx * (R * 0.16 - jab), snout.y - fy * (R * 0.16 - jab)); ctx.quadraticCurveTo(head.x + hx * s * rad[0] * 0.42, head.y + hy * s * rad[0] * 0.42, bulb.x + hx * s * br * 1.2, bulb.y + hy * s * br * 1.2); }
    ctx.strokeStyle = P.acc(has.jaws ? 0.9 : 0.5); px(ctx, has.jaws ? 1.2 : 0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(bulb.x, bulb.y, br * (1 + 0.08 * Math.sin(t * 5 * still)), 0, TAU); ctx.fillStyle = P.fill(0.12); ctx.fill(); ctx.strokeStyle = P.acc(0.75); px(ctx, 1); ctx.stroke();
    ctx.beginPath(); for (const s of [-0.5, 0, 0.5]) { ctx.moveTo(bulb.x + hx * s * br - fx * br * 0.4, bulb.y + hy * s * br - fy * br * 0.4); ctx.lineTo(bulb.x + hx * s * br + fx * br * 0.4, bulb.y + hy * s * br + fy * br * 0.4); } ctx.stroke();
    const dietCol = o.diet < -0.2 ? hsl(128, 45, 70, 0.5 * P.dim) : o.diet > 0.2 ? hsl(340, 50, 76, 0.5 * P.dim) : P.acc(0.45);
    for (let i = 1; i < 4; i++) {
      const c = mid(F, i, 0.5, 0), an = Math.atan2(nrm[i].fy, nrm[i].fx);
      ctx.beginPath(); ctx.ellipse(c.x, c.y, R * 0.5, c.r * (has.gut ? 0.5 : 0.4), an, 0, TAU); ctx.fillStyle = P.fill(has.gut ? 0.14 : 0.07); ctx.fill(); ctx.strokeStyle = P.ink(0.3); px(ctx, 0.85); ctx.stroke();
      ctx.fillStyle = dietCol; ctx.beginPath(); for (let k = 0; k < 5; k++) dot(ctx, c.x + (U.hash(i * 11 + k) - 0.5) * R * 0.6 + Math.sin(t * 0.9 + k + i) * u, c.y + (U.hash(i * 17 + k) - 0.5) * c.r * 0.5, 0.85 * u); ctx.fill();
    }
    // loose cells drifting in the body cavity
    ctx.strokeStyle = P.ink(0.3); px(ctx, 0.75); ctx.beginPath();
    for (let i = 0; i < 11; i++) { const e = mid(F, 1 + (i % 4), 0.5 + 0.4 * Math.sin(t * 0.4 * still + i * 2.1), 0.72 * Math.sin(t * 0.3 * still + i * 1.3)); dot(ctx, e.x, e.y, R * 0.055); }
    ctx.stroke();
    if (has.chloroplast) { ctx.fillStyle = hsl(128, 50, 68, 0.55 * P.dim); ctx.beginPath(); for (let i = 0; i < 12; i++) { const e = mid(F, 1 + (i % 3), U.hash(i * 5), (U.hash(i * 9) - 0.5) * 1.4); dot(ctx, e.x, e.y, 1.2 * u); } ctx.fill(); }

    // ---- culture, written on the body in fine lines
    if (stage >= 7) {
      ctx.beginPath();
      for (let i = 1; i < 5; i++) {
        const c = mid(F, i, 0, 0), n = nrm[i], w = c.r * 0.34, d = R * 0.2;
        for (const k of stage >= 8 ? [0, 0.16] : [0]) { ctx.moveTo(c.x + n.x * w - n.fx * (d + k * R), c.y + n.y * w - n.fy * (d + k * R)); ctx.lineTo(c.x + n.fx * (d - k * R), c.y + n.fy * (d - k * R)); ctx.lineTo(c.x - n.x * w - n.fx * (d + k * R), c.y - n.y * w - n.fy * (d + k * R)); }
      }
      ctx.strokeStyle = P.acc(0.7, 6); px(ctx, 0.9); ctx.stroke();
      if (stage >= 8) { ctx.fillStyle = P.acc(0.8, 8); ctx.beginPath(); for (let i = 1; i < 5; i++) for (const s of [0.62, -0.62]) { const e = mid(F, i, 0, s); dot(ctx, e.x, e.y, 1.1 * u); } ctx.fill(); }
    }
    ctx.restore();

    // ---- lights along its flanks: how it speaks, once it has something to say
    if (stage >= 6) {
      for (let i = 1; i < 5; i++) for (const f of [-0.2, 0.25]) for (const s of [1, -1]) {
        const e = mid(F, i, f, s * 0.8), ph = Math.sin(t * 2.4 - (i + f) * 1.1) * 0.5 + 0.5;
        const lit = (0.2 + 0.4 * ph * (o.sleep ? 0.3 : 1)) + o.sing * (0.5 + 0.5 * Math.sin(t * 14 - (i + f) * 2.2)) + o.flash;
        if (!LOD) B.glow(ctx, e.x, e.y, R * 0.3, P.hue + 45, 80, 80, Math.min(1, lit) * 0.9);
        ctx.beginPath(); ctx.arc(e.x, e.y, 0.9 * u, 0, TAU); ctx.fillStyle = P.acc(Math.min(1, 0.4 + lit), 10); ctx.fill();
      }
    }
    if (stage >= 9) {
      // a six-rayed mark on the brow, and a seed crystal kept close
      ctx.beginPath(); for (let k = 0; k < 3; k++) { const an = k / 3 * Math.PI + t * 0.2; ctx.moveTo(head.x - Math.cos(an) * R * 0.2, head.y - Math.sin(an) * R * 0.2); ctx.lineTo(head.x + Math.cos(an) * R * 0.2, head.y + Math.sin(an) * R * 0.2); }
      ctx.strokeStyle = 'rgba(235,245,255,0.85)'; px(ctx, 0.85); ctx.stroke();
      const an = t * 0.7, cx = q[1].x + Math.cos(an) * R * 2, cy = q[1].y + Math.sin(an) * R * 1.6;
      B.glow(ctx, cx, cy, R * 0.9, 200, 50, 88, 0.6);
      ctx.beginPath(); for (let k = 0; k <= 6; k++) { const b = k / 6 * TAU + an; if (k) ctx.lineTo(cx + Math.cos(b) * R * 0.14, cy + Math.sin(b) * R * 0.14); else ctx.moveTo(cx + Math.cos(b) * R * 0.14, cy + Math.sin(b) * R * 0.14); }
      ctx.strokeStyle = 'rgba(235,245,255,0.9)'; px(ctx, 0.9); ctx.stroke();
    }
    // two eyespots: specks, not windows
    for (const s of [1, -1]) {
      const ex = head.x + fx * rad[0] * 0.35 + hx * s * rad[0] * 0.5, ey = head.y + fy * rad[0] * 0.35 + hy * s * rad[0] * 0.5, er = Math.max(1.2 * u, R * (has.keeneyes ? 0.075 : 0.05));
      if (o.sleep) { ctx.beginPath(); ctx.moveTo(ex - hx * er * 1.3, ey - hy * er * 1.3); ctx.lineTo(ex + hx * er * 1.3, ey + hy * er * 1.3); ctx.strokeStyle = P.ink(0.6); px(ctx, 0.9); ctx.stroke(); continue; }
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fillStyle = 'rgba(2,5,9,0.95)'; ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath(); ctx.arc(ex, ey, er * (has.keeneyes ? 2 : 1.7), 0, TAU); ctx.strokeStyle = P.ink(0.55); px(ctx, 0.8); ctx.stroke();
    }
    // its pulse
    if (!LOD) B.glow(ctx, q[2].x, q[2].y, rad[2] * (0.7 + 0.7 * o.beat), P.hue + 150, 60, 82, 0.14 + 0.3 * o.beat);
    ctx.restore();
  }

  // ---------------------------------------------------------------- one call draws any body

  // o: { id, x, y, ang, R, t, dt, speed 0..1, energy, diet, eat, hurt, pet, beat, flash, sing, fear, sleep, dormant }
  B.draw = function (ctx, sp, o) {
    LOD = o.lod | 0;
    switch (sp.plan) {
      case 'proto': return drawProto(ctx, sp, o);
      case 'rod': return drawRod(ctx, sp, o);
      case 'euk': return drawEuk(ctx, sp, o);
      case 'volvox': return drawVolvox(ctx, sp, o);
      case 'rotifer': return drawRotifer(ctx, sp, o, chain(o.id, o.x, o.y, o.ang, o.R, sp));
      default: return drawBear(ctx, sp, o, chain(o.id, o.x, o.y, o.ang, o.R, sp));
    }
  };

  // A still portrait, filling a canvas. o: { g, stage, traits }
  B.portrait = function (canvas, o) {
    const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height, s = Math.min(w, h);
    const sp = B.spec(o.g, o.stage, o.traits || []);
    const keep = B.unit; B.unit = Math.max(1, s / 170); LOD = 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const bg = ctx.createRadialGradient(w / 2, h / 2, s * 0.05, w / 2, h / 2, s * 0.75);
    bg.addColorStop(0, hsl(sp.hue, 30, 11, 1)); bg.addColorStop(1, hsl(sp.hue + 20, 35, 3.5, 1));
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    const pose = { id: '__portrait', x: w / 2, y: h / 2, ang: -0.45, t: 1.7, dt: 0, speed: 0.3, energy: 0.9, diet: 0, eat: 0, hurt: 0, pet: 0, beat: 0.4, flash: 0, sing: 0, fear: 0, sleep: false, dormant: false };
    if (sp.plan === 'proto') pose.R = s * 0.27;
    else if (sp.plan === 'rod') { pose.R = s * 0.3 / sp.aspect; pose.x = w * 0.58; pose.y = h * 0.46; }
    else if (sp.plan === 'euk') pose.R = s * 0.3 / sp.aspect;
    else if (sp.plan === 'volvox') pose.R = s * 0.32;
    else {
      const R = s * 0.66 / (sp.len + 1.6), seg = R * sp.len / sp.K, a = { p: [] };
      // lay the body out in a gentle curve across the frame
      let x = w / 2 + Math.cos(pose.ang) * R * sp.len * 0.42, y = h / 2 + Math.sin(pose.ang) * R * sp.len * 0.42, dir = pose.ang + Math.PI;
      for (let i = 0; i < sp.K; i++) { a.p.push({ x, y }); dir += 0.13 * Math.sin(i * 0.8 + 0.4); x += Math.cos(dir) * seg; y += Math.sin(dir) * seg; }
      pose.R = R; pose.x = a.p[0].x; pose.y = a.p[0].y;
      if (sp.plan === 'rotifer') drawRotifer(ctx, sp, pose, a); else drawBear(ctx, sp, pose, a);
      B.unit = keep;
      return;
    }
    B.draw(ctx, sp, pose);
    B.unit = keep;
  };
})();

<script>
// Draws the visitors: the other small lives that drift through the field. Each family is a way
// of drawing; species (in data.js) pick a family and a colour. Same darkfield manner as body.js.
(function () {
  'use strict';
  const M = globalThis.MOTE = globalThis.MOTE || {};
  const U = M.U, B = M.Body, TAU = U.TAU, hsl = U.hsl;
  const Wd = M.Wild = {};

  let ctx, hue = 190, alpha = 1;
  const ink = (a, l) => hsl(hue, 34, 84 + (l || 0), a * alpha);
  const acc = (a, h) => hsl(hue + (h || 40), 50, 76, a * alpha);
  const px = n => { ctx.lineWidth = n * B.unit; };
  const dot = (x, y, r) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); };
  // an edge under darkfield: scatter, halo, then the bright line
  function rim(k) {
    k = k === undefined ? 1 : k;
    ctx.strokeStyle = ink(0.07 * k); px(8); ctx.stroke();
    ctx.strokeStyle = ink(0.16 * k); px(3.5); ctx.stroke();
    ctx.strokeStyle = ink(0.92 * k, 6); px(1.15); ctx.stroke();
  }
  const thin = (a, w) => { ctx.strokeStyle = ink(a); px(w || 0.8); ctx.stroke(); };
  function grain(n, rx, ry, seed, t) {
    const u = B.unit;
    ctx.fillStyle = ink(0.5); ctx.beginPath();
    for (let i = 0; i < n; i++) { const a = U.hash(i * 5 + seed) * TAU, d = Math.sqrt(U.hash(i * 11 + seed)), r = (0.6 + 0.5 * Math.abs(Math.sin(t * 1.7 + i))) * u; ctx.rect(Math.cos(a) * d * rx - r, Math.sin(a) * d * ry - r, r * 2, r * 2); }
    ctx.fill();
  }

  const FAM = {
    chain(r, t, v, def) {
      // beads on a string (or, for soot, a clot of them)
      const n = def.id === 'soot' ? 9 : 6, br = r * 0.24;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const x = def.id === 'soot' ? (U.hash(i * 3 + v.uid) - 0.5) * r * 1.4 : (i - (n - 1) / 2) * br * 1.9, y = def.id === 'soot' ? (U.hash(i * 7 + v.uid) - 0.5) * r * 1.2 : Math.sin(i * 0.9 + t * 0.8) * br * 0.7;
        dot(x, y, br * (def.id === 'soot' ? 0.6 + U.hash(i) * 0.8 : 1));
      }
      ctx.fillStyle = ink(0.07); ctx.fill(); rim(0.8);
    },
    spiral(r, t, v, def) {
      if (def.id === 'foram') {
        // chamber after chamber, each a little bigger, wound in a spiral
        ctx.beginPath();
        for (let i = 0; i < 9; i++) { const a = i * 0.85, d = r * 0.12 * Math.pow(1.24, i), cr = r * 0.1 * Math.pow(1.2, i); dot(Math.cos(a) * d, Math.sin(a) * d, cr); }
        ctx.fillStyle = ink(0.06); ctx.fill(); rim(0.85);
        ctx.fillStyle = ink(0.5); ctx.beginPath(); for (let i = 0; i < 9; i++) { const a = i * 0.85, d = r * 0.12 * Math.pow(1.24, i); dot(Math.cos(a) * d, Math.sin(a) * d, 0.8 * B.unit); } ctx.fill();
        return;
      }
      ctx.beginPath();
      for (let i = 0; i <= 50; i++) { const k = i / 50, x = (k - 0.5) * r * 2.4, y = Math.sin(k * 5 * Math.PI - t * 6) * r * 0.22; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
      rim(0.9);
      ctx.beginPath(); for (const s of [-1, 1]) { ctx.moveTo(s * r * 1.2, 0); for (let i = 1; i <= 8; i++) ctx.lineTo(s * (r * 1.2 + i * r * 0.08), Math.sin(i * 1.3 - t * 9) * r * 0.1); } thin(0.5);
    },
    boat(r, t, v, def) {
      // a glass box, pointed at both ends, ruled with lines too fine to count
      const L = r * 1.15, Wh = r * 0.3;
      ctx.beginPath(); ctx.moveTo(-L, 0); ctx.quadraticCurveTo(0, -Wh * 2.1, L, 0); ctx.quadraticCurveTo(0, Wh * 2.1, -L, 0); ctx.closePath();
      ctx.fillStyle = ink(0.06); ctx.fill(); rim();
      ctx.beginPath(); ctx.moveTo(-L * 0.86, 0); ctx.lineTo(-L * 0.08, 0); ctx.moveTo(L * 0.08, 0); ctx.lineTo(L * 0.86, 0);
      for (let i = -11; i <= 11; i++) { if (!i) continue; const x = i / 12 * L, h = Wh * (1 - (x / L) * (x / L)) * 0.95; ctx.moveTo(x, -h); ctx.lineTo(x, -h * 0.2); ctx.moveTo(x, h); ctx.lineTo(x, h * 0.2); }
      thin(0.4, 0.7);
      if (def.id === 'glitter') { ctx.fillStyle = hsl((t * 90 + v.uid * 40) % 360, 80, 75, 0.5 * alpha); ctx.fill(); return; }
      ctx.beginPath(); for (const s of [-0.45, 0.45]) ctx.ellipse(s * L, 0, L * 0.3, Wh * 0.42, 0, 0, TAU); ctx.fillStyle = hsl(42, 70, 62, 0.4 * alpha); ctx.fill();
    },
    disc(r, t, v, def) {
      if (def.id === 'salt') {
        ctx.beginPath(); ctx.rect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4); ctx.fillStyle = ink(0.06); ctx.fill(); rim();
        ctx.beginPath(); ctx.rect(-r * 0.4, -r * 0.4, r * 0.8, r * 0.8); for (const sx of [-1, 1]) for (const sy of [-1, 1]) { ctx.moveTo(sx * r * 0.7, sy * r * 0.7); ctx.lineTo(sx * r * 0.4, sy * r * 0.4); } thin(0.4);
        return;
      }
      // a pillbox seen from above: rings, ribs, and a rosette at the centre
      const flash = def.id === 'flash' ? Math.pow(Math.max(0, Math.sin(t * 1.6 + v.ph)), 12) : 0;
      if (flash > 0.02) B.glow(ctx, 0, 0, r * 4, 215, 90, 70, flash * alpha);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = ink(0.06); ctx.fill(); rim();
      ctx.beginPath(); dot(0, 0, r * 0.86); dot(0, 0, r * 0.3);
      for (let i = 0; i < 28; i++) { const a = i / 28 * TAU; ctx.moveTo(Math.cos(a) * r * 0.32, Math.sin(a) * r * 0.32); ctx.lineTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85); }
      thin(0.35, 0.7);
      ctx.fillStyle = acc(0.6, def.id === 'flash' ? 0 : -150); ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; dot(Math.cos(a) * r * 0.16, Math.sin(a) * r * 0.16, r * 0.045); } ctx.fill();
      ctx.fillStyle = ink(0.5); ctx.beginPath(); for (let i = 0; i < 28; i++) { const a = (i + 0.5) / 28 * TAU; dot(Math.cos(a) * r * 0.93, Math.sin(a) * r * 0.93, 0.7 * B.unit); } ctx.fill();
    },
    crescent(r, t, v, def) {
      if (def.id === 'letter') {
        ctx.font = `italic ${Math.round(r * 1.8)}px Newsreader, Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        B.glow(ctx, 0, 0, r * 1.6, 46, 40, 80, 0.3 * alpha);
        ctx.fillStyle = `rgba(245,240,225,${0.9 * alpha})`; ctx.fillText('qwkgyz&?'[v.uid % 8], 0, 0);
        return;
      }
      // a green new moon: two halves sharing a middle
      ctx.beginPath(); ctx.arc(0, r * 1.5, r * 1.9, -Math.PI * 0.76, -Math.PI * 0.24); ctx.arc(0, r * 2.4, r * 2.5, -Math.PI * 0.33, -Math.PI * 0.67, true); ctx.closePath();
      ctx.fillStyle = hsl(125, 50, 55, 0.12 * alpha); ctx.fill(); rim();
      ctx.beginPath(); ctx.arc(0, r * 1.95, r * 2.2, -Math.PI * 0.7, -Math.PI * 0.3); ctx.strokeStyle = hsl(125, 50, 70, 0.6 * alpha); px(1.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -r * 0.42); ctx.lineTo(0, -r * 0.1); thin(0.5);
    },
    slipper(r, t, v, def) {
      const eug = def.id === 'euglena', a = r * (eug ? 1.2 : 1.25), b = r * (eug ? 0.34 : 0.48), N = 44, pts = [];
      for (let i = 0; i < N; i++) { const th = i / N * TAU, c = Math.cos(th), s = Math.sin(th), w = eug ? 1 + 0.12 * Math.sin(t * 2 + c * 3) : 1; pts.push([c * a * (1 + 0.06 * c), s * b * (1 - 0.2 * c) * w]); }
      if (!eug) { ctx.beginPath(); for (let i = 0; i < N; i++) { const p = pts[i], d = Math.hypot(p[0], p[1]) || 1, sw = Math.sin(t * 10 - i * 0.6) * 0.5; ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] + (p[0] / d * Math.cos(sw) - p[1] / d * Math.sin(sw)) * r * 0.16, p[1] + (p[1] / d * Math.cos(sw) + p[0] / d * Math.sin(sw)) * r * 0.16); } thin(0.45, 0.7); }
      else { ctx.beginPath(); ctx.moveTo(a, 0); for (let i = 1; i <= 14; i++) ctx.lineTo(a + i * r * 0.09, Math.sin(i * 0.9 - t * 9) * r * 0.14); thin(0.6); }
      ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath();
      ctx.fillStyle = eug ? hsl(118, 50, 55, 0.14 * alpha) : ink(0.06); ctx.fill(); rim();
      ctx.save(); ctx.clip(); grain(eug ? 30 : 50, a, b, v.uid, t); ctx.restore();
      ctx.beginPath(); ctx.ellipse(-a * 0.1, 0, a * 0.22, b * 0.4, 0, 0, TAU); thin(0.55, 0.9);
      if (eug) { ctx.beginPath(); ctx.arc(a * 0.7, -b * 0.2, Math.max(1.2 * B.unit, r * 0.06), 0, TAU); ctx.fillStyle = hsl(8, 85, 60, alpha); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(a * 0.6, -b * 0.5); ctx.quadraticCurveTo(a * 0.2, -b * 0.2, a * 0.05, b * 0.2); thin(0.4); }
    },
    sun(r, t, v, def) {
      // a small star: fine rays, each beaded, round a foamy core
      const ice = def.id === 'snow', n = ice ? 6 : 30;
      B.glow(ctx, 0, 0, r * 1.6, hue, 40, 80, 0.2 * alpha);
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU, len = r * (ice ? 1.5 : 1.3 + 0.5 * U.hash(i + v.uid)), c = Math.cos(a), s = Math.sin(a);
        ctx.moveTo(c * r * 0.3, s * r * 0.3); ctx.lineTo(c * len, s * len);
        if (ice) for (const k of [0.45, 0.7]) for (const sd of [1, -1]) { ctx.moveTo(c * len * k, s * len * k); ctx.lineTo(c * len * k + Math.cos(a + sd * 1.05) * r * 0.3, s * len * k + Math.sin(a + sd * 1.05) * r * 0.3); }
      }
      thin(ice ? 0.85 : 0.5, ice ? 1 : 0.7);
      if (ice) return;
      ctx.fillStyle = ink(0.7); ctx.beginPath(); for (let i = 0; i < n; i++) { const a = i / n * TAU, k = 0.5 + 0.4 * ((t * 0.15 + U.hash(i)) % 1), len = r * (1.3 + 0.5 * U.hash(i + v.uid)); dot(Math.cos(a) * len * k, Math.sin(a) * len * k, 0.8 * B.unit); } ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.fillStyle = ink(0.08); ctx.fill(); rim();
      ctx.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * TAU + 0.3; dot(Math.cos(a) * r * 0.27, Math.sin(a) * r * 0.27, r * 0.09); } dot(0, 0, r * 0.12); thin(0.45);
    },
    bell(r, t, v) {
      // a bell on a spring: every so often it snaps shut and the stalk coils tight
      const snap = Math.pow(Math.max(0, Math.sin(t * 0.7 + v.ph)), 20), L = r * 2.4 * (1 - 0.6 * snap), w = r * (0.75 - 0.25 * snap);
      ctx.beginPath(); ctx.moveTo(0, 0);
      for (let i = 1; i <= 30; i++) { const k = i / 30; ctx.lineTo(Math.sin(k * (6 + 16 * snap) * Math.PI) * r * 0.1 * (0.3 + snap), k * L); }
      thin(0.7, 1);
      ctx.beginPath(); ctx.moveTo(-w, -r * 0.9); ctx.quadraticCurveTo(-w * 1.05, -r * 0.1, 0, 0); ctx.quadraticCurveTo(w * 1.05, -r * 0.1, w, -r * 0.9); ctx.quadraticCurveTo(0, -r * (0.75 + 0.3 * snap), -w, -r * 0.9); ctx.closePath();
      ctx.fillStyle = ink(0.07); ctx.fill(); rim();
      if (snap < 0.3) { ctx.beginPath(); for (let i = 0; i <= 12; i++) { const x = (i / 12 * 2 - 1) * w, sw = Math.sin(t * 12 - i * 0.8) * 0.4; ctx.moveTo(x, -r * 0.9); ctx.lineTo(x + Math.sin(sw) * r * 0.2, -r * 0.9 - Math.cos(sw) * r * 0.22); } thin(0.6, 0.7); }
      ctx.beginPath(); ctx.arc(0, -r * 0.45, r * 0.22, 0.4, Math.PI * 1.3); thin(0.5, 1.4);
    },
    trumpet(r, t, v) {
      // one cell shaped like a horn, with a wreath of hairs round the mouth
      const L = r * 2, w = r * 0.8;
      ctx.beginPath(); ctx.moveTo(-w, -L * 0.5); ctx.bezierCurveTo(-w * 0.9, 0, -w * 0.12, L * 0.2, -r * 0.05, L * 0.5); ctx.lineTo(r * 0.05, L * 0.5); ctx.bezierCurveTo(w * 0.12, L * 0.2, w * 0.9, 0, w, -L * 0.5); ctx.quadraticCurveTo(0, -L * 0.36, -w, -L * 0.5); ctx.closePath();
      ctx.fillStyle = ink(0.07); ctx.fill(); rim();
      ctx.save(); ctx.clip();
      ctx.beginPath(); for (let k = -3; k <= 3; k++) { ctx.moveTo(k / 4 * w, -L * 0.5); ctx.quadraticCurveTo(k / 4 * w * 0.5, 0, 0, L * 0.5); } thin(0.2, 0.7);
      ctx.beginPath(); for (let i = 0; i < 7; i++) dot(w * 0.25 - i * w * 0.05, -L * 0.3 + i * L * 0.08, r * 0.07); thin(0.6, 0.9);
      ctx.restore();
      ctx.beginPath(); for (let i = 0; i <= 18; i++) { const x = (i / 18 * 2 - 1) * w, sw = Math.sin(t * 13 - i * 0.7) * 0.5; ctx.moveTo(x, -L * 0.5 + (1 - (x / w) * (x / w)) * L * 0.07); ctx.lineTo(x + Math.sin(sw) * r * 0.2, -L * 0.5 - r * 0.22 * Math.cos(sw)); } thin(0.6, 0.7);
    },
    star(r, t, v, def) {
      if (def.id === 'pollen') {
        // a grain with two air sacs, built to travel
        ctx.beginPath(); dot(-r * 0.75, r * 0.3, r * 0.55); dot(r * 0.75, r * 0.3, r * 0.55); ctx.fillStyle = ink(0.05); ctx.fill(); rim(0.7);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, TAU); ctx.fillStyle = hsl(52, 60, 60, 0.14 * alpha); ctx.fill(); rim();
        ctx.save(); ctx.beginPath(); dot(-r * 0.75, r * 0.3, r * 0.55); dot(r * 0.75, r * 0.3, r * 0.55); ctx.clip(); ctx.beginPath(); for (let i = -8; i <= 8; i++) { ctx.moveTo(i * r * 0.17 - r, -r); ctx.lineTo(i * r * 0.17 + r, r); ctx.moveTo(i * r * 0.17 + r, -r); ctx.lineTo(i * r * 0.17 - r, r); } thin(0.2, 0.6); ctx.restore();
        return;
      }
      // a cathedral of glass: a lattice sphere, and spines to hold the water off
      B.glow(ctx, 0, 0, r * 1.4, hue, 40, 80, 0.16 * alpha);
      ctx.beginPath(); for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + v.ph, len = r * (1.5 + 0.4 * (i % 2)); ctx.moveTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9); ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len); } thin(0.7, 0.9);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.9, 0, TAU); ctx.fillStyle = ink(0.05); ctx.fill(); rim();
      ctx.beginPath();
      for (let ring = 1; ring <= 3; ring++) { const rr = r * 0.9 * ring / 3.4, n = ring * 6; for (let i = 0; i < n; i++) { const a = i / n * TAU + ring * 0.3 + t * 0.05; dot(Math.cos(a) * rr, Math.sin(a) * rr, r * 0.11); } }
      dot(0, 0, r * 0.11); thin(0.42, 0.7);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, TAU); thin(0.6, 0.9);
    },
    worm(r, t, v, def) {
      // it thrashes; that is the whole of its method
      const gas = def.id === 'gastro', n = 26, L = r * (gas ? 1.6 : 2.6), w = r * (gas ? 0.22 : 0.09), pts = [];
      for (let i = 0; i <= n; i++) { const k = i / n; pts.push([(k - 0.5) * L, Math.sin(k * (gas ? 3 : 7) - t * (gas ? 3 : 6)) * r * (gas ? 0.12 : 0.34) * (0.3 + k)]); }
      const out = [];
      for (let i = 0; i <= n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, k = i / n, ww = w * Math.sin(Math.PI * Math.min(1, 0.12 + k * 0.95)) * (gas ? 1 + 0.3 * Math.sin(k * 3) : 1); out.push([pts[i][0] - dy / d * ww, pts[i][1] + dx / d * ww, pts[i][0] + dy / d * ww, pts[i][1] - dx / d * ww]); }
      ctx.beginPath(); out.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); for (let i = n; i >= 0; i--) ctx.lineTo(out[i][2], out[i][3]); ctx.closePath();
      ctx.fillStyle = ink(0.07); ctx.fill(); rim();
      ctx.beginPath(); pts.forEach((p, i) => (i > 2 && i < n - 2 ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); thin(0.35, 0.8);
      if (gas) { ctx.beginPath(); for (let i = 3; i < n - 2; i += 2) for (const s of [0, 2]) { ctx.moveTo(out[i][s], out[i][s + 1]); ctx.lineTo(out[i][s] - r * 0.1, out[i][s + 1] + (s ? -1 : 1) * r * 0.14); } thin(0.5, 0.7); }
    },
    flea(r, t, v) {
      // see-through, with its heart on show, rowing as if late for something
      const row = Math.sin(t * 5 + v.ph);
      ctx.beginPath();
      for (const s of [1, -1]) { ctx.moveTo(r * 0.55, s * r * 0.25); ctx.lineTo(r * 0.9, s * r * (0.9 + 0.25 * row)); for (const k of [-0.5, 0, 0.5]) { ctx.moveTo(r * 0.9, s * r * (0.9 + 0.25 * row)); ctx.lineTo(r * (1.25 + k * 0.3), s * r * (1.4 + 0.3 * row - Math.abs(k) * 0.2)); } }
      thin(0.7, 0.9);
      ctx.beginPath(); ctx.moveTo(r * 0.95, 0); ctx.quadraticCurveTo(r * 0.6, -r * 0.85, -r * 0.5, -r * 0.7); ctx.quadraticCurveTo(-r * 1.05, -r * 0.2, -r * 0.9, r * 0.25); ctx.lineTo(-r * 1.45, r * 0.5); ctx.lineTo(-r * 0.8, r * 0.45); ctx.quadraticCurveTo(r * 0.3, r * 0.95, r * 0.95, 0); ctx.closePath();
      ctx.fillStyle = ink(0.06); ctx.fill(); rim();
      ctx.beginPath(); ctx.moveTo(r * 0.4, r * 0.1); ctx.quadraticCurveTo(-r * 0.2, r * 0.5, -r * 0.6, -r * 0.1); thin(0.4, 1.4);
      ctx.beginPath(); dot(-r * 0.25, -r * 0.4, r * 0.14); dot(-r * 0.52, -r * 0.3, r * 0.13); thin(0.6, 0.9);
      const beat = 0.7 + 0.3 * Math.abs(Math.sin(t * 7));
      B.glow(ctx, r * 0.1, -r * 0.42, r * 0.3 * beat, 350, 70, 70, 0.6 * alpha);
      ctx.globalCompositeOperation = 'source-over'; ctx.beginPath(); ctx.arc(r * 0.6, -r * 0.05, Math.max(1.4 * B.unit, r * 0.11), 0, TAU); ctx.fillStyle = `rgba(3,6,10,${0.95 * alpha})`; ctx.fill(); ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath(); ctx.arc(r * 0.6, -r * 0.05, r * 0.17, 0, TAU); thin(0.6, 0.8);
    },
  };

  // v: the visitor (sim state). def: its species. fresh: not yet in the book.
  Wd.draw = function (c, def, v, t, fresh) {
    ctx = c; hue = def.hue;
    alpha = Math.min(1, v.t / 3) * (v.t > v.life ? Math.max(0, 1 - (v.t - v.life) / 30) : 1);
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.translate(v.x, v.y);
    if (fresh) {
      // something not yet written down: a faint ring, asking to be looked at
      const k = (t * 0.5 + v.ph) % 1;
      ctx.beginPath(); ctx.arc(0, 0, v.r * (1.5 + 0.9 * k), 0, TAU); ctx.strokeStyle = `rgba(255,248,225,${0.35 * (1 - k) * alpha})`; px(1); ctx.stroke();
    }
    ctx.rotate(v.ang);
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    (FAM[def.fam] || FAM.disc)(v.r, t + v.ph, v, def);
    ctx.restore();
  };
  // A still portrait for the book.
  Wd.portrait = function (canvas, def) {
    const c = canvas.getContext('2d'), w = canvas.width, h = canvas.height, s = Math.min(w, h), keep = B.unit;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
    c.fillStyle = '#03080c'; c.fillRect(0, 0, w, h);
    B.unit = Math.max(1, s / 150);
    const big = { worm: 0.2, bell: 0.2, trumpet: 0.22, flea: 0.26, sun: 0.22, star: 0.24, spiral: 0.3, chain: 0.34 };
    Wd.draw(c, def, { x: w / 2, y: h / 2 + (def.fam === 'bell' ? -s * 0.18 : 0), ang: def.fam === 'bell' || def.fam === 'trumpet' ? 0 : -0.4, r: s * (big[def.fam] || 0.32), t: 9, life: 99, ph: 0.6, uid: 3 }, 1.3, false);
    B.unit = keep;
  };
})();

  // ---------------------------------------------------------------- the water itself

  function background(sim, view, P) {

    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, HR * 0.955, -2.5, -1.8); ctx.strokeStyle = `rgba(255,255,255,${0.2 + 0.25 * L})`; ctx.lineWidth = Math.max(1.3 * u, HR * 0.004); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, HR * 0.955, -1.68, -1.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, HR * 0.97, 0.7, 1.05); ctx.strokeStyle = `rgba(255,255,255,${0.07 + 0.08 * L})`; ctx.stroke();
    // pools of light
    for (const b of s.beams) {
      const a = Math.min(1, b.t / 2, (b.life - b.t) / 3);
      B.glow(ctx, b.x, b.y, b.r * 1.5, P.star, 60, 82, 0.42 * a);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.strokeStyle = hsl(P.star, 60, 86, 0.12 * a); px(1); ctx.stroke();
    }
  }

  // ---------------------------------------------------------------- things in the water

  function fixture(f, sim, P) {
    const L = P.L, night = 1.35 - L, x = f.x, y = f.y, u = B.unit;
    const grow = Math.min(1, f.t / 1.2);                // a newly placed thing unfolds
    ctx.lineCap = 'round';
    switch (f.type) {
      case 'algae': {
        // filaments: chains of long cells, each with its green ribbon
        const n = 6, lit = sim.lightAt(x, y);
        B.glow(ctx, x, y, 40, 125, 50, 55, 0.08 + 0.12 * lit);
        for (let i = 0; i < n; i++) {
          const a = i / n * TAU + f.ph, len = (24 + 14 * U.hash(f.id * 7 + i)) * grow, segs = 5;
          let px0 = x, py0 = y; const pts = [[x, y]];
          for (let k = 1; k <= segs; k++) { const kk = k / segs, sw = Math.sin(T * 0.8 + i * 1.7 + f.ph + kk * 2) * 0.35 * kk; px0 = x + Math.cos(a + sw) * len * kk; py0 = y + Math.sin(a + sw) * len * kk; pts.push([px0, py0]); }
          ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k <= segs; k++) ctx.lineTo(pts[k][0], pts[k][1]);
          ctx.strokeStyle = hsl(125, 40, 60 + 16 * lit, 0.3); ctx.lineWidth = 3.4; ctx.stroke();
          ctx.strokeStyle = hsl(122, 50, 72 + 10 * lit, 0.9); px(1); ctx.stroke();
          ctx.fillStyle = hsl(118, 60, 80, 0.85); ctx.beginPath(); for (let k = 1; k <= segs; k++) dot(pts[k][0], pts[k][1], 1.1 * u); ctx.fill();
          const tip = pts[segs]; B.glow(ctx, tip[0], tip[1], 5 + 6 * (f.gr || 0), 110, 70, 70, 0.3 + 0.5 * (f.gr || 0));
        }
        break;
      }
      case 'rock': {
        // a grain of quartz, big as a house
        ctx.save(); ctx.translate(x, y); ctx.rotate(f.ph);
        const n = 7, pts = [];
        for (let i = 0; i < n; i++) { const a = i / n * TAU, r = f.r * (0.72 + 0.3 * U.hash(f.id * 3 + i)) * grow; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
        ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath();
        ctx.fillStyle = hsl(P.H + 20, 20, 30, 0.1); ctx.fill();
        ctx.strokeStyle = hsl(P.H, 25, 82, 0.1); px(6); ctx.stroke(); ctx.strokeStyle = hsl(P.H, 25, 82, 0.7); px(1.1); ctx.stroke();
        ctx.beginPath(); for (let i = 0; i < n; i += 2) { ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[(i + 3) % n][0] * 0.3, pts[(i + 3) % n][1] * 0.3); } ctx.moveTo(pts[1][0] * 0.3, pts[1][1] * 0.3); ctx.lineTo(pts[4][0] * 0.3, pts[4][1] * 0.3);
        ctx.strokeStyle = hsl(P.H, 25, 80, 0.2); px(0.8); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, f.r * 0.3, f.r * 0.22, 0, 0, TAU); ctx.fillStyle = 'rgba(0,3,7,0.5)'; ctx.fill(); ctx.strokeStyle = hsl(P.H, 25, 80, 0.25); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'cleaner': {
        B.glow(ctx, x, y, 26, 170, 40, 72, 0.1);
        ctx.strokeStyle = hsl(168, 35, 82, 0.8); px(0.9);
        for (let i = 0; i < 9; i++) {
          const a = T * (0.5 + 0.1 * (i % 4)) + i * 1.9, d = (5 + 13 * U.hash(f.id + i * 3)) * grow * (1 + 0.15 * Math.sin(T * 2 + i)), cx = x + Math.cos(a) * d, cy = y + Math.sin(a * 1.2) * d;
          ctx.beginPath(); ctx.ellipse(cx, cy, 2.6, 1.2, a + 1.5, 0, TAU); ctx.stroke();
        }
        break;
      }
      case 'glowcap': {
        const pulse = 0.85 + 0.15 * Math.sin(T * 1.4 + f.ph);
        B.glow(ctx, x, y, 140 * grow, 52, 70, 74, 0.16 * night * pulse);
        B.glow(ctx, x, y, 22 * grow, 52, 80, 84, 0.7 * pulse);
        ctx.strokeStyle = hsl(50, 70, 88, 0.85); px(1);
        ctx.beginPath(); ctx.arc(x, y, 6 * grow, 0, TAU); ctx.stroke();
        ctx.beginPath(); for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + f.ph + T * 0.1; ctx.moveTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8); ctx.lineTo(x + Math.cos(a) * (12 + 2 * (i % 2)) * grow, y + Math.sin(a) * (12 + 2 * (i % 2)) * grow); } ctx.strokeStyle = hsl(46, 60, 80, 0.5); px(0.8); ctx.stroke();
        break;
      }
      case 'vent': {
        B.glow(ctx, x, y, 110, 22, 70, 58, 0.16);
        ctx.strokeStyle = hsl(24, 50, 72, 0.7); px(1);
        for (const k of [1, 0.66, 0.36]) { ctx.beginPath(); ctx.ellipse(x, y, f.r * k * grow, f.r * 0.8 * k * grow, 0, 0, TAU); ctx.stroke(); }
        B.glow(ctx, x, y, f.r * 0.8, 26, 90, 64, 0.6 + 0.2 * Math.sin(T * 3 + f.ph));
        if (Math.random() < 0.12) add({ k: 'dot', x: x + (Math.random() - 0.5) * 12, y, vx: (Math.random() - 0.5) * 8, vy: -(14 + Math.random() * 18), life: 1.8, hue: 26, sat: 80, r: 1.3 });
        break;
      }
      case 'bubbler': {
        ctx.beginPath(); ctx.arc(x, y, f.r * 0.6 * grow, 0, TAU); ctx.strokeStyle = 'rgba(215,240,255,0.7)'; px(1); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, f.r * 0.6 * grow, -2.4, -1.6); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; px(1.6); ctx.stroke();
        if (Math.random() < 0.2) bubbles(x, y, 1, 10);
        break;
      }
      case 'toy': {
        // a grain of pollen: a spiked ball, and to something this size, a toy
        const a = f.ph + (f.x + f.y) * 0.03, r = f.r * 0.8 * grow;
        B.glow(ctx, x, y, 28, 55, 60, 72, 0.2);
        ctx.strokeStyle = hsl(52, 55, 82, 0.9); px(1);
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = hsl(52, 50, 60, 0.12); ctx.fill(); ctx.stroke();
        ctx.beginPath(); for (let i = 0; i < 14; i++) { const b = a + i / 14 * TAU; ctx.moveTo(x + Math.cos(b) * r, y + Math.sin(b) * r); ctx.lineTo(x + Math.cos(b) * r * 1.4, y + Math.sin(b) * r * 1.4); } px(0.8); ctx.stroke();
        ctx.beginPath(); for (let i = 0; i < 3; i++) { const b = a + i / 3 * TAU; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(b) * r * 0.8, y + Math.sin(b) * r * 0.8); } ctx.strokeStyle = hsl(52, 55, 82, 0.35); ctx.stroke();
        break;
      }
      case 'egg': {
        const hue = f.g ? f.g.v.hue * 360 : 50, near = U.clamp01((f.t - 120) / 30), wob = Math.sin(T * (2 + 10 * near)) * 0.12 * near, k = Math.min(1, f.t / 150);

        ctx.save(); ctx.translate(x, y); ctx.rotate(wob);
        ctx.beginPath(); ctx.ellipse(0, 0, f.r * 0.8 * grow, f.r * grow, 0, 0, TAU); ctx.fillStyle = hsl(hue, 30, 70, 0.08); ctx.fill(); ctx.strokeStyle = hsl(hue, 40, 88, 0.9); px(1.2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, f.r * 0.68 * grow, f.r * 0.88 * grow, 0, 0, TAU); ctx.strokeStyle = hsl(hue, 40, 88, 0.25); px(0.8); ctx.stroke();

        ctx.beginPath(); ctx.arc(0, f.r * 0.1, f.r * (0.2 + 0.3 * k), 0.6, 0.6 + TAU * (0.35 + 0.5 * k)); ctx.strokeStyle = hsl(hue, 50, 82, 0.85); px(1.6 + 2.5 * k); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'cairn': {
        B.glow(ctx, x, y - 14, 60, 46, 60, 74, 0.08 + 0.16 * night);
        ctx.strokeStyle = hsl(P.H, 25, 80, 0.7); px(1);
        for (let k = 0; k < 4; k++) {
          const rr = (f.r - k * 3.6) * grow, yy = y - k * 7.5 * grow;
          ctx.beginPath(); ctx.ellipse(x + Math.sin(f.ph + k) * 2, yy, rr, rr * 0.5, 0, 0, TAU); ctx.fillStyle = hsl(P.H + 20, 20, 14 + k * 3, 0.75); ctx.fill(); ctx.stroke();
        }
        B.glow(ctx, x, y - 33 * grow, 13, 46, 80, 84, 0.7 + 0.2 * Math.sin(T * 2 + f.ph));
        break;
      }
    }
  }

  // The seed crystal: six-fold, grown arm by arm, to ride the vapour up.
  function seed(sim) {
    const s = sim.s, l = s.lantern;
    if (!l) return;
    const pr = sim.lanternProgress(), x = l.x, y = l.y, Lg = 20 + 62 * pr, u = B.unit;
    B.glow(ctx, x, y, 90 + 190 * pr, 205, 50, 82, 0.1 + 0.24 * pr);
    ctx.save(); ctx.translate(x, y); ctx.rotate(T * 0.03);
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(232,244,255,${0.55 + 0.4 * pr})`; px(1.1);
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = k / 6 * TAU, ca = Math.cos(a), sa = Math.sin(a);
      ctx.moveTo(0, 0); ctx.lineTo(ca * Lg, sa * Lg);
      // side branches appear as the arm passes them
      for (let j = 1; j <= 5; j++) {
        const at = j / 6, grown = U.clamp01((pr - at * 0.8) * 5);
        if (grown <= 0) continue;
        const bl = Lg * (0.34 - j * 0.04) * grown, bx = ca * Lg * at, by = sa * Lg * at;
        for (const sd of [1, -1]) { const b = a + sd * 1.047; ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(b) * bl, by + Math.sin(b) * bl); if (j === 2 && pr > 0.7) { const cx = bx + Math.cos(b) * bl * 0.6, cy = by + Math.sin(b) * bl * 0.6; ctx.moveTo(cx, cy); ctx.lineTo(cx + ca * bl * 0.4, cy + sa * bl * 0.4); } }
      }
    }
    ctx.stroke();
    ctx.beginPath(); for (let k = 0; k <= 6; k++) { const a = k / 6 * TAU + 0.5236; if (k) ctx.lineTo(Math.cos(a) * Lg * 0.16, Math.sin(a) * Lg * 0.16); else ctx.moveTo(Math.cos(a) * Lg * 0.16, Math.sin(a) * Lg * 0.16); } ctx.stroke();
    ctx.fillStyle = 'rgba(240,248,255,0.9)'; ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; dot(Math.cos(a) * Lg, Math.sin(a) * Lg, 1.2 * u); } ctx.fill();
    ctx.restore();
    B.glow(ctx, x, y, 14 + 26 * pr, 200, 40, 92, (0.4 + 0.6 * pr) * (0.85 + 0.15 * Math.sin(T * 2.2)));
    if (pr >= 1) for (let i = 0; i < 2; i++) if (Math.random() < 0.3) add({ k: 'dot', x: x + (Math.random() - 0.5) * Lg * 2, y: y + (Math.random() - 0.5) * Lg * 2, vx: 0, vy: -(10 + Math.random() * 30), life: 2, hue: 205, sat: 40, r: 1.4 });
  }

  function foods(sim, P) {
    const u = B.unit, letters = P.wm.letters;
    for (const f of sim.s.foods) {
      const def = D.FOODS[f.kind], old = U.clamp01((f.age - def.life * 0.75) / (def.life * 0.25)), a = 1 - 0.6 * old;
      if (letters && f.kind === 'nutrient') {
        // in this place the food is words
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(Math.sin(f.ph + T * 0.4) * 0.5);
        ctx.font = `italic ${9}px Newsreader, Georgia, serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(245,240,225,${0.9 * a})`; ctx.fillText('aeioustrnlhd'[f.id % 12], 0, 0);
        ctx.restore();
        B.glow(ctx, f.x, f.y, 9, 46, 40, 80, 0.3 * a);
      } else if (f.kind === 'nutrient') {
        B.glow(ctx, f.x, f.y, 7, 46, 60, 76, 0.4 * a);
        ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(1.1 * u, 1.5), 0, TAU); ctx.fillStyle = hsl(48 - 20 * old, 70 - 40 * old, 84, 0.95 * a); ctx.fill();
      } else if (f.kind === 'mineral') {
        B.glow(ctx, f.x, f.y, 8, 200, 40, 84, 0.4 * a);
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ph + T * 0.5);
        ctx.beginPath(); ctx.moveTo(0, -3.6); ctx.lineTo(2.6, 0); ctx.lineTo(0, 3.6); ctx.lineTo(-2.6, 0); ctx.closePath();
        ctx.strokeStyle = hsl(200, 40, 90, 0.9 * a); px(0.9); ctx.stroke(); ctx.restore();
      } else if (f.kind === 'algae') {
        B.glow(ctx, f.x, f.y, 10, 122, 60, 60, 0.4 * a);
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ph + T * 0.3);
        ctx.beginPath(); ctx.ellipse(0, 0, 4.4, 2.2, 0, 0, TAU); ctx.strokeStyle = hsl(118 - 50 * old, 50 - 30 * old, 76, 0.9 * a); px(0.9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-2.6, 0); ctx.lineTo(2.6, 0); ctx.strokeStyle = hsl(118 - 50 * old, 60 - 30 * old, 66, 0.9 * a); px(1.3); ctx.stroke();
        ctx.restore();
      } else {
        const b = Math.atan2(f.vy, f.vx), k = Math.sin(T * 11 + f.id) * 0.5;
        B.glow(ctx, f.x, f.y, 11, 330, 50, 74, 0.3 * a);
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(b);
        ctx.strokeStyle = hsl(332, 45, 86, 0.9 * a); px(0.9);
        ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.6, 0, 0, TAU);
        ctx.moveTo(4, -1.6); ctx.lineTo(10, -5 - 2 * k); ctx.moveTo(4, 1.6); ctx.lineTo(10, 5 + 2 * k); ctx.moveTo(-5, 0); ctx.lineTo(-10, 3 * k);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(2.6, 0, 0.9, 0, TAU); ctx.fillStyle = hsl(8, 70, 62, a); ctx.fill();
        ctx.restore();
      }
    }
  }

  function wastes(sim) {
    // murk: loose drifts of dull specks
    const u = B.unit;
    ctx.fillStyle = 'rgba(150,126,84,0.5)';
    ctx.beginPath();
    for (const w of sim.s.wastes) for (let i = 0; i < 9; i++) { const a = w.ph + i * 2.4 + T * 0.07, d = w.r * (0.25 + 0.75 * U.hash(w.id * 5 + i)); dot(w.x + Math.cos(a) * d, w.y + Math.sin(a * 1.3) * d, (0.7 + U.hash(i + w.id) * 1.1) * Math.max(u, 0.8)); }
    ctx.fill();
    for (const w of sim.s.wastes) { ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.fillStyle = 'rgba(90,74,44,0.1)'; ctx.fill(); }
  }

  function motes(sim) {
    for (const m of sim.s.motes) {
      const fade = Math.min(1, m.t * 3, (m.life - m.t) / 4), pulse = 1 + 0.25 * Math.sin(T * 4 + m.ph), hue = m.gift ? 325 : 48;
      B.glow(ctx, m.x, m.y, 20 * pulse, hue, 80, 78, 0.6 * fade);
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(T * 0.8 + m.ph);
      ctx.fillStyle = `rgba(255,252,238,${0.95 * fade})`;
      for (let i = 0; i < 2; i++) { ctx.rotate(Math.PI / 2 * i); ctx.beginPath(); ctx.moveTo(0, -7 * pulse); ctx.quadraticCurveTo(0.7, 0, 0, 7 * pulse); ctx.quadraticCurveTo(-0.7, 0, 0, -7 * pulse); ctx.fill(); }
      ctx.restore();
    }
  }

  function threats(sim) {
    const c = sim.s.c, u = B.unit;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const t of sim.s.threats) {
      const flash = Math.max(0, t.flash), col = (a, l) => (flash > 0.3 ? `rgba(255,255,255,${a})` : hsl(350, 70, l === undefined ? 74 : l, a));
      if (t.kind === 'virus') {
        // head, collar, tail, and six legs to land on
        const r = t.r * (t.att ? 0.8 + 0.12 * Math.sin(T * 9) : 1), a = t.att ? Math.atan2(c.y - t.y, c.x - t.x) : Math.atan2(t.vy, t.vx);
        B.glow(ctx, t.x, t.y, r * 2.6, 350, 70, 62, 0.35);
        ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(a);
        ctx.strokeStyle = col(0.95); px(1);
        ctx.beginPath(); for (let i = 0; i <= 6; i++) { const b = i / 6 * TAU; if (i) ctx.lineTo(-r * 0.3 + Math.cos(b) * r * 0.7, Math.sin(b) * r * 0.7); else ctx.moveTo(-r * 0.3 + r * 0.7, 0); }
        ctx.fillStyle = col(0.14); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-r * 0.3, 0); ctx.lineTo(-r * 0.3 + Math.cos(1.05) * r * 0.7, Math.sin(1.05) * r * 0.7); ctx.moveTo(-r * 0.3, 0); ctx.lineTo(-r * 0.3 + Math.cos(-1.05) * r * 0.7, Math.sin(-1.05) * r * 0.7); ctx.moveTo(-r * 0.3, 0); ctx.lineTo(-r, 0);
        ctx.moveTo(r * 0.4, 0); ctx.lineTo(r * 1.3, 0); ctx.moveTo(r * 0.55, -r * 0.2); ctx.lineTo(r * 0.55, r * 0.2);
        const leg = Math.sin(T * 6 + t.id) * 0.15;
        for (const sd of [1, -1]) for (const k of [0.5, 0.9, 1.3]) { ctx.moveTo(r * 1.3, 0); ctx.lineTo(r * (1.3 - 0.1 * k), sd * r * (0.5 + leg)); ctx.lineTo(r * (1.3 + 0.5 * k), sd * r * (0.8 + 0.1 * k)); }
        px(0.85); ctx.stroke();
        ctx.restore();
      } else if (t.kind === 'engulfer') {
        // an amoeba: all appetite, no shape
        const toward = Math.atan2(c.y - t.y, c.x - t.x), N = 40, pts = [];
        B.glow(ctx, t.x, t.y, t.r * 1.8, 350, 50, 36, 0.25);
        for (let i = 0; i < N; i++) {
          const a = i / N * TAU, reach = Math.max(0, Math.cos(a - toward)) * 0.24 * (t.state === 'leave' ? 0 : 1);
          const r = t.r * (1 + 0.2 * U.noise(i * 0.32 + T * 0.7, t.id) + 0.1 * U.noise(i * 0.9 - T * 0.5, t.id + 5) + reach * (0.6 + 0.4 * Math.sin(T * 2)));

        for (let i = 0; i < N; i++) { const p = pts[i], q = pts[(i + 1) % N]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
        ctx.closePath();
        ctx.fillStyle = flash > 0.3 ? 'rgba(255,255,255,0.3)' : 'rgba(40,8,18,0.4)'; ctx.fill();
        ctx.strokeStyle = col(0.85); px(1.2); ctx.stroke();
        ctx.save(); ctx.clip();
        ctx.fillStyle = col(0.45, 80); ctx.beginPath();
        for (let i = 0; i < 46; i++) dot(t.x + t.r * 0.9 * U.noise(T * 0.2 + i * 7.1, i + t.id), t.y + t.r * 0.9 * U.noise(T * 0.2 + i * 3.3, i + 40 + t.id), 0.8 * u);
        ctx.fill();
        ctx.strokeStyle = col(0.35, 80); px(0.8); ctx.beginPath(); for (let i = 0; i < 4; i++) dot(t.x + t.r * 0.5 * U.noise(T * 0.1 + i * 5, i + 70), t.y + t.r * 0.5 * U.noise(T * 0.1 + i * 9, i + 80), t.r * (0.1 + 0.04 * i)); ctx.stroke();
        ctx.restore();
        const nx = t.x + Math.cos(toward) * t.r * 0.15, ny = t.y + Math.sin(toward) * t.r * 0.15;
        ctx.beginPath(); ctx.arc(nx, ny, t.r * 0.22, 0, TAU); ctx.strokeStyle = col(0.8); px(1); ctx.stroke();
        ctx.beginPath(); ctx.arc(nx, ny, t.r * 0.08, 0, TAU); ctx.fillStyle = col(0.9, 66); ctx.fill();
      } else if (t.kind === 'stinger') {
        const beat = 0.85 + 0.15 * Math.sin(t.ph * 2.2), back = Math.atan2(-t.vy, -t.vx), r = t.r * beat;
        B.glow(ctx, t.x, t.y, r * 2, 300, 50, 66, 0.25);
        ctx.strokeStyle = col(0.5, 80); px(0.8);

      this._set('droneSub', this.drone[4].g.gain, 0.2 + 0.2 * night + (is('low', 'thunder') ? 0.45 : 0.1 * deep), t, 2);

      // water
      const rain = this.weather === 'rain' ? 1 : 0;
      const bed = is('hiss') ? 1.2 + 2.6 * (s.left >= 0 ? clamp01(1 - s.left / 600) : 0.5) : is('wind', 'rush') ? 1.6 : 0;
      this._set('noise', this.noiseG.gain, (s.born ? 0.03 : 0.018) * (1 + 1.6 * rain + 0.5 * (s.tilt || 0) + bed) * (s.dormant ? 0.5 : 1), t, 1.2);
      this._set('noiseF', this.noiseBP.frequency, 380 + 260 * Math.sin(this.phNoise) + 500 * rain + 300 * this.act + (is('hiss') ? 2200 : is('wind', 'rush') ? 500 : 0), t, 1.5);
      this._set('air', this.airG.gain, alive ? 0.05 * airless + (this.weather === 'chill' ? 0.012 : 0) : 0, t, 1.5);

      // pad (from the eukaryote on)
      let pg = alive && st >= 2 ? 0.15 + 0.05 * pop + 0.03 * warm + 0.02 * soft : 0;
      pg *= (1 - 0.55 * airless) * (1 - 0.35 * this.tension) * breath * (s.hungry ? 0.75 : 1);
      this._set('pad', this.padG.gain, pg, t, sleep ? 0.5 : 1.6);

      this._set('lan1', this.lantern[1].g.gain, 0.1 + 0.4 * lan, t, 2);

      // the water itself: murk and sickness muffle everything; a change of form opens it wide
      let cut = !s.born ? 1500 : s.dormant ? 380 : 700 + 6500 * clamp01(s.clarity) * (0.45 + 0.55 * s.health);

    }

    // ---------------------------------------------------------------- the sequencer

    _schedule(horizon, s) {

      }

      // the many, before there is a pad or an arpeggio to carry them: each one a small soft note

        this._blip(this.note(ch[Math.floor(this.rand() * 3)], 2 + (this.rand() < 0.35 ? 1 : 0)), t + this.rand() * dur, 0.022 + 0.012 * this.rand(), { pan: this.rand() * 1.6 - 0.8, wet: 0.5, type: 'triangle', len: 0.05, decay: 0.09 });
      }

      // what the place itself sounds like
      if (alive && this.mute > 0.5) {
        if (is('fizz', 'bubbles') && this.rand() < 0.55) this._blip(this.note(Math.floor(this.rand() * 10), 4 + (this.rand() < 0.4 ? 1 : 0)), t + this.rand() * dur, 0.012 + 0.014 * this.rand(), { pan: this.rand() * 1.6 - 0.8, len: 0.03, decay: 0.03, wet: 0.3 });
        if (is('tick') && this.step % 4 === 0 && this.rand() < 0.86) this._blip(this.note(this.step % 16 === 0 ? 4 : 0, 3), t + (this.rand() - 0.5) * 0.02, 0.022 + 0.022 * this.rand(), { pan: 0.3, wet: 0.6, len: 0.05 });
        if (t >= this.nextPlace) {
          this.nextPlace = t + 7 + 13 * this.rand();
          if (is('paper')) this._hiss(t, 0.5, 0.02, { f0: 2200 + 1500 * this.rand(), f1: 3200, q: 0.8, attack: 0.12, hold: 0.1, release: 0.14, pan: this.rand() * 1.2 - 0.6 });
          else if (is('lab')) this._bell(this.note([0, 4, 7][Math.floor(this.rand() * 3)], 4), t, 0.016, { pan: this.rand() * 1.2 - 0.6, decay: 1.4, wet: 0.25 });

        if (this.urge > 0 && this.step % (this.urge > 0.6 ? 2 : 4) === 0) this._pluck(this.note(0, 4), t, 0.015 + 0.035 * this.urge, { decay: 0.05, pan: -0.3 });
      }

      // drips, glints and other small weather
      if (t >= this.nextDrip && alive) {

        this.nextDrip = t + mean * (0.4 + 1.2 * this.rand());
        if (!s.sleeping || this.rand() < 0.4) this._blip(this.note(Math.floor(this.rand() * 7), 3 + (this.rand() < 0.3 ? 1 : 0)), t, 0.035 + 0.03 * this.rand(), { pan: this.rand() * 1.6 - 0.8, wet: 0.5 });

    }

    // ---------------------------------------------------------------- one-shot voices

    _busFor(pan) { return this.pans[clamp(Math.round(((pan || 0) + 1) * 2), 0, 4)]; }
    _pan(x) { return clamp(Math.sin((x || 0) * 0.006), -0.75, 0.75); }

    // Open a voice: an envelope gain on the right bus. Steals the oldest if the room is full.
    _open(t, o) {
      const c = this.ctx;
      const nowT = Math.max(this.now, c.currentTime);
      let live = 0, sounding = 1, old = null;
      for (const v of this.voices) {
        if (v.end <= nowT || v.end <= t || v.t0 > t + 0.03) continue;      // over, or not yet begun when this one starts
        sounding++;
        if (v.dying) continue;
        live++;
        if (!v.keep && (!old || v.t0 < old.t0)) old = v;
      }
      if (live >= MAX_VOICES && old) this._release(old, Math.max(nowT, t - 0.03));
      if (sounding > this.maxVoices) this.maxVoices = sounding;
      const g = c.createGain();
      g.gain.value = 0;
      g.connect(this._busFor(o && o.pan));
      const v = { g, t0: t, end: t + 1, srcs: [], nodes: [g], keep: !!(o && o.keep), dying: false };
      if (o && o.wet) { const w = c.createGain(); w.gain.value = o.wet; g.connect(w); w.connect(this.wetIn); v.nodes.push(w); }

    _osc(v, type, f, t, dest) {

    }
    _close(v, end) {
      v.end = end;

    }
    // Fade a voice out now (stolen, or the game was reset).
    _release(v, t) {

      try { v.g.gain.cancelScheduledValues(t); } catch (e) { /* nothing scheduled */ }

    }
    // Forget voices that have finished, and unplug them.
    _sweep(now) {

      v.g.gain.setTargetAtTime(0, t + a + hold, tau);

    }

    // A plucked note: a tone with a quicker overtone on top.
    _pluck(midi, t, vel, o) {

    // A bell: three partials that are not quite in tune with each other.

    _glide(f0, f1, t, dur, vel, o) {

      k.frequency.exponentialRampToValueAtTime(f * 4.5, t + 0.08);
      this._env(v, t, vel, 0.006, 0.01, tau || 0.1);
    }

    // The creature's own voice: one line with slides between notes, through two formants.
    // notes: scale steps. rhythm: 0 rest, 1 short, 2 long (or none: all short).
    _sing(notes, rhythm, t, o) {
      o = o || {};

      const c = this.ctx, v = this._open(t, { pan: o.pan || 0, wet: 0.5, keep: true });

      f2.type = 'bandpass'; f2.frequency.value = 1000 + 1400 * tone; f2.Q.value = 6;

        os.frequency.setTargetAtTime(f, tt, 0.035); sub.frequency.setTargetAtTime(f, tt, 0.035);

        v.g.gain.setTargetAtTime(vel * 0.6, tt + len * 0.55, 0.07);

    // Several notes in a row. degs: scale steps. gap: seconds apart.
    _run(kind, degs, oct, t, gap, vel, o) {

    }
    // True if this kind of sound was made less than `gap` seconds ago (and notes that it has now).
    _tooSoon(key, gap) {
      const last = this.limit[key];
      if (last !== undefined && this.now - last < gap && this.now >= last) return true;
      this.limit[key] = this.now;
      return false;
    }

    // ---------------------------------------------------------------- what happens, heard

    event(e) {

        case 'glitter': for (let i = 0; i < 9; i++) this._pluck(this.note(12 - i + (i % 2 ? 2 : 0), 4), t + i * 0.09, 0.04, { pan: (i % 2 ? 0.6 : -0.6), decay: 0.5, wet: 0.9 }); break;
        case 'poison': this._tone(r + 25, t, 1.6, 0.04, { attack: 0.6, release: 1, wet: 0.7, trem: 6 }); this._tone(r + 30, t + 0.2, 1.4, 0.035, { attack: 0.6, release: 1, wet: 0.7, trem: 7 }); break;
        case 'feast': this._run('pluck', [0, 2, 4, 5, 7, 9], 3, t, 0.08, 0.05, { decay: 0.3, wet: 0.5, bright: 0.5 }); break;
        case 'beam': for (let i = 0; i < 3; i++) this._tone(this.note(this.chord()[i], 3), t + i * 0.06, 0.9, 0.035, { attack: 0.6, release: 0.7, pan: (i - 1) * 0.5, wet: 0.6 }); break;
        case 'sparks': this._hiss(t, 0.12, 0.2, { f0: 5000, f1: 600, q: 0.5, attack: 0.002 }); this._thud(t + 0.05, 0.22, 44, 0.3); this._hiss(t + 0.1, 2.6, 0.09, { type: 'lowpass', f0: 200, f1: 70, q: 0.6, attack: 0.1, hold: 0.6, release: 1.4, wet: 0.7 }); break;
        case 'freeze': this._tone(this.note(4, 5), t, 2, 0.02, { attack: 1.2, release: 1.2, wet: 0.9, pan: -0.5 }); this._tone(this.note(7, 5), t + 0.4, 2, 0.018, { attack: 1.2, release: 1.2, wet: 0.9, pan: 0.5 }); break;
      }
    }

    // The drop lets go. Nine seconds, in step with the picture: it dries and rises into white,
    // hangs as cloud, falls, and lands. Then the new place begins.
    _launch(t, e) {
      e = e || {};
      if (e.forced) {
        // the place simply ran out: no ceremony
        this._hiss(t, 1.4, 0.14, { f0: 2500, f1: 300, q: 0.6, attack: 0.02, hold: 0.3, release: 0.8, keep: true });
        this._thud(t, 0.2, 48, 0.25);
      } else {
        this._riser(t, 2.2, 4, 0.1);
        this._run('bell', [0, 4, 7, 11], 3, t, 0.5, 0.05, { wet: 1, decay: 2 });
      }
      // cloud: one high note, far away
      this._tone(this.root + 48, t + 2, 1.3, 0.045, { attack: 1.2, release: 0.6, wet: 1, keep: true });
      this._hiss(t + 2, 2.8, 0.035, { f0: 600, f1: 900, q: 0.4, attack: 1, hold: 0.8, release: 1, keep: true, wet: 0.8 });
      // the fall: a line coming down, faster as it nears the ground
      const land = t + 7.6, w = e.world;
      if (w && w.n) { this.mode = 1; this._setKey(0, w.family, w.n, t + 4.3); this.chordI = 0; this._retune(t + 4.3, 0.3); }
      this.fxHold = land;                 // the old place's colour until the new one is reached
      const steps = [14, 12, 11, 9, 7, 6, 4, 2, 1];
      let tt = t + 4.6, gap = 0.62;
      for (let i = 0; i < steps.length; i++) { this._blip(this.note(steps[i], 3), tt, 0.05 + 0.006 * i, { pan: (i % 2 ? 0.3 : -0.3), wet: 0.6, fall: 1, len: 0.09 }); tt += gap; gap *= 0.84; }
      // and the splash
      this._glide(420, 150, land, 0.22, 0.09, { wet: 0.4 });
      this._hiss(land, 0.5, 0.2, { f0: 3500, f1: 500, q: 0.5, attack: 0.004, hold: 0.05, release: 0.25, keep: true, wet: 0.5 });
      this._thud(land, 0.3, 52, 0.22, 0.8);
      this._blip(this.note(0, 3), land + 0.12, 0.1, { wet: 0.7 }); this._blip(this.note(4, 3), land + 0.3, 0.07, { wet: 0.7, pan: 0.4 }); this._blip(this.note(7, 3), land + 0.52, 0.05, { wet: 0.7, pan: -0.4 });
      if (e.rare) {
        // somewhere strange: a chord that does not belong to any of the usual tunings
        for (let i = 0; i < 5; i++) this._bell(this.root + 24 + [0, 2, 6, 8, 13][i], land + 0.9 + i * 0.14, 0.05, { pan: (i - 2) * 0.35, wet: 1, decay: 2.4, keep: true });
      }
      // the old world's layers fall away under it, and stay away until just after the landing
      this.mute = 0; this.muteUntil = land + 0.4;
      this.weather = '';
      this.melI = 0; this.melWait = 10; this.chordI = 0;
    }
  }

  A.Engine = Engine;
  A.mtof = mtof;
})();

</script>
<script>
// The interface: where the drop is and what age the world has reached, a few fine meters, what
// the age needs from you, the hand's tools, the narrator's captions, and the sheets (The World,
// Field Notes, Water, Settings and the rest). All DOM lives inside #ui. It reads the simulation
// fresh every time (app.sim can be replaced) and only touches the page when a shown value has
// actually changed.
(function () {
  'use strict';
  const M = globalThis.MOTE = globalThis.MOTE || {};

  let app = null, root = null;
  const el = {};            // named elements
  let seen = {};            // what is on screen now, so nothing is written twice
  let tool = 'feed', trayOpen = false;
  let sheet = null, tab = { life: 'lives', notes: 'visitors' }, confirmHeir = 0, step = 0, awayReport = null, pasteOpen = false, codeShown = '', pickPlace = '';
  let slowT = 0, portraitT = 0, hint = null, capTimer = 0, woke = false, titleT = [], titleOn = false, focusWas = null;
  let badge = { life: false, notes: false };

  // ---------------------------------------------------------------- small helpers

  const ICON = {
    feed: '<circle cx="8" cy="9" r="2"/><circle cx="16" cy="8" r="1.6"/><circle cx="12.5" cy="15.5" r="2.4"/>',
