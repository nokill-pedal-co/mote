        const weight = t.kind === 'virus' ? 0.55 : t.state === 'dash' || t.state === 'aim' ? 1 : 0.85;
        dangerNow = Math.max(dangerNow, near * weight);
        if (t.kind === 'virus') continue;
        if (t.kind === 'stinger' && m.bite) continue;
        if (d < td) { td = d; threat = t; }
      }
      this.danger += (dangerNow - this.danger) * U.ease(dangerNow > this.danger ? 3 : 0.5, dt);
      const bold = clamp01(0.5 * gx.bold + c.pers.bold);
      const fear = sense * (0.95 - 0.4 * bold);

      // Food it can sense, weighted by taste and by what its body is short of.
      let food = null, fd = 1e9;
      if (c.energy < 0.97 || (s.stage >= 2 && (c.protein < 0.5 || c.mineral < 0.5))) {
        for (const f of s.foods) {
          const d = Math.hypot(f.x - c.x, f.y - c.y);
          if (d > sense) continue;
          const def = D.FOODS[f.kind];
          let want = 1 + 0.5 * c.diet * def.diet;
          if (s.stage >= 2) want += clamp01(0.35 - c.protein) * def.p * 8 + clamp01(0.3 - c.mineral) * def.m * 8;
          if (c.energy >= 0.97 && def.s > 0.1 && def.p < 0.1) continue;      // full of sugar: only after protein or grit
          const score = d / want;
          if (score < fd) { fd = score; food = f; }
        }
      }
      const starving = c.energy < 0.4;
      const craving = s.stage >= 2 && (c.protein < 0.12 || c.mineral < 0.1);

      const sleepy = s.stage >= 4 && (c.rest < 0.2 || (night && c.rest < 0.62));
      if (c.sleeping) {
        const wake = c.rest >= 0.98 || (!night && c.rest > 0.7) || (threat && td < fear * 0.5 && !c.hidden) || c.energy < 0.12;
        if (wake) this.wake(c.rest > 0.7);
        else {
          c.vx = (c.vx + this.cur.x * 14 * dt) * Math.exp(-2.5 * dt); c.vy = (c.vy + this.cur.y * 14 * dt) * Math.exp(-2.5 * dt);
          c.x += c.vx * dt; c.y += c.vy * dt; c.act = 'sleep';
          this.bound(c, R, dt);
          this.activity += (0 - this.activity) * U.ease(0.5, dt);
          return;
        }
      }

      const rock = threat || sleepy ? this.nearestFixture('rock', c.x, c.y, 520) : null;
      if (threat && td < fear) {
        act = 'flee'; pace = 1.25; c.trick = null;
        if (rock) {
          gx_ = rock.x; gy = rock.y;
          c.hidden = Math.hypot(rock.x - c.x, rock.y - c.y) < rock.r * 0.75;
          if (c.hidden) pace = 0.15;
        } else {
          const d = Math.hypot(c.x - threat.x, c.y - threat.y) || 1;
          // Run away, curving along the wall instead of pinning itself against it.
          let ax = (c.x - threat.x) / d, ay = (c.y - threat.y) / d;
          const cd = Math.hypot(c.x, c.y), edge = clamp01((cd - s.habitatR * 0.6) / (s.habitatR * 0.35));
          if (edge > 0 && cd > 1) {
            const nx = c.x / cd, ny = c.y / cd, side = (ax * -ny + ay * nx) >= 0 ? 1 : -1;
            ax = U.lerp(ax, -ny * side - nx * 0.5, edge); ay = U.lerp(ay, nx * side - ny * 0.5, edge);
          }
          gx_ = c.x + ax * 200; gy = c.y + ay * 200; c.hidden = false;
        }
        c.stress = clamp01(c.stress + dt * 0.25);
        this.remember(c.x, c.y, -0.03 * dt);
        this.note('threat');
      } else {
        c.hidden = false;
        if (c.shyT > 0) {
          act = 'shy'; pace = 1.1; c.trick = null;
          const d = Math.hypot(c.x - c.shyX, c.y - c.shyY) || 1;
          gx_ = c.x + (c.x - c.shyX) / d * 160; gy = c.y + (c.y - c.shyY) / d * 160;
        } else if (c.trick) {
          act = 'trick';
        } else if (food && starving) {
          act = 'seek'; pace = 1; gx_ = food.x; gy = food.y;
        } else if (sleepy && c.rest < 0.12) {
          act = 'tosleep';
        } else if (c.listenT > 0) {
          act = 'listen'; pace = 0.25; gx_ = c.x * 0.6; gy = c.y * 0.6;
        } else if (this.lure && (c.bond > 0.05 || s.stage < 4)) {
          act = 'follow'; pace = 0.45 + 0.55 * c.bond; gx_ = this.lure.x; gy = this.lure.y;
        } else if (food && (c.energy < 0.8 || craving)) {
          act = 'seek'; pace = 1; gx_ = food.x; gy = food.y;
        } else if (s.stage >= 3 && c.warmth < 0.55 && this.nearestFixture('vent', c.x, c.y)) {
          const v = this.nearestFixture('vent', c.x, c.y);
          act = 'warm'; pace = 0.7; gx_ = v.x; gy = v.y + v.r + R;
        } else if (sleepy) {
          act = 'tosleep';
        } else if (s.stage >= 4 && c.playCd <= 0 && c.energy > 0.4 && c.mood > 0.35 && this.playTarget()) {
          const p = this.playTarget();
          act = 'play'; pace = 0.9; gx_ = p.x; gy = p.y;
          if (Math.hypot(p.x - c.x, p.y - c.y) < R + p.r + 10) this.play(p);
        } else if (food) {
          act = 'seek'; pace = 0.7; gx_ = food.x; gy = food.y;
        } else {
          // Wander: pick a new spot now and then, favouring places it remembers well.
          // Light-eaters drift toward the light.
          c.wt -= dt;
          if (c.wt <= 0 || Math.hypot(c.wx - c.x, c.wy - c.y) < R + 12) {
            c.wt = this.rr(4, 9);
            let bx = 0, by = 0, bl = -1e9;
            for (let i = 0; i < 4; i++) {
              const a = this.rand() * TAU, d = Math.sqrt(this.rand()) * s.habitatR * 0.8;
              const x = Math.cos(a) * d, y = Math.sin(a) * d;
              const l = (m.photo ? this.lightAt(x, y) * 1.5 : 0) + this.feeling(x, y) * 1.2 + this.rand() * (0.6 + 0.8 * clamp01(c.pers.curious));
              if (l > bl) { bl = l; bx = x; by = y; }
            }
            c.wx = bx; c.wy = by;
          }
          gx_ = c.wx; gy = c.wy; pace = 0.42 + 0.2 * clamp01(c.pers.curious);
          // Now and then, when it feels good, it does something just because.
          if (s.stage >= 4 && c.mood > 0.45 && c.energy > 0.3) {
            c.idleTrick -= dt * (0.5 + gx.play + c.pers.playful);
            if (c.idleTrick <= 0) { c.idleTrick = this.rr(16, 34); const b = this.pickBehaviour({}, 'none'); if (b) { this.startTrick(b, 'none', c.x, c.y); act = 'trick'; } }
          }
        }
        if (act === 'tosleep') {
          pace = 0.6;
          if (rock) { gx_ = rock.x; gy = rock.y; }
          if (!rock || Math.hypot(gx_ - c.x, gy - c.y) < (rock ? rock.r * 0.6 : 1)) {
            c.sleeping = true; c.hidden = !!rock; pace = 0; c.trick = null;
            this.emit('sleep'); this.once('firstSleep');
            if (c.day.length) { this.emit('dream', { tags: c.day.slice() }); this.once('firstDream'); }
          }
        }
      }
      if (c.playCd > 0) c.playCd -= dt;
      c.act = act;

      if (act === 'trick') this.doTrick(dt, R);
      else {
        // Swim.
        let sp = this.speed() * pace;
        if (c.warmth < 0.3) sp *= 0.55;
        if (c.energy < 0.12) sp *= 0.6;
        if (c.held) sp *= 0.35;
        if (s.stage >= 2 && s.env.O2 < 0.35 && !m.lungs) sp *= 0.7;
        const dx = gx_ - c.x, dy = gy - c.y, d = Math.hypot(dx, dy);
        let tvx = 0, tvy = 0;
        if (d > 1) { const k = sp * Math.min(1, d / 40) / d; tvx = dx * k; tvy = dy * k; }
        const accel = (st.kind === 'spine' ? 2.6 : 1.3) * m.turn;
        const e = U.ease(accel, dt);
        c.vx += (tvx - c.vx) * e; c.vy += (tvy - c.vy) * e;
        if (s.stage === 0) { c.vx += (this.rand() - 0.5) * 30 * dt; c.vy += (this.rand() - 0.5) * 30 * dt; }
        const v = Math.hypot(c.vx, c.vy);
        if (v > 1.5) c.ang += U.angDiff(c.ang, Math.atan2(c.vy, c.vx)) * U.ease(3.5 * m.turn, dt);
        if (this.wm().tipsy) { const wob = Math.sin(s.time * 1.3) * sp * 0.5; c.vx += -Math.sin(c.ang) * wob * dt * 2; c.vy += Math.cos(c.ang) * wob * dt * 2; }
      }
      // Where the whole place turns, everything in it is carried round together, so nothing is
      // left behind by its dinner.
      if (this.wm().swirl) { const w = this.wm().swirl * 0.1 * dt, x0 = c.x; c.x -= c.y * w; c.y += x0 * w; c.ang += w; }
      // The tilt of the water carries it a little, and small things a lot.
      const carry = st.kind === 'spine' ? 16 : 34;
      c.vx += this.cur.x * carry * dt; c.vy += this.cur.y * carry * dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      this.bound(c, R, dt);
      const v = Math.hypot(c.vx, c.vy);
      this.activity += (clamp01(v / (this.speed() + 1) * 0.7 + s.threats.length * 0.12 + (s.env.weather ? 0.25 : 0) + (c.trick ? 0.3 : 0)) - this.activity) * U.ease(0.8, dt);

      // Eat what it reaches.
      const reach = R * 0.85 * m.reach + 6;
      for (let i = s.foods.length - 1; i >= 0; i--) {
        const f = s.foods[i], def = D.FOODS[f.kind];
        const wantsIt = c.energy < 0.97 ? true : s.stage >= 2 && ((def.p >= 0.1 && c.protein < 0.6) || (def.m >= 0.1 && c.mineral < 0.6));
        if (!wantsIt) continue;
        const fd2 = Math.hypot(f.x - c.x, f.y - c.y);
        if (fd2 < reach + f.r) this.eat(f, i);
        else if (fd2 < reach * 2.2 + 20) { // drawn in
          const pull = 40 * m.reach * dt / (fd2 || 1);
          f.vx += (c.x - f.x) * pull; f.vy += (c.y - f.y) * pull;
        }
      }
    }

    wake(rested, byYou) {
      const c = this.s.c;
      if (!c.sleeping) return;
      c.sleeping = false; c.hidden = false;
      // Dreamers wake with the day's lessons set a little deeper.
      if (rested && this.mods.sleepEssence >= 2) for (const cue in c.q) for (const b in c.q[cue]) c.q[cue][b] = Math.min(1, c.q[cue][b] * 1.06);
      if (rested) c.day.length = 0;
      this.emit('wake', { rested: !!rested, byYou: byYou ? 1 : 0 });
    }

    // ---------------------------------------------------------------- tricks and learning

    canDo(beh) {
      const s = this.s, def = D.BEHAVIOURS[beh];
      if (!def) return false;
      if (beh === 'sing') return this.canSing();
      if (s.stage < def.stage) return false;
      if (def.needs === 'toy' && !this.count('toy')) return false;
      return true;
    }
    // Choose something to do. q: what this cue has been worth before.
    pickBehaviour(q, cue) {
      const c = this.s.c;
      let total = 0;
      const opts = [];
      for (const b of D.BEHAVIOUR_IDS) {
        if (!this.canDo(b)) continue;
        const known = q[b] || 0;
        let w = 0.06 + 0.35 * (c.base[b] || 0) + 3 * known * known;
        if (cue === 'hold' && b === 'come') w += 0.2;
        if (cue === 'hum' && b === 'sing') w += 0.25;
        if (cue === 'none' && (b === 'come' || b === 'fetch')) continue;
        opts.push([b, w]); total += w;
      }
      if (!opts.length) return null;
      let r = this.rand() * total;
      for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; }
      return opts[opts.length - 1][0];
    }
    startTrick(beh, cue, x, y) {
      const s = this.s, c = s.c;
      c.trick = { beh, cue, t: 0, a0: c.ang, x: x === undefined ? c.x : x, y: y === undefined ? c.y : y, did: 0, rewarded: false };
      s.stats.tricks++;
      this.emit('trick', { beh, cue, x: c.x, y: c.y, learned: cue !== 'none' && c.q[cue] && c.q[cue][beh] >= D.LEARNED ? 1 : 0 });
      // The young copy what the elders do.
      const known = cue !== 'none' && c.q[cue] && c.q[cue][beh] >= D.LEARNED;
      for (const f of s.fixtures) if ((f.type === 'kin' || f.type === 'elder') && (known || this.rand() < 0.3)) f.trick = { beh, t: -0.3 - this.rand() * 0.6 };
    }
    endTrick() {
      const s = this.s, c = s.c, tr = c.trick;
      if (!tr) return;
      c.lastTrick = { beh: tr.beh, cue: tr.cue, at: s.time, rewarded: tr.rewarded };
      c.trick = null;
      this.emit('trickEnd', { beh: tr.beh });
    }
    doTrick(dt, R) {
      const s = this.s, c = s.c, tr = c.trick, def = D.BEHAVIOURS[tr.beh], sp = this.speed();
      tr.t += dt;
      const u = tr.t / def.dur, damp = Math.exp(-4 * dt);
      const steer = (tx, ty, pace) => {
        const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy) || 1, k = sp * pace * Math.min(1, d / 30) / d, e = U.ease(3.5, dt);
        c.vx += (dx * k - c.vx) * e; c.vy += (dy * k - c.vy) * e;
        if (Math.hypot(c.vx, c.vy) > 1.5) c.ang += U.angDiff(c.ang, Math.atan2(c.vy, c.vx)) * U.ease(5, dt);
        return d;
      };
      switch (tr.beh) {
        case 'spin': c.vx *= damp; c.vy *= damp; c.ang += TAU * 1.5 * dt / def.dur; break;
        case 'wiggle': c.vx *= damp; c.vy *= damp; c.ang = tr.a0 + Math.sin(tr.t * 17) * 0.55 * Math.sin(Math.PI * Math.min(1, u)); break;
        case 'loop': {
          const a = tr.a0 + TAU * u, e = U.ease(6, dt);
          c.vx += (Math.cos(a) * sp * 0.95 - c.vx) * e; c.vy += (Math.sin(a) * sp * 0.95 - c.vy) * e; c.ang = a; break;
        }
        case 'dart':
          if (u < 0.3) { const e = U.ease(9, dt); c.vx += (Math.cos(tr.a0) * sp * 2.4 - c.vx) * e; c.vy += (Math.sin(tr.a0) * sp * 2.4 - c.vy) * e; }
          else { c.vx *= Math.exp(-1.8 * dt); c.vy *= Math.exp(-1.8 * dt); }
          break;
        case 'flash': c.vx *= damp; c.vy *= damp; break;
        case 'bubble':
          c.vx *= damp; c.vy *= damp;
          if (!tr.did && u > 0.3) { tr.did = 1; this.emit('bubbles', { x: c.x + Math.cos(c.ang) * R, y: c.y + Math.sin(c.ang) * R, ring: 1 }); }
          break;
        case 'sing':
          c.vx *= damp; c.vy *= damp;
          if (!tr.did) { tr.did = 1; this.emit('sing', { mood: c.mood, trick: 1 }); this.once('sing'); }
          break;
        case 'come': if (steer(tr.x, tr.y, 1.15) < R + 26 && u > 0.2) tr.t = def.dur; break;
        case 'fetch': {
          const toy = this.nearestFixture('toy', c.x, c.y);
          if (!toy) { tr.t = def.dur; break; }
          const td = Math.hypot(toy.x - tr.x, toy.y - tr.y);
          if (td < 55) { tr.t = def.dur; break; }
          // Get behind the pod, then push it toward the call.
          const ux = (toy.x - tr.x) / (td || 1), uy = (toy.y - tr.y) / (td || 1);
          const d = steer(toy.x + ux * (R + toy.r), toy.y + uy * (R + toy.r), 1.1);
          if (d < 22 || Math.hypot(toy.x - c.x, toy.y - c.y) < R + toy.r + 6) { toy.vx = -ux * 210; toy.vy = -uy * 210; if (!tr.did) { tr.did = 1; this.emit('play', { x: toy.x, y: toy.y, kind: 'toy' }); } }
          break;
        }
      }
      if (c.trick && c.trick.t >= def.dur) this.endTrick();
    }

    // The player signals. It may answer with something it has learned.
    cue(id, x, y) {
      const s = this.s, c = s.c;
      if (!c.born || c.dormant || c.morph || !D.CUES[id]) return false;
      c.cueLast = { id, at: s.time, x, y };
      if (s.stage < 4) { if (s.stage === 3) c.petT = Math.max(c.petT, 0.5); return false; }
      if (c.sleeping || c.act === 'flee' || c.act === 'shy' || c.trick) return false;
      const q = c.q[id] || (c.q[id] = {});
      let best = 0;
      for (const b in q) if (q[b] > best && this.canDo(b)) best = q[b];
      const p = clamp(0.3 + 0.62 * best + 0.2 * c.bond + 0.15 * this.gx.play, 0, 0.97);
      s.stats.cues++;
      this.emit('cue', { id, x, y });
      if (this.rand() > p) return false;
      const beh = this.pickBehaviour(q, id);
      if (!beh) return false;
      this.startTrick(beh, id, x === undefined ? c.x : x, y === undefined ? c.y : y);
      return true;
    }

    // Something good just happened (a stroke, a meal from your hand). Whatever it just did,
    // it will be more inclined to do again, and to do at that cue.
    reward(amount) {
      const s = this.s, c = s.c, m = this.mods;
      const tr = c.trick || (c.lastTrick && s.time - c.lastTrick.at < 5 ? c.lastTrick : null);
      if (!tr || tr.rewarded) return false;
      tr.rewarded = true; s.stats.rewards++;
      const def = D.BEHAVIOURS[tr.beh];
      c.base[tr.beh] = clamp01((c.base[tr.beh] || 0) + 0.06 * amount);
      let cue = tr.cue;
      if (cue === 'none' && c.cueLast && s.time - c.cueLast.at < 6) cue = c.cueLast.id;   // shaping
      c.joy = clamp01(c.joy + 0.05);
      if (cue === 'none') { this.emit('learn', { cue, beh: tr.beh, w: c.base[tr.beh] }); return true; }
      const q = c.q[cue] || (c.q[cue] = {});
      const lr = clamp01(0.24 * this.gx.learn * m.learn * amount), before = q[tr.beh] || 0;
      q[tr.beh] = before + lr * (1 - before);
      for (const b in q) if (b !== tr.beh) q[b] *= 1 - 0.25 * lr;
      this.emit('learn', { cue, beh: tr.beh, w: q[tr.beh] });
      if (before < D.LEARNED && q[tr.beh] >= D.LEARNED && !s.flags['knows:' + cue + ':' + tr.beh]) {
        s.flags['knows:' + cue + ':' + tr.beh] = 1;
        this.log('learned', { trick: def.name, cue: D.CUES[cue].name });
        this.emit('learned', { cue, beh: tr.beh });
      }
      return true;
    }
    // The tricks it reliably does on cue.
    tricks() {
      const c = this.s.c, out = [];
      for (const cue in c.q) for (const beh in c.q[cue]) if (c.q[cue][beh] > 0.08 && D.BEHAVIOURS[beh] && D.CUES[cue]) out.push({ cue, beh, w: c.q[cue][beh], learned: c.q[cue][beh] >= D.LEARNED });
      out.sort((a, b) => b.w - a.w);
      return out;
    }

    playTarget() {
      const s = this.s, c = s.c;
      let best = null, bd = 700;
      for (const f of s.fixtures) {
        if (f.type !== 'toy' && f.type !== 'bubbler' && f.type !== 'companion' && f.type !== 'kin') continue;
        const d = Math.hypot(f.x - c.x, f.y - c.y);
        if (d < bd) { bd = d; best = f; }
      }
      return best;
    }

    play(p) {
      const s = this.s, c = s.c;
      c.joy = clamp01(c.joy + 0.22); c.stress = Math.max(0, c.stress - 0.1);
      c.pers.playful = clamp01(c.pers.playful + 0.02);
      c.press.play = Math.min(1, c.press.play + 0.25);
      c.playCd = this.rr(10, 22) * (1.3 - 0.6 * clamp01(c.pers.playful));
      s.stats.played++;
      this.remember(c.x, c.y, 0.1); this.note(p.type === 'kin' || p.type === 'companion' ? 'kin' : 'play');
      if (p.type === 'toy') {
        const a = Math.atan2(p.y - c.y, p.x - c.x) + this.rr(-0.5, 0.5);
        p.vx = Math.cos(a) * 190; p.vy = Math.sin(a) * 190;
      }
      this.emit('play', { x: p.x, y: p.y, kind: p.type });
      this.once('play');
    }

    eat(f, i) {
      const s = this.s, c = s.c, m = this.mods, fd = D.FOODS[f.kind];
      s.foods.splice(i, 1);
      const hungry = c.energy < 0.35;
      c.energy = clamp01(c.energy + fd.s * m.foodVal * (1 + 0.25 * c.diet * fd.diet));
      c.protein = clamp01(c.protein + fd.p * m.foodVal);
      c.mineral = clamp01(c.mineral + fd.m);
      if (c.growth < this.def().need) c.growth += 2.5 * ((fd.s + fd.p) / 0.23) * m.grow * 0.5;
      c.diet = clamp(c.diet * 0.997 + 0.012 * fd.diet, -1, 1);
      c.eatT = 1; c.streak = c.streakT > 0 ? c.streak + 1 : 1; c.streakT = 2.5;
      if (f.fed) {
        if (hungry) c.bond = clamp01(c.bond + 0.004 * m.bondRate);
        this.reward(0.6);
        this.note('you');
      } else this.note('food');
      if (f.kind === 'plankton') c.pers.bold = clamp01(c.pers.bold + 0.004);
      c.joy = clamp01(c.joy + 0.015);
      this.remember(c.x, c.y, 0.07);
      s.stats.eaten++;
      if (++c.poop >= (m.foodVal > 1.2 ? 6 : 4)) { c.poop = 0; this.addWaste(c.x - Math.cos(c.ang) * this.bodyR(), c.y - Math.sin(c.ang) * this.bodyR()); }
      this.emit('eat', { x: f.x, y: f.y, kind: f.kind, streak: c.streak });
      this.once('firstMeal');
    }

    hurt(amount, x, y) {
      const s = this.s, c = s.c;
      if (c.morph || c.dormant) return;
      const before = c.health;
      const brittle = (s.stage >= 2 && c.mineral < 0.08 ? 1.3 : 1) * (this.wm().soap ? 1.3 : 1);
      c.health = clamp01(c.health - amount * this.mods.armor * brittle);
      c.hurtT = 1; c.stress = clamp01(c.stress + 0.3); c.joy = Math.max(0, c.joy - 0.05);
      c.press.hit = Math.min(1, c.press.hit + 0.35);
      c.trick = null;
      this.remember(c.x, c.y, -0.4); this.note('threat');
      if (c.sleeping) this.wake(false);
      if (before >= 0.3 && c.health < 0.3) this.once('hurtBad');
      this.emit('hurt', { x: x === undefined ? c.x : x, y: y === undefined ? c.y : y, amount });
    }

    // Keep something inside the round habitat.
    bound(o, r, dt) {
      const R = this.s.habitatR - r, d = Math.hypot(o.x, o.y);
      if (d > R && d > 0) {
        const nx = o.x / d, ny = o.y / d, over = d - R;
        o.x -= nx * over * Math.min(1, 6 * dt + 0.2); o.y -= ny * over * Math.min(1, 6 * dt + 0.2);
        const vn = o.vx * nx + o.vy * ny;
        if (vn > 0) { o.vx -= nx * vn * 1.3; o.vy -= ny * vn * 1.3; }
      }
    }

    // ---------------------------------------------------------------- the water's contents

    addFood(kind, x, y, fed) {
      const s = this.s, fd = D.FOODS[kind];
      const f = { id: s.nextId++, kind, x, y, vx: this.rr(-8, 8), vy: this.rr(-8, 8), age: 0, r: fd.r, ph: this.rand() * TAU };
      if (fed) f.fed = 1;
      s.foods.push(f);
      return f;
    }
    addWaste(x, y) {
      const s = this.s;
      if (s.wastes.length >= 40) s.wastes.shift();
      s.wastes.push({ id: s.nextId++, x, y, vx: this.rr(-5, 5), vy: this.rr(-5, 5), r: this.rr(7, 11), ph: this.rand() * TAU, age: 0 });
    }
    addMote(x, y, mult, burst) {
      const s = this.s, st = this.def();
      const a = this.rand() * TAU, v = burst ? this.rr(22, 46) : this.rr(2, 10);
      const mo = { id: s.nextId++, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 24, r: 7,
        val: Math.max(1, Math.round(2 * st.glow * this.mods.essence * (mult || 1))), ph: this.rand() * TAU };
      s.motes.push(mo);
      this.emit('spark', { x, y });
      return mo;
    }

    stepFoods(dt) {
      const s = this.s, c = s.c, damp = Math.exp(-1.6 * s.world.visc * dt), gxv = this.cur.x * 60 * dt, gyv = this.cur.y * 60 * dt, sw = (this.wm().swirl || 0) * 0.1 * dt;
      const cap = 5 + Math.floor(s.stage * 1.4);
      let plank = -1;
      for (let i = s.foods.length - 1; i >= 0; i--) {
        const f = s.foods[i], fd = D.FOODS[f.kind];
        f.age += dt;
        if (f.kind === 'plankton') {
          // Living food: it wanders, likes the light, shies from the creature, grazes and breeds.
          f.ph += dt * 1.3;
          f.vx += Math.cos(f.ph * 0.9 + f.id) * 26 * dt; f.vy += Math.sin(f.ph * 1.1 + f.id * 2) * 26 * dt;
          const d = Math.hypot(f.x - c.x, f.y - c.y);
          if (d < 110 && d > 0 && !c.dormant) { f.vx += (f.x - c.x) / d * 34 * dt; f.vy += (f.y - c.y) / d * 34 * dt; }
          for (const b of s.beams) { const bd = Math.hypot(b.x - f.x, b.y - f.y); if (bd < b.r * 2 && bd > 10) { f.vx += (b.x - f.x) / bd * 30 * dt; f.vy += (b.y - f.y) / bd * 30 * dt; } }
          // Graze the nearest algae.
          let near = null, nd = 150;
          for (const a of s.foods) { if (a.kind !== 'algae') continue; const ad = Math.hypot(a.x - f.x, a.y - f.y); if (ad < nd) { nd = ad; near = a; } }
          if (near) {
            f.vx += (near.x - f.x) / (nd || 1) * 22 * dt; f.vy += (near.y - f.y) / (nd || 1) * 22 * dt;
            if (nd < 13) {
              const k = s.foods.indexOf(near);
              s.foods.splice(k, 1); if (k < i) i--;
              f.fedN = (f.fedN || 0) + 1; f.age = Math.max(0, f.age - 50);
              if (f.fedN >= 2) {
                f.fedN = 0;
                if (plank < 0) plank = this.countFood('plankton');
                if (plank < cap) { const b = this.addFood('plankton', f.x + 6, f.y + 6); b.age = 0; plank++; this.emit('breed', { x: f.x, y: f.y }); if (plank >= 6) this.once('planktonBoom'); }
              }
            }
          }
          if (s.stage >= 2 && s.env.O2 < 0.15) f.age += dt * 8;     // they smother first
        } else {
          f.vx += (this.rand() - 0.5) * 10 * dt; f.vy += (this.rand() - 0.5) * 10 * dt;
        }
        f.vx = (f.vx + gxv) * damp; f.vy = (f.vy + gyv) * damp;
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (sw) { const fx0 = f.x; f.x -= f.y * sw; f.y += fx0 * sw; }      // the whole place is turning
        this.bound(f, f.r, dt);
        if (f.age > fd.life) {
          const k = s.foods.indexOf(f);
          if (k >= 0) s.foods.splice(k, 1);
          // What you drop and nobody eats turns to murk; what the water brings mostly just dissolves.
          if (this.rand() < (f.fed ? 0.4 : f.kind === 'plankton' ? 0.5 : f.kind === 'algae' ? 0.25 : 0.1)) this.addWaste(f.x, f.y);
          else s.env.N = clamp01(s.env.N + 0.008);
        }
      }
    }

    stepWastes(dt) {
      const s = this.s, damp = Math.exp(-1.2 * dt), gxv = this.cur.x * 40 * dt, gyv = this.cur.y * 40 * dt;
      for (let i = s.wastes.length - 1; i >= 0; i--) {
        const w = s.wastes[i];
        w.age = (w.age || 0) + dt;
        w.vx += (this.rand() - 0.5) * 6 * dt; w.vy += (this.rand() - 0.5) * 6 * dt;
        w.vx = (w.vx + gxv) * damp; w.vy = (w.vy + gyv) * damp; w.x += w.vx * dt; w.y += w.vy * dt;
        this.bound(w, w.r, dt);
        // Left long enough, it breaks down and enriches the water.
        if (w.age > 150) { s.wastes.splice(i, 1); s.env.N = clamp01(s.env.N + 0.03); }
      }
    }

    stepMotes(dt) {
      const s = this.s, damp = Math.exp(-0.9 * dt), gxv = this.cur.x * 60 * dt, gyv = this.cur.y * 60 * dt;
      for (let i = s.motes.length - 1; i >= 0; i--) {
        const m = s.motes[i];
        m.t += dt;
        m.vx = (m.vx + gxv) * damp; m.vy = (m.vy + gyv) * damp;
        m.x += m.vx * dt; m.y += (m.vy - 5) * dt;
        this.bound(m, m.r, dt);
        if (m.t > m.life) s.motes.splice(i, 1);
      }
    }

    // ---------------------------------------------------------------- threats

    spawnThreat(kind, angle) {
      const s = this.s, def = D.THREATS[kind];
      const a = angle === undefined ? this.rand() * TAU : angle, R = s.habitatR + 40;
      const t = { id: s.nextId++, kind, x: Math.cos(a) * R, y: Math.sin(a) * R, vx: 0, vy: 0, hp: def.hp, t: 0, ph: this.rand() * TAU, flash: 0 };
      if (kind === 'virus') { t.r = def.r; t.speed = def.speed + s.stage * 2.5; }
      else if (kind === 'engulfer') { t.r = def.r * this.bodyR(); t.speed = def.speed * this.speed(); t.state = 'chase'; t.hpf = 1; }
      else if (kind === 'stinger') { t.r = def.r; t.speed = def.speed; t.dir = a + Math.PI + this.rr(-0.5, 0.5); t.cd = 0; t.state = 'cross'; }
      else if (kind === 'hunter') { t.r = def.r * this.bodyR(); t.speed = def.speed * this.def().speed; t.state = 'stalk'; t.st = this.rr(4, 6); t.dashes = 0; t.orbit = this.rand() < 0.5 ? 1 : -1; }
      s.threats.push(t);
      this.emit('threat', { kind, x: t.x, y: t.y });
      return t;
    }

    stepThreats(dt) {
      const s = this.s, c = s.c, T = s.timers, m = this.mods, R = this.bodyR();
      const safe = !!c.morph || c.dormant || !c.born;

      // Arrivals.
      if (!s.settings.peaceful && !this.wm().calm && s.stage >= 1 && !safe && c.safeT <= 0) {
        T.threat -= dt * s.world.hazard;
        if (T.threat <= 0) {
          T.threat = this.rr(75, 130) - s.stage * 3;
          let big = 0, vir = 0, sting = 0;
          for (const t of s.threats) { if (t.kind === 'virus') vir++; else if (t.kind === 'stinger') sting++; else big++; }
          const roll = this.rand();
          if (s.stage >= 5 && roll < 0.3 && !big) this.spawnThreat('hunter');
          else if (s.stage >= 2 && roll < 0.55 && !big) this.spawnThreat('engulfer');
          else if (s.stage >= 4 && roll < 0.78 && sting < 2) { this.spawnThreat('stinger'); if (this.rand() < 0.4) this.spawnThreat('stinger'); }
          else if (vir < 5) { const a = this.rand() * TAU; for (let i = 0, n = 1 + (this.rand() < 0.2 + s.stage * 0.08 ? 1 : 0); i < n; i++) this.spawnThreat('virus', a + i * 0.3); }
          this.once('firstThreat');
        }
      }

      for (let i = s.threats.length - 1; i >= 0; i--) {
        const t = s.threats[i];
        if (!t) continue;
        t.t += dt; t.ph += dt;
        if (t.flash > 0) t.flash -= dt * 3;
        const dx = c.x - t.x, dy = c.y - t.y, d = Math.hypot(dx, dy) || 1;
        let gone = false;

        if (t.kind === 'virus') {
          if (t.att) {
            t.x = c.x + Math.cos(t.aa + c.ang) * R; t.y = c.y + Math.sin(t.aa + c.ang) * R;
            if (safe) gone = true;
            else {
              if (c.health > 0.2) c.health = Math.max(0.2, c.health - 0.014 * m.armor * dt);      // a virus saps; it does not finish anyone off
              c.hurtT = Math.max(c.hurtT, 0.35);
              c.stress = clamp01(c.stress + 0.05 * dt);
              // A virus left alone does its damage and then bursts: a setback, not a death sentence
              // for a world nobody happened to be watching.
              t.tox = (t.tox || 0) + dt * (m.toxin ? 7 : 1);
              if (t.tox > 21) { gone = true; this.emit('pop', { x: t.x, y: t.y, kind: t.kind, auto: 1 }); }
            }
          } else {
            const chase = !safe && !c.hidden;
            const ax = chase ? dx / d : Math.cos(t.ph * 0.7 + t.id), ay = chase ? dy / d : Math.sin(t.ph * 0.6 + t.id);
            const e = U.ease(1.2, dt);
            t.vx += (ax * t.speed - t.vx) * e + Math.cos(t.ph * 2.3 + t.id) * 14 * dt + this.cur.x * 40 * dt;
            t.vy += (ay * t.speed - t.vy) * e + Math.sin(t.ph * 1.9 + t.id) * 14 * dt + this.cur.y * 40 * dt;
            t.x += t.vx * dt; t.y += t.vy * dt;
            if (chase && d < R + t.r) {
              if (m.armor < 0.7 && this.rand() < 0.4) { gone = true; this.emit('pop', { x: t.x, y: t.y, kind: t.kind, auto: 1 }); }
              else { t.att = true; t.aa = Math.atan2(-dy, -dx) - c.ang; this.emit('attach', { x: t.x, y: t.y }); this.note('threat'); }
            }
            if (t.t > 100) gone = true;
          }
        } else if (t.kind === 'engulfer') {
          const leaving = t.state === 'leave' || safe || t.t > 50;
          if (leaving) {
            t.state = 'leave';
            const od = Math.hypot(t.x, t.y) || 1, e = U.ease(1.5, dt);
            t.vx += (t.x / od * t.speed * 1.6 - t.vx) * e; t.vy += (t.y / od * t.speed * 1.6 - t.vy) * e;
            if (od > s.habitatR + 70) gone = true;
          } else {
            const chase = !c.hidden, e = U.ease(1.4, dt);
            const ax = chase ? dx / d : Math.cos(t.ph * 0.4), ay = chase ? dy / d : Math.sin(t.ph * 0.4);
            const sp = chase ? t.speed : t.speed * 0.4;
            t.vx += (ax * sp - t.vx) * e; t.vy += (ay * sp - t.vy) * e;
            if (chase && d < t.r + R * 0.6) {
              c.held = true;
              c.health = clamp01(c.health - 0.05 * m.armor * dt); c.hurtT = Math.max(c.hurtT, 0.5);
              c.stress = clamp01(c.stress + 0.2 * dt);
              if (!t.bit) { t.bit = 1; c.press.hit = Math.min(1, c.press.hit + 0.3); this.remember(c.x, c.y, -0.3); this.emit('hurt', { x: c.x, y: c.y, amount: 0.05 }); }
              if (m.toxin || m.bite) { t.hpf -= dt * 0.45 * (m.toxin + m.bite); if (t.hpf <= 0) { t.hpf = 1; this.damage(t, 1, true); } }
            } else t.bit = 0;
          }
          t.x += t.vx * dt; t.y += t.vy * dt;
        } else if (t.kind === 'stinger') {
          // Drifts across the pool in pulses. It is not hunting; it is just in the way.
          const pulse = 0.55 + 0.45 * Math.max(0, Math.sin(t.ph * 2.2));
          const wob = Math.sin(t.ph * 0.5) * 0.5;
          const e = U.ease(1.5, dt);
          t.vx += (Math.cos(t.dir + wob) * t.speed * pulse * 1.6 - t.vx) * e; t.vy += (Math.sin(t.dir + wob) * t.speed * pulse * 1.6 - t.vy) * e;
          t.x += t.vx * dt; t.y += t.vy * dt;
          if (t.cd > 0) t.cd -= dt;
          if (!safe && !c.hidden && t.cd <= 0 && d < t.r + R) {
            t.cd = 2.2;
            if (m.bite) { this.damage(t, 1, true); if (t.hp <= 0) c.energy = clamp01(c.energy + 0.2); }
            else {
              this.hurt(0.13, t.x, t.y);
              c.vx += dx / d * 120; c.vy += dy / d * 120;
              if (m.toxin) this.damage(t, 1, true);
            }
          }
          if (t.t > 8 && Math.hypot(t.x, t.y) > s.habitatR + 60) gone = true;
          if (safe && t.t > 20) gone = true;
        } else if (t.kind === 'hunter') {
          if (safe || t.dashes >= 3 || t.t > 60) t.state = 'leave';
          if (t.state === 'leave') {
            const od = Math.hypot(t.x, t.y) || 1, e = U.ease(1.5, dt);
            t.vx += (t.x / od * t.speed * 1.5 - t.vx) * e; t.vy += (t.y / od * t.speed * 1.5 - t.vy) * e;
            if (od > s.habitatR + 90) gone = true;
          } else if (t.state === 'stalk') {
            // Circle at a distance, watching.
            const want = 230 + R, e = U.ease(1.6, dt);
            const rx = -dx / d, ry = -dy / d;              // from creature toward hunter
            const tx = -ry * t.orbit, ty = rx * t.orbit;   // around
            const push = clamp((d - want) / 120, -1, 1);
            t.vx += ((tx - rx * push) * t.speed * 0.8 - t.vx) * e; t.vy += ((ty - ry * push) * t.speed * 0.8 - t.vy) * e;
            t.st -= dt;
            if (t.st <= 0) {
              if (c.hidden || (m.stealth && this.rand() < 0.55)) { t.st = this.rr(3, 5); t.dashes += 0.5; }
              else { t.state = 'aim'; t.st = 0.75; this.emit('telegraph', { x: t.x, y: t.y }); }
            }
          } else if (t.state === 'aim') {
            t.vx *= Math.exp(-5 * dt); t.vy *= Math.exp(-5 * dt);
            t.aimA = Math.atan2(dy + c.vy * 0.4, dx + c.vx * 0.4);
            t.st -= dt;
            if (t.st <= 0) { t.state = 'dash'; t.st = 0.95; t.hit = 0; t.vx = Math.cos(t.aimA) * t.speed * 3.4; t.vy = Math.sin(t.aimA) * t.speed * 3.4; }
          } else if (t.state === 'dash') {
            t.st -= dt;
            if (!t.hit && !c.hidden && d < t.r * 0.8 + R) {
              t.hit = 1;
              this.hurt(0.22, t.x, t.y);
              c.vx += Math.cos(t.aimA) * 160; c.vy += Math.sin(t.aimA) * 160;
              if (m.bite || m.toxin) this.damage(t, m.bite ? 2 : 1, true);
            }
            if (t.st <= 0) { t.state = 'tired'; t.st = 2.2; t.dashes++; }
          } else if (t.state === 'tired') {
            t.vx *= Math.exp(-2.5 * dt); t.vy *= Math.exp(-2.5 * dt);
            t.st -= dt;
            if (t.st <= 0) { t.state = 'stalk'; t.st = this.rr(3, 5); }
          }
          t.x += t.vx * dt; t.y += t.vy * dt;
          if (Math.hypot(t.vx, t.vy) > 4) t.ang = Math.atan2(t.vy, t.vx);
        }
        if (gone) { const k = s.threats.indexOf(t); if (k >= 0) s.threats.splice(k, 1); }
      }
    }

    // A tap (or a bite) lands on a threat.
    damage(t, n, byCreature) {
      const s = this.s, c = s.c;
      t.hp -= n; t.flash = 1;
      const d = Math.hypot(t.x - c.x, t.y - c.y) || 1;
      if (!t.att) { t.vx += (t.x - c.x) / d * 90; t.vy += (t.y - c.y) / d * 90; }
      if (t.hp > 0) { this.emit('hit', { x: t.x, y: t.y, kind: t.kind }); return false; }
      const near = t.att || d < this.sense();
      if (t.kind === 'virus' || t.kind === 'stinger') { const k = s.threats.indexOf(t); if (k >= 0) s.threats.splice(k, 1); }
      else { t.state = 'leave'; t.r *= 0.82; }
      s.stats.popped++;
      const n2 = t.kind === 'virus' ? 1 : t.kind === 'stinger' ? 2 : 3;
      for (let i = 0; i < n2; i++) this.addMote(t.x, t.y, 0.8, true);
      if (!byCreature && near) {
        c.bond = clamp01(c.bond + 0.006 * this.mods.bondRate);
        c.stress = Math.max(0, c.stress - 0.15);
        if (t.kind !== 'virus') this.once('saved');
      }
      if (byCreature) { c.pers.bold = clamp01(c.pers.bold + 0.04); c.press.fight = Math.min(1, c.press.fight + 0.4); }
      this.emit('pop', { x: t.x, y: t.y, kind: t.kind });
      return true;
    }

    // ---------------------------------------------------------------- habitat and kin

    fixtureCost(type) {
      const def = D.FIXTURES[type];
      return Math.round(def.cost * Math.pow(1.5, Math.min(this.count(type), 4)));
    }
    fixtureMax(type) { return type === 'egg' ? this.kinMax() : D.FIXTURES[type].max; }
    canPlace(type) {
      const def = D.FIXTURES[type], s = this.s;
      if (!def || s.stage < def.stage) return 'locked';
      if (this.count(type) >= this.fixtureMax(type)) return 'max';
      if (s.essence < this.fixtureCost(type)) return 'cost';
      return '';
    }
    addFixture(type, x, y, free) {
      const s = this.s, def = D.FIXTURES[type];
      const d = Math.hypot(x, y), lim = s.habitatR - def.r - 14;
      if (d > lim) { x *= lim / d; y *= lim / d; }
      for (const f of s.fixtures) if (Math.hypot(f.x - x, f.y - y) < f.r + def.r + 8) return null;
      if (s.lantern && Math.hypot(s.lantern.x - x, s.lantern.y - y) < 80 + def.r) return null;
      const f = { id: s.nextId++, type, x, y, t: 0, r: def.r, cd: this.rr(3, 8), vx: 0, vy: 0, ph: this.rand() * TAU };
      if (type === 'algae') f.gr = this.rand();
      if (free) f.self = 1;
      const rand = () => this.rand();
      if (type === 'companion') { f.g = G.random(rand); f.name = makeName(rand); f.bond = 0; f.age = 400; }
      if (type === 'egg') {
        // Young take after the creature, and after a wild one if there is one to pair with.
        const mate = this.nearestFixture('companion', x, y);
        f.g = mate ? G.cross(s.c.g, mate.g, rand, 0.06) : G.mutate(s.c.g, rand, 0.1);
        f.name = makeName(rand); f.bond = 0; f.age = 0; if (mate) f.mate = mate.name;
      }
      s.fixtures.push(f);
      s.stats.placed++;
      this.emit('place', { x, y, kind: type, self: !!free });
      if (!free) this.once('firstFixture');
      if (type === 'companion') this.once('companion', 'companion', { friend: f.name });
      return f;
    }
    removeFixture(f) {
      const s = this.s, i = s.fixtures.indexOf(f);
      if (i < 0) return false;
      s.fixtures.splice(i, 1);
      const def = D.FIXTURES[f.type === 'kin' ? 'egg' : f.type];
      if (def && !f.self) s.essence += Math.round(def.cost * 0.4);
      this.emit('remove', { x: f.x, y: f.y, kind: f.type });
      return true;
    }

    stepFixtures(dt) {
      const s = this.s, c = s.c, env = s.env, T = s.timers;
      for (let i = s.fixtures.length - 1; i >= 0; i--) {
        const f = s.fixtures[i];
        f.t += dt;
        if (f.type === 'algae') {
          f.gr += dt * this.lightAt(f.x, f.y) / 15 * (s.stage >= 2 ? 0.35 + 0.95 * env.N : 1) * (1 + 0.4 * env.temp) * (this.wm().algaeBoost || 1);
          if (f.gr >= 1) {
            let n = 0;
            for (const fo of s.foods) if (fo.kind === 'algae' && Math.hypot(fo.x - f.x, fo.y - f.y) < 110) n++;
            if (n < 4 && s.foods.length < 60) { const a = this.rand() * TAU; const fo = this.addFood('algae', f.x + Math.cos(a) * 24, f.y + Math.sin(a) * 24); fo.vx = Math.cos(a) * 26; fo.vy = Math.sin(a) * 26; f.gr = 0; this.emit('grow', { x: f.x, y: f.y }); }
            else f.gr = 0.8;
          }
        } else if (f.type === 'cleaner') {
          f.cd -= dt;
          if (f.cd <= 0) {
            f.cd = 6.5;
            let best = -1, bd = 620;
            for (let k = 0; k < s.wastes.length; k++) { const d = Math.hypot(s.wastes[k].x - f.x, s.wastes[k].y - f.y); if (d < bd) { bd = d; best = k; } }
            if (best >= 0) { const w = s.wastes[best]; s.wastes.splice(best, 1); env.N = clamp01(env.N + 0.02); this.emit('clean', { x: w.x, y: w.y, fx: f.x, fy: f.y }); }
          }
        } else if (f.type === 'vent') {
          f.cd -= dt;
          if (f.cd <= 0) {
            f.cd = 22;
            let n = 0;
            for (const fo of s.foods) if (fo.kind === 'mineral' && Math.hypot(fo.x - f.x, fo.y - f.y) < 140) n++;
            if (n < 3 && s.foods.length < 60) { const fo = this.addFood('mineral', f.x, f.y - f.r); fo.vy = -30; fo.vx = this.rr(-14, 14); }
          }
        } else if (f.type === 'bubbler') {
          if (s.stage >= 4 && !c.sleeping && !c.dormant && Math.hypot(c.x - f.x, c.y - f.y) < 70) c.joy = clamp01(c.joy + 0.03 * dt);
        } else if (f.type === 'toy') {
          const damp = Math.exp(-1.1 * dt);
          f.vx = (f.vx + this.cur.x * 50 * dt) * damp; f.vy = (f.vy + this.cur.y * 50 * dt) * damp; f.x += f.vx * dt; f.y += f.vy * dt;
          this.bound(f, f.r + 6, dt);
        } else if (f.type === 'egg') {
          if (f.t > 150) { f.type = 'kin'; f.t = 0; f.age = 0; this.emit('hatch', { x: f.x, y: f.y, name: f.name }); }
        } else if (f.type === 'companion' || f.type === 'kin' || f.type === 'elder') {
          this.stepFriend(f, dt);
          if (f.type === 'elder' && f.t > 600) {
            s.fixtures.splice(i, 1);
            for (let k = 0; k < 4; k++) this.addMote(f.x, f.y, 2, true);
            this.log('elderFade', { elder: f.name });
            this.emit('fade', { x: f.x, y: f.y, name: f.name });
          }
        }
      }

      // The Dropfolk shape their own drop.
      if (s.stage >= 8 && !c.dormant && !c.morph) {
        T.folk -= dt;
        if (T.folk <= 0) {
          T.folk = this.rr(45, 75);
          const folk = s.fixtures.filter(f => f.type === 'kin' || f.type === 'elder');
          const who = folk.length ? folk[Math.floor(this.rand() * folk.length)] : c;
          const a = this.rand() * TAU, d = this.rr(50, 130);
          if (this.count('cairn') < D.FIXTURES.cairn.max) { if (this.addFixture('cairn', who.x + Math.cos(a) * d, who.y + Math.sin(a) * d, true)) this.once('cairn'); }
          if (this.mods.gardeners) {
            if (s.wastes.length) { const w = s.wastes.pop(); env.N = clamp01(env.N + 0.02); this.emit('clean', { x: w.x, y: w.y, fx: who.x, fy: who.y }); }
            if (this.count('algae') < D.FIXTURES.algae.max && env.O2 < 0.6) this.addFixture('algae', who.x - Math.cos(a) * d, who.y - Math.sin(a) * d, true);
          }
        }
      }
    }

    // The world fills up: while it thrives, its people divide (or hatch) toward what the age can hold.
    stepBrood(dt) {
      const s = this.s, c = s.c, T = s.timers, st = this.def();
      if (!c.born || c.morph) return;
      const kin = s.fixtures.filter(f => f.type === 'kin');
      if (c.dormant) {
        // hard times thin them out, last-born first
        T.birth -= dt;
        if (T.birth <= 0 && kin.length) { T.birth = 25; const f = kin[kin.length - 1]; s.fixtures.splice(s.fixtures.indexOf(f), 1); this.emit('fade', { x: f.x, y: f.y, name: f.name, quiet: 1 }); }
        return;
      }
      const want = Math.round(U.lerp(st.pop[0], st.pop[1], clamp01(c.growth / st.need)));
      if (kin.length + 1 >= want || this.wellbeing() < 0.45) return;
      T.birth -= dt;
      if (T.birth > 0) return;
      T.birth = this.rr(9, 20);
      this.birth(kin.length && this.rand() < 0.6 ? kin[Math.floor(this.rand() * kin.length)] : c);
    }
    birth(parent) {
      const s = this.s, rand = () => this.rand();
      const mate = this.nearestFixture('companion', parent.x, parent.y);
      const pg = parent.g || s.c.g;
      const a = this.rand() * TAU, d = this.bodyR() * 1.2;
      const f = { id: s.nextId++, type: 'kin', x: parent.x + Math.cos(a) * d, y: parent.y + Math.sin(a) * d, t: 0, r: D.FIXTURES.egg.r, cd: 0, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, ph: this.rand() * TAU,
        g: mate && s.stage >= 4 ? G.cross(pg, mate.g, rand, 0.06) : G.mutate(pg, rand, 0.07), name: makeName(rand), bond: 0, age: 0, wx: 0, wy: 0, wt: 0 };
      s.fixtures.push(f);
      s.stats.births++;
      this.emit('divide', { x: parent.x, y: parent.y, name: f.name, n: this.pop() });
      this.once('firstBirth');
      if (this.pop() >= 8) this.once('crowd');
      return f;
    }

    // One of its people: keeps loosely to its side (or, if a simple cell, goes its own way),
    // eats a little, rests when it rests.
    stepFriend(f, dt) {
      const s = this.s, c = s.c;
      f.ph += dt * 0.35;
      f.age = (f.age || 0) + dt;
      if (f.trick) { f.trick.t += dt; if (f.trick.t > (D.BEHAVIOURS[f.trick.beh] || { dur: 1 }).dur) f.trick = null; }
      const still = c.sleeping || c.dormant;
      let tx, ty, pace = still ? 0.12 : 0.7;
      f.hungry = (f.hungry || 0) + dt;
      let food = null;
      if (f.hungry > 28 && !still) {
        let bd = 260;
        for (const fo of s.foods) { const d = Math.hypot(fo.x - f.x, fo.y - f.y); if (d < bd) { bd = d; food = fo; } }
      }
      if (food) {
        tx = food.x; ty = food.y; pace = 0.9;
        if (Math.hypot(food.x - f.x, food.y - f.y) < f.r + food.r + 4) { const k = s.foods.indexOf(food); if (k >= 0) s.foods.splice(k, 1); f.hungry = 0; f.eatT = 1; }
      } else if (s.stage < 4) {
        // cells keep no company: each wanders the drop by itself
        f.wt = (f.wt || 0) - dt;
        if (f.wt <= 0 || Math.hypot((f.wx || 0) - f.x, (f.wy || 0) - f.y) < 20) { f.wt = this.rr(5, 11); const a = this.rand() * TAU, d = Math.sqrt(this.rand()) * s.habitatR * 0.8; f.wx = Math.cos(a) * d; f.wy = Math.sin(a) * d; }
        tx = f.wx; ty = f.wy; pace = still ? 0.1 : 0.45;
      } else {
        // each keeps its own distance, so a crowd spreads out instead of piling up
        const orbit = 80 + this.bodyR() * 1.6 + 30 * Math.sin(f.ph * 0.7 + f.id) + (f.type === 'elder' ? 60 : 0) + this.bodyR() * 1.3 * (f.id % 6);
        tx = c.x + Math.cos(f.ph + f.id * 2.1) * orbit; ty = c.y + Math.sin(f.ph + f.id * 2.1) * orbit;
      }
      if (f.eatT > 0) f.eatT -= dt * 2.5;
      const d = Math.hypot(tx - f.x, ty - f.y) || 1, sp = pace * this.speed() * (f.type === 'elder' ? 0.6 : 1) * Math.min(1, d / 60);
      const e = U.ease(1.8, dt);
      f.vx += ((tx - f.x) / d * sp - f.vx) * e + this.cur.x * 24 * dt; f.vy += ((ty - f.y) / d * sp - f.vy) * e + this.cur.y * 24 * dt;
      if (s.stage === 0) { f.vx += (this.rand() - 0.5) * 30 * dt; f.vy += (this.rand() - 0.5) * 30 * dt; }
      f.x += f.vx * dt; f.y += f.vy * dt;
      this.bound(f, f.r, dt);
      if (Math.hypot(f.vx, f.vy) > 2) f.ang = Math.atan2(f.vy, f.vx);
      if (!c.dormant && Math.hypot(c.x - f.x, c.y - f.y) < 190) {
        c.joy = clamp01(c.joy + (f.type === 'companion' ? 0.008 : 0.012) * (0.6 + 0.8 * this.gx.social) * dt * (this.mods.chorus ? 1.5 : 1));
      }
    }

    // ---- visitors: other lives drift through the field, to be noticed or not
    stepVisitors(dt) {
      const s = this.s, T = s.timers, c = s.c;
      if (!c.born) return;
      T.visitor -= dt;
      if (T.visitor <= 0 && !c.morph) {
        T.visitor = this.rr(70, 160);
        if (s.visitors.length < 3) {
          const here = s.world.id, night = s.env.night;
          const pool = D.SPECIES.filter(q => s.stage >= q.stage[0] && s.stage <= q.stage[1] && (q.only ? q.only.indexOf(here) >= 0 : true) && (!q.night || night));
          let total = 0;
          // things not yet noted down are a little likelier to turn up
          const wt = q => (q.only ? 4 : q.w) * (s.codex[q.id] ? 1 : 1.3);
          for (const q of pool) total += wt(q);
          let r = this.rand() * total, pick = null;
          for (const q of pool) { r -= wt(q); if (r <= 0) { pick = q; break; } }
          if (pick) {
            const a = this.rand() * TAU, R = s.habitatR, dir = a + Math.PI + this.rr(-0.6, 0.6), sp = this.rr(5, 12);
            s.visitors.push({ uid: s.nextId++, sp: pick.id, x: Math.cos(a) * R * 0.96, y: Math.sin(a) * R * 0.96, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, dir, ang: this.rand() * TAU, spin: this.rr(-0.25, 0.25), t: 0, life: this.rr(70, 130), r: pick.r * (0.8 + 0.4 * this.rand()) * Math.max(0.7, this.def().r / 22), ph: this.rand() * TAU });
            this.emit('visitor', { id: pick.id });
          }
        }
      }
      const damp = Math.exp(-0.8 * dt);
      for (let i = s.visitors.length - 1; i >= 0; i--) {
        const v = s.visitors[i];
        v.t += dt; v.ang += v.spin * dt;
        const sp = 8 + 4 * Math.sin(v.ph + v.t * 0.4);
        v.vx = (v.vx + Math.cos(v.dir + Math.sin(v.t * 0.3 + v.ph) * 0.8) * sp * dt + this.cur.x * 30 * dt) * damp; v.vy = (v.vy + Math.sin(v.dir + Math.sin(v.t * 0.3 + v.ph) * 0.8) * sp * dt + this.cur.y * 30 * dt) * damp;
        v.x += v.vx * dt; v.y += v.vy * dt;
        if (v.t < v.life) this.bound(v, v.r, dt);
        else if (Math.hypot(v.x, v.y) > s.habitatR + v.r + 30 || v.t > v.life + 40) s.visitors.splice(i, 1);
        else { const d = Math.hypot(v.x, v.y) || 1; v.vx += v.x / d * 14 * dt; v.vy += v.y / d * 14 * dt; }
      }
    }
    // The player notices a visitor: it goes in the book.
    observe(v) {
      const s = this.s, def = D.SPECIES.find(q => q.id === v.sp);
      if (!def) return;
      const first = !s.codex[v.sp];
      s.codex[v.sp] = (s.codex[v.sp] || 0) + 1;
      if (first) {
        s.stats.found++;
        s.essence += Math.round(6 * this.def().glow);
        this.log('found', { species: def.name, note: def.note });
        this.emit('discover', { id: v.sp, name: def.name, x: v.x, y: v.y });
      } else if (!v.seen) this.emit('noticed', { id: v.sp, name: def.name, x: v.x, y: v.y });
      v.seen = 1;
    }
    found() { let n = 0; for (const k in this.s.codex) n++; return n; }

    // Young old enough to carry the line on.
    heirs() { return this.s.fixtures.filter(f => f.type === 'kin' && f.age >= 240); }
    canPass() { const c = this.s.c; return this.s.stage >= 5 && !c.morph && !c.dormant && this.heirs().length > 0; }
    // The line passes to one of its young. You care for the heir now; the elder stays a while.
    passLight(kinId) {
      const s = this.s, c = s.c, m = this.mods;
      const kin = this.heirs().find(f => f.id === kinId);
      if (!kin || !this.canPass()) return false;
      s.lineage.push({ name: c.name, gen: s.gen, world: s.world.n, g: G.clone(c.g), traits: c.traits.slice(), stage: s.stage, days: Math.floor(c.age / this.dayLen()) + 1, bond: Math.round(c.bond * 100), tricks: this.tricks().filter(t => t.learned).length });
      const old = { name: c.name, g: c.g, x: c.x, y: c.y };
      const keep = m.teach ? 0.85 : 0.55;
      this.log('heir', { elder: c.name, child: kin.name });
      c.name = kin.name; c.g = kin.g; c.x = kin.x; c.y = kin.y; c.vx = kin.vx; c.vy = kin.vy;
      c.bond = Math.max(kin.bond || 0, c.bond * (m.teach ? 0.8 : 0.6));
      for (const k in c.pers) c.pers[k] *= 0.5;
      for (const cue in c.q) for (const b in c.q[cue]) c.q[cue][b] *= keep;      // what the old taught the young
      for (const b in c.base) c.base[b] *= keep;
      for (const k in c.press) c.press[k] = 0;
      c.growth *= 0.6; c.ready = false; c.age = 0; c.joy = 0.6; c.stress = 0; c.trick = null; c.lastTrick = null; c.heard = []; c.day = [];
      c.sleeping = false; c.hidden = false; c.safeT = 40;
      kin.type = 'elder'; kin.name = old.name; kin.g = old.g; kin.x = old.x; kin.y = old.y; kin.t = 0; kin.bond = 1; kin.r = D.FIXTURES.egg.r;
      s.gen++; s.stats.heirs++;
      this.refresh();
      this.emit('heir', { name: c.name, elder: old.name });
      return true;
    }

    // ---------------------------------------------------------------- the player's hand

    // A tap at world (x, y). slop: how forgiving the aim is, in world units.
    // Returns what the tap did, so the UI can answer.
    tap(x, y, tool, slop) {
      const s = this.s, c = s.c;
      slop = slop || 20;
      s.stats.taps++;
      if (!c.born) {
        c.birthTaps++;
        this.emit('birthTap', { x, y, n: c.birthTaps });
        if (c.birthTaps >= 3) {
          c.born = true; c.x = 0; c.y = 0;
          this.settle();
          this.log(s.world.rare ? D.PLACE[s.world.id].line : s.world.n > 1 ? 'bornAgain' : 'born', { place: s.world.name });
          this.emit('born', { x: 0, y: 0 });
        }
        return 'birth';
      }
      if (c.morph) return 'none';

      if (tool === 'remove') {
        for (const f of s.fixtures) if (f.type !== 'kin' && f.type !== 'elder' && Math.hypot(f.x - x, f.y - y) < f.r + slop) { this.removeFixture(f); return 'remove'; }
        return 'none';
      }

      // Glow first: it is the smallest target and the one most wanted.
      let best = null, bd = 1e9;
      for (const m of s.motes) { const d = Math.hypot(m.x - x, m.y - y); if (d < m.r + slop * 1.3 && d < bd) { bd = d; best = m; } }
      if (best) { this.collect(best); return 'collect'; }

      best = null; bd = 1e9;
      for (const t of s.threats) { const d = Math.hypot(t.x - x, t.y - y) - t.r; if (d < slop && d < bd) { bd = d; best = t; } }
      if (best && best.state !== 'leave') { this.damage(best, 1, false); return 'hit'; }

      // Touch means something only once they have nerves to feel it with. Before that, a tap
      // on a cell is simply the nearest place to drop its dinner.
      if (s.stage >= 4 && Math.hypot(c.x - x, c.y - y) < this.bodyR() + slop * 0.5) return this.pet(x, y);

      for (const v of s.visitors) if (Math.hypot(v.x - x, v.y - y) < v.r + slop * 0.7) { this.observe(v); return 'observe'; }

      for (let i = 0; i < s.wastes.length; i++) {
        const w = s.wastes[i];
        if (Math.hypot(w.x - x, w.y - y) < w.r + slop) { s.wastes.splice(i, 1); s.stats.cleared++; this.emit('clear', { x: w.x, y: w.y }); return 'clear'; }
      }

      for (const f of s.fixtures) {
        if (Math.hypot(f.x - x, f.y - y) > f.r + slop * 0.6) continue;
        if (f.type === 'toy') { const a = Math.atan2(f.y - y, f.x - x) + this.rr(-0.4, 0.4); f.vx = Math.cos(a) * 170; f.vy = Math.sin(a) * 170; this.emit('play', { x: f.x, y: f.y, kind: 'toy', you: 1 }); return 'toy'; }
        if (f.type === 'companion' || f.type === 'kin' || f.type === 'elder') {
          f.bond = clamp01((f.bond || 0) + 0.02); f.petT = 1;
          this.emit('pet', { x: f.x, y: f.y, fresh: false, friend: 1, name: f.name });
          return 'pet';
        }
        if (f.type === 'bubbler') { this.emit('bubbles', { x: f.x, y: f.y }); return 'bubbles'; }
      }

      if (tool === 'light') {
        if (s.stage < 2) return 'none';
        if (s.timers.beam > 0) { this.emit('deny', { x, y, why: 'beam' }); return 'deny'; }
        s.beams.push({ x, y, r: 150, t: 0, life: 26 });
        s.timers.beam = 14; s.stats.beams++;
        this.emit('beam', { x, y });
        return 'beam';
      }
      if (tool === 'prey' || tool === 'grit') {
        if (s.stage < 2) return 'none';
        const cost = tool === 'prey' ? 3 : 1, kind = tool === 'prey' ? 'plankton' : 'mineral';
        if (s.essence < cost) { this.emit('deny', { x, y, why: 'cost' }); return 'deny'; }
        if (s.foods.length >= 60) { this.emit('deny', { x, y, why: 'full' }); return 'deny'; }
        s.essence -= cost;
        if (tool === 'prey') s.stats.live = (s.stats.live || 0) + 1;
        for (let i = 0; i < 2; i++) this.addFood(kind, x + this.rr(-14, 14), y + this.rr(-14, 14), true);
        this.emit('drop', { x, y, kind });
        return 'drop';
      }
      if (tool && tool.indexOf('place:') === 0) {
        const type = tool.slice(6), why = this.canPlace(type);
        if (why) { this.emit('deny', { x, y, why }); return 'deny'; }
        const cost = this.fixtureCost(type);
        if (!this.addFixture(type, x, y)) { this.emit('deny', { x, y, why: 'space' }); return 'deny'; }
        s.essence -= cost;
        return 'place';
      }

      // Default: feed. The water holds only so much of what you drop, and more mouths clear it faster.
      let mine = 0;
      for (const f of s.foods) if (f.fed) mine++;
      if (s.foods.length >= 60 || mine >= 9 + 3 * Math.min(10, this.pop())) { this.emit('deny', { x, y, why: 'full' }); return 'deny'; }
      const d = Math.hypot(x, y), lim = s.habitatR - 10;
      if (d > lim) { x *= lim / d; y *= lim / d; }
      for (let i = 0; i < 3; i++) {
        const a = this.rand() * TAU, f = this.addFood('nutrient', x + Math.cos(a) * 9, y + Math.sin(a) * 9, true);
        f.vx = Math.cos(a) * 22; f.vy = Math.sin(a) * 22;
      }
      s.stats.fed++;
      this.emit('drop', { x, y, kind: 'nutrient' });
      // The keepers tap back.
      if (s.stage >= 7 && s.timers.tapBack <= 0 && !c.sleeping && !c.dormant && this.rand() < 0.45) {
        s.timers.tapBack = 9;
        this.emit('tapBack', { x: c.x + Math.cos(c.ang) * 60, y: c.y + Math.sin(c.ang) * 60 });
        this.once('tapsBack');
      }
      return 'drop';
    }

    collect(m) {
      const s = this.s, i = s.motes.indexOf(m);
      if (i < 0) return;
      s.motes.splice(i, 1);
      s.essence += m.val;
      s.stats.gathered += m.val; s.stats.motes++;
      this.emit('collect', { x: m.x, y: m.y, val: m.val, gift: !!m.gift });
    }

    pet(x, y) {
      const s = this.s, c = s.c, m = this.mods;
      if (c.dormant) { this.emit('pet', { x: c.x, y: c.y, fresh: false, dormant: 1 }); return 'pet'; }
      c.taps.push(s.time);
      while (c.taps.length && s.time - c.taps[0] > 3) c.taps.shift();
      if (c.taps.length > 5) {
        c.stress = clamp01(c.stress + 0.25); c.joy = Math.max(0, c.joy - 0.06);
        c.bond = Math.max(0, c.bond - 0.012); c.shyT = 2.2; c.shyX = x; c.shyY = y;
        c.pers.affection = Math.max(0, c.pers.affection - 0.01);
        c.taps.length = 0;
        // Whatever it was doing, it will think twice about doing it again.
        const tr = c.trick || c.lastTrick;
        if (tr && tr.cue !== 'none' && c.q[tr.cue] && c.q[tr.cue][tr.beh]) c.q[tr.cue][tr.beh] = Math.max(0, c.q[tr.cue][tr.beh] - 0.15);
        c.trick = null;
        this.remember(c.x, c.y, -0.2);
        if (c.sleeping) this.wake(false, true);
        this.emit('harass', { x: c.x, y: c.y });
        return 'harass';
      }
      if (c.sleeping) {
        const rested = c.rest >= 0.55;
        if (!rested) { c.stress = clamp01(c.stress + 0.12); c.joy = Math.max(0, c.joy - 0.04); }
        this.wake(rested, true);
        return 'wake';
      }
      const fresh = s.time - c.lastPet > 3;
      c.petT = 1;
      if (fresh) {
        // Trust builds from visits spread over time, not from tapping fast.
        const since = s.time - c.lastPet;
        c.lastPet = s.time;
        c.bond = clamp01(c.bond + 0.0055 * clamp01(since / 20) * m.bondRate * (0.7 + 0.6 * this.gx.social) * (1 - 0.5 * c.bond));
        c.joy = clamp01(c.joy + 0.12); c.stress = Math.max(0, c.stress - 0.12);
        c.pers.affection = clamp01(c.pers.affection + 0.006);
        c.press.touch = Math.min(1, c.press.touch + 0.14);
        s.stats.pets++;
        this.remember(c.x, c.y, 0.1); this.note('you');
        this.reward(1);
        this.once('firstPet');
      }
      this.emit('pet', { x: c.x, y: c.y, fresh, heart: c.heart });
      return 'pet';
    }

    // A finger dragged through the water pushes what floats.
    stir(x, y, dx, dy) {
      const s = this.s, R = 95;
      const mag = Math.hypot(dx, dy);
      if (mag < 0.01) return;
      const k = Math.min(1, 40 / mag) * 5 * (this.wm().stirBoost || 1);
      const push = (o, light) => {
        const d = Math.hypot(o.x - x, o.y - y);
        if (d > R) return;
        const f = (1 - d / R) * k * light;
        o.vx = clamp(o.vx + dx * f, -260, 260); o.vy = clamp(o.vy + dy * f, -260, 260);
      };
      for (const f of s.foods) push(f, 1);
      for (const w of s.wastes) push(w, 0.8);
      for (const m of s.motes) push(m, 1);
      for (const t of s.threats) if (t.kind === 'virus' && !t.att) push(t, 0.7);
      for (const f of s.fixtures) if (f.type === 'toy') push(f, 0.6);
      if (s.c.born && !s.c.dormant) s.c.pers.curious = clamp01(s.c.pers.curious + 0.0004);
    }

    setLure(x, y) {
      if (x === null || x === undefined) { this.lure = null; return; }
      const s = this.s;
      if (!this.lure) {
        this.lure = { x, y };
        if (s.c.born) { s.c.pers.curious = clamp01(s.c.pers.curious + 0.003); s.stats.calls++; this.cue('hold', x, y); }
      } else { this.lure.x = x; this.lure.y = y; }
    }

    // The phone is tipped. gx, gy: -1..1, the downhill direction on the screen.
    tilt(gx, gy) {
      const s = this.s, g = this.grav;
      const jolt = Math.hypot(gx - g.x, gy - g.y);
      if (jolt > 0.45 && this.wm().shakeGlitter && s.c.born && s.motes.length < 20) for (let i = 0; i < 8; i++) { const a = this.rand() * TAU, d = Math.sqrt(this.rand()) * s.habitatR * 0.8; this.addMote(Math.cos(a) * d, Math.sin(a) * d, 1); }
      g.x = clamp(gx, -1, 1); g.y = clamp(gy, -1, 1);
      if (jolt > 0.45 && s.timers.tilt <= 0 && s.c.born) { s.timers.tilt = 3; this.cue('tilt', s.c.x, s.c.y); this.emit('slosh', { x: g.x, y: g.y }); }
    }

    // The microphone heard something. level 0..1; pitch 0..1 if it was a held note
    // (low hum to high whistle), else -1; noisy: breath across the mic.
    hear(o, dt) {
      const s = this.s, c = s.c;
      if (!c.born || c.dormant || c.morph) return;
      if (o.noisy && o.level > 0.35) {
        // Wind on the water.
        const a = this.rand() * TAU, f = o.level * 160 * dt;
        for (const fo of s.foods) { fo.vx += Math.cos(a + fo.id) * f; fo.vy += Math.sin(a + fo.id) * f + f; }
        for (const mo of s.motes) { mo.vx += Math.cos(a + mo.id) * f; mo.vy += Math.sin(a + mo.id) * f + f; }
        this.emit('gust', { level: o.level });
        return;
      }
      if (o.pitch >= 0 && o.level > 0.08) {
        c.voiceTarget = o.pitch;
        c.press.voice = Math.min(1, c.press.voice + dt * 0.5);
        if (s.stage >= 4 && !c.sleeping) { c.listenT = 1.5; this.once('listen'); }
        if (s.timers.hum <= 0) { s.timers.hum = 4; this.cue('hum', c.x, c.y); }
        if (this.canSing()) c.echoT = 1.3;
      }
    }
    // A clear note from the player, as a scale degree. The creature keeps the last few.
    heardNote(deg) {
      const c = this.s.c;
      if (!c.born) return;
      c.heard.push(clamp(Math.round(deg), -3, 7));
      if (c.heard.length > 8) c.heard.shift();
      this.emit('heard', { deg });
    }

    // ---------------------------------------------------------------- growing up

    // What this age still needs from the player.
    tasks() {
      const s = this.s, base = s.taskBase || {}, out = [];
      if (this.devFree) return out;      // dev tools jump ages without doing the chores
      const checks = {
        algae: () => this.count('algae'), home: () => this.count('rock') + this.count('cleaner'), toy: () => this.count('toy'), companion: () => this.count('companion'),
        comfort: () => this.count('vent') + this.count('bubbler'), air: () => (s.env.O2 > 0.5 ? 1 : 0), pop8: () => (this.pop() >= 8 ? 1 : 0),
      };
      const quiet = this.wm().calm || s.settings.peaceful;
      for (const t of D.TASKS[s.stage] || []) {
        if (t.id === 'virus' && quiet) continue;      // nothing hunts here, so nothing to see off
        if (t.id === 'nights' && (this.wm().dark || this.wm().bright || s.settings.realDay)) continue;      // no dawns to count
        const have = Math.min(t.n, t.stat ? (s.stats[t.stat] || 0) - (base[t.stat] || 0) : checks[t.check]());
        out.push({ id: t.id, text: t.text, have: Math.max(0, have), n: t.n, done: have >= t.n });
      }
      return out;
    }
    blockers() {
      const s = this.s, c = s.c, st = this.def(), out = [];
      if (c.growth < st.need) out.push('Still growing');
      if (s.stage >= D.LAST) return out;
      for (const t of this.tasks()) if (!t.done) out.push(t.text + (t.n > 1 ? ` (${t.have} of ${t.n})` : ''));
      if (c.dormant) out.push('They are dormant');
      else if (c.health < 0.5) out.push('Needs to heal first');
      else if (c.energy < 0.4) out.push('Needs a meal first');
      return out;
    }
    canEvolve() { return this.s.c.born && !this.s.c.morph && this.s.stage < D.LAST && this.blockers().length === 0; }

    // Three mutations on offer for the next stage. Stays the same until one is taken.
    offer() {
      const s = this.s;
      if (s.offer) return s.offer;
      const next = s.stage + 1;
      const pool = D.TRAIT_IDS.filter(id => D.TRAITS[id].stage === next && s.c.traits.indexOf(id) < 0);
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(this.rand() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
      s.offer = pool.slice(0, 3);
      return s.offer;
    }
    evolve(traitId) {
      const s = this.s, c = s.c;
      if (!this.canEvolve()) return false;
      const opts = this.offer();
      if (opts.length && opts.indexOf(traitId) < 0) return false;
      c.morph = { t: 0, dur: 8, trait: opts.length ? traitId : null, done: false };
      c.sleeping = false; c.hidden = false; c.trick = null;
      this.emit('evolveStart', { stage: s.stage });
      return true;
    }

    traitCost(id) {
      const s = this.s, t = D.TRAITS[id];
      const extras = Math.max(0, s.c.traits.length - s.stage);
      return Math.round(50 * t.stage * Math.pow(1.3, extras));
    }
    buyable() {
      const s = this.s;
      return D.TRAIT_IDS.filter(id => D.TRAITS[id].stage <= s.stage && s.c.traits.indexOf(id) < 0);
    }
    buyTrait(id) {
      const s = this.s, c = s.c, t = D.TRAITS[id];
      if (!t || t.stage > s.stage || c.traits.indexOf(id) >= 0 || c.morph || !c.born) return false;
      const cost = this.traitCost(id);
      if (s.essence < cost) return false;
      s.essence -= cost;
      c.traits.push(id);
      c.diet = clamp(c.diet + 0.3 * (t.diet || 0), -1, 1);
      this.refresh();
      this.log('grew', { trait: t.name.toLowerCase() });
      this.emit('trait', { id });
      return true;
    }

    // ---- the lantern: the last work of the last stage
    raiseLantern() {
      const s = this.s;
      let bx = 0, by = 0, bd = -1;
      for (let i = 0; i < 14; i++) {
        const a = this.rand() * TAU, d = i ? this.rand() * s.habitatR * 0.3 : 0, x = Math.cos(a) * d, y = Math.sin(a) * d;
        let near = 1e9;
        for (const f of s.fixtures) near = Math.min(near, Math.hypot(f.x - x, f.y - y) - f.r);
        if (near > bd) { bd = near; bx = x; by = y; }
      }
      s.lantern = { x: bx, y: by };
      for (let i = s.fixtures.length - 1; i >= 0; i--) { const f = s.fixtures[i]; if (f.type !== 'kin' && f.type !== 'elder' && f.type !== 'companion' && Math.hypot(f.x - bx, f.y - by) < 80 + f.r) s.fixtures.splice(i, 1); }
    }
    lanternProgress() { const s = this.s; return s.stage >= D.LAST ? clamp01(s.c.growth / this.def().need) : 0; }
    canLaunch() { const s = this.s; return s.stage >= D.LAST && s.c.growth >= this.def().need && !s.c.dormant && !s.c.morph; }
    // The drop lets go. Its genes ride the vapour up, and a little of what it learned.
    // forced: the place ran out of time before the world was finished.
    launch(forced, where) {
      const s = this.s, c = s.c, m = this.mods;
      if (!forced && !this.canLaunch()) return false;
      if (!c.born) return false;
      const rand = () => this.rand();
      s.lineage.push({ name: c.name, gen: s.gen, world: s.world.n, place: s.world.name, g: G.clone(c.g), traits: c.traits.slice(), stage: s.stage, days: Math.floor(c.age / this.dayLen()) + 1, bond: Math.round(c.bond * 100), tricks: this.tricks().filter(t => t.learned).length, pop: this.pop(), launched: 1 });
      s.worlds.push({ n: s.world.n, id: s.world.id, name: s.world.name, rare: s.world.rare, hue: s.world.hue, last: c.name, stage: s.stage, pop: this.pop(), forced: !!forced });
      this.log(forced ? 'washed' : 'launch', { place: s.world.name });
      const full = !forced || s.stage >= D.LAST;
      const keepQ = (m.remember ? 0.6 : 0.3) * (full ? 1 : 0.5), keepGlow = m.remember ? 0.08 : 0.02;
      const q = {}, old = c.q;
      for (const cue in old) { q[cue] = {}; for (const b in old[cue]) q[cue][b] = old[cue][b] * keepQ; }
      const genome = G.mutate(c.g, rand, 0.12);
      s.world = makeWorld(s.world.n + 1, rand, s.atlas, s.atlasLast, where);
      s.atlas[s.world.id] = (s.atlas[s.world.id] || 0) + 1; s.atlasLast = s.world.id;
      s.gen++;
      s.essence = Math.floor(s.essence * keepGlow);
      s.stage = 0;
      const st = D.STAGES[0];
      s.habitatR = st.habitat * (s.world.m.size || 1); s.viewSpan = st.view;
      s.c = newCreature(makeName(rand), genome);
      s.c.q = q;
      s.foods = []; s.wastes = []; s.threats = []; s.motes = []; s.fixtures = []; s.beams = []; s.visitors = []; s.lantern = null;
      s.env.weather = null; s.env.nextWeather = 150; s.env.clarity = 1; s.env.temp = 0; s.env.O2 = 0.8; s.env.N = s.world.rich;
      s.offer = null; s.launchT = 0; s.taskBase = Object.assign({}, s.stats);
      s.flags = {};
      this.shade = 0;
      this.refresh();
      this.emit('launch', { world: s.world, rare: s.world.rare, forced: !!forced });
      return true;
    }

  // ---------------------------------------------------------------- rotifer: the first animal, crowned with wheels
