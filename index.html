    grit: '<path d="M12 4l6 8-6 8-6-8z"/><path d="M6 12h12"/>',
    light: '<circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/>',
    habitat: '<path d="M12 20v-9"/><path d="M12 13c-4 0-6-2.5-6-6 4 0 6 2.5 6 6z"/><path d="M12 11c0-3 1.8-5 5.5-5 0 3.4-1.8 5-5.5 5z"/>',
    life: '<circle cx="9" cy="10" r="4.5"/><circle cx="16.5" cy="15" r="3.2"/><circle cx="8.2" cy="9.4" r=".6"/><circle cx="16" cy="14.6" r=".5"/>',
    water: '<path d="M3.5 9.5c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 2.8-1.4 4-1"/><path d="M3.5 15c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 2.8-1.4 4-1"/>',
    notes: '<path d="M6 4.5h10.5A1.5 1.5 0 0118 6v13.5H7.5A1.5 1.5 0 016 18z"/><path d="M6 17.5A1.5 1.5 0 017.5 16H18M9.5 8.5h5M9.5 11.5h3.5"/>',
    settings: '<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
    spark: '<path d="M12 3.5c.6 4.6 3.3 7.6 8.5 8.5-5.2.9-7.9 3.9-8.5 8.5-.6-4.6-3.3-7.6-8.5-8.5 5.2-.9 7.9-3.9 8.5-8.5z"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    evolve: '<path d="M12 12.2c0-1.7 2.6-1.7 2.6.2 0 2.4-2.2 3.6-4.2 2.9-2.6-.9-3.4-4.3-1.5-6.5 2.5-2.8 7.4-2 9 1.6"/>',
    seed: '<path d="M12 4v16M5.1 8l13.8 8M18.9 8L5.1 16"/><path d="M12 7l-2-1.5M12 7l2-1.5M12 17l-2 1.5M12 17l2 1.5"/>',
  };
  const svg = (name, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const pct = v => Math.round(U.clamp01(v) * 100);
  const glowN = n => `<span class="g">${svg('spark')}${U.fmt(n)}</span>`;
  const put = (key, v) => { if (seen[key] === v) return false; seen[key] = v; return true; };
  const show = (node, on) => { if (node) node.classList.toggle('hidden', !on); };
  const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
  const clock = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const firstSentence = t => { const m = /^.*?[.!?](?=\s|$)/.exec(t || ''); return m ? m[0] : (t || ''); };
  function wake() { if (!woke && app) { woke = true; app.wake(); } else if (app && app.actx && app.actx.state === 'suspended') app.wake(); }
  function span(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return h ? `${h} h ${m} m` : m ? `${m} m` : `${sec} s`;
  }
  const bar = (v, cls) => `<span class="bar${cls ? ' ' + cls : ''}"><i style="transform:scaleX(${(pct(v) / 100).toFixed(2)})"></i></span>`;

  const TOOLS = [
    { id: 'feed', icon: 'feed', label: 'Feed', stage: 0, say: 'Feed: tap the water to drop broth' },
    { id: 'prey', icon: 'prey', label: 'Live', stage: 2, cost: 3, say: 'Live food: protein, 3 glow a tap' },
    { id: 'grit', icon: 'grit', label: 'Grit', stage: 2, cost: 1, say: 'Grit: minerals, 1 glow a tap' },
    { id: 'light', icon: 'light', label: 'Light', stage: 2, say: 'Light: tap to bring a pool of light' },
    { id: 'habitat', icon: 'habitat', label: 'Place', stage: 1, say: 'Place: things to put in the water' },
  ];
  const DOING = { wander: 'wandering', seek: 'looking for food', flee: 'fleeing', shy: 'keeping its distance', sleep: 'asleep', tosleep: 'looking for somewhere to sleep',
    listen: 'listening to you', follow: 'following your light', warm: 'warming itself', play: 'playing', dormant: 'dormant', drift: 'drifting', trick: 'showing off' };
  const DENY = { cost: 'Not enough glow.', max: 'No room for more of those.', locked: 'Not yet.', space: 'Too close to something. Try a clearer spot.', full: 'That is plenty. What nobody eats turns to murk.', beam: 'The light needs a moment.' };

  // Plain instructions, shown one at a time when they are likely to be needed.
  // again: shows whenever true. until: acted on, never shown again. Otherwise it retires after a while on screen.
  const HINTS = [
    { id: 'dormant', again: 1, text: 'They are dormant. Drop food right against the still one, three times.', when: x => x.c.dormant },
    { id: 'latched', again: 1, text: 'Something has latched on. Tap it off.', when: x => x.s.threats.some(t => t.att) },
    { id: 'virus', text: 'A virus. Tap it before it latches on.', when: x => x.s.threats.some(t => t.kind === 'virus' && !t.att), until: x => x.s.stats.popped > 0 },
    { id: 'feed', text: 'Tap the water near it to drop food.', when: x => x.s.stats.eaten === 0, until: x => x.s.stats.eaten > 0, life: 600 },
    { id: 'glow', text: 'Tap the drifting sparks to gather glow.', when: x => x.s.motes.length > 0, until: x => x.s.stats.gathered > 0, life: 90 },
    { id: 'ready', text: 'The world is ready for its next age. Tap the ring.', when: x => x.c.ready && x.sim.canEvolve() && x.s.stage < 2, until: x => x.s.stage > 1, life: 600 },
    { id: 'tasks', again: 1, text: '', when: x => x.c.ready && x.s.stage < D.LAST && !x.sim.canEvolve() && x.tasks.some(t => !t.done), say: x => 'Grown, and waiting on you: ' + x.tasks.find(t => !t.done).text.toLowerCase() + '.' },
    { id: 'visitor', text: 'Something else is drifting through. Tap it to note it down.', when: x => x.s.visitors.some(v => !v.seen && !x.s.codex[v.sp] && v.t > 4), until: x => x.s.stats.found > 0, life: 80 },
    { id: 'teach', text: 'It just did something. Touch it within a few seconds and it will learn.', when: x => x.s.stage >= 4 && !!x.c.trick, until: x => Object.keys(x.c.base).length > 0, life: 40 },
    { id: 'cue', text: 'Double tap open water as a signal. If it answers with something you like, touch it.', when: x => x.s.stage >= 4 && Object.keys(x.c.base).length > 0 && !x.c.trick, until: x => x.sim.tricks().length > 0, life: 30 },
    { id: 'protein', text: 'They need protein to grow. Drop live food.', when: x => x.s.stage >= 2 && x.c.protein < 0.1 && !x.c.dormant, life: 20 },
    { id: 'air', text: 'The water is short of air. An air bubble, or more algae in the light.', when: x => x.s.stage >= 2 && x.s.env.O2 < 0.35, life: 24 },
    { id: 'murk', text: 'The water is murky. Tap the dull specks to clear them.', when: x => x.s.env.clarity < 0.5, life: 20 },
    { id: 'cold', text: 'They are cold. A warm seep would help.', when: x => x.s.stage >= 3 && x.c.warmth < 0.5, life: 20 },
    { id: 'mineral', text: 'They mend slowly without minerals. Drop some grit.', when: x => x.s.stage >= 2 && x.c.mineral < 0.08 && x.c.health < 0.8, life: 20 },
    { id: 'build', text: 'You have glow enough to plant algae. Open Place.', when: x => x.s.stage >= 1 && x.sim.count('algae') === 0 && x.s.essence >= x.sim.fixtureCost('algae'), until: x => x.s.stats.placed > 0, life: 60 },
    { id: 'hold', text: 'Hold a finger on the water to call them.', when: x => x.s.stage >= 1 && x.c.age > 70, until: x => !!x.sim.lure, life: 22 },
    { id: 'stir', text: 'Drag a finger through the water to stir it.', when: x => x.s.stage >= 1 && x.c.age > 150, life: 14 },
    { id: 'pinch', text: 'Pinch, or scroll, to look closer.', when: x => x.s.stage >= 2 && x.c.age > 240, until: x => x.app.zoom !== 1, life: 14 },
    { id: 'idle', text: 'It carries on while you are away. Come back and see how far it got.', when: x => x.s.stage >= 2 && x.c.age > 400, life: 12 },
    { id: 'sleep', text: 'It is asleep. Waking it early makes it grumpy.', when: x => x.c.sleeping, life: 12 },
    { id: 'senses', text: 'In Settings you can let them feel the phone tilt and hear your voice.', when: x => x.s.stage >= 4 && !x.s.settings.tilt && !x.s.settings.mic && x.c.age > 200, life: 14 },
  ];

  // ---------------------------------------------------------------- build

  function build() {
    const toolBtn = t => `<button class="tool ctl hidden" data-tool="${t.id}" aria-pressed="false" aria-label="${t.say}" title="${t.say}">${svg(t.icon)}<span>${t.label}</span>${t.cost ? `<em>${t.cost}</em>` : ''}</button>`;
    const meter = (id, name, thin) => `<div class="m${thin ? ' thin' : ''} hidden" id="u-m-${id}"><span>${name}</span><b><i></i></b></div>`;
    root.innerHTML = `
<div class="pre" id="u-pre"></div>
<div class="hud hidden" id="u-hud">
  <div class="tl">
    <button class="ident ctl" data-do="life" aria-label="About this world"><span class="where" id="u-where"></span><span class="nm" id="u-name"></span><span class="sub" id="u-sub"></span></button>
    <div class="meters ctl" data-do="life" id="u-meters" role="button" aria-label="How they are doing">
      ${meter('energy', 'Food')}${meter('protein', 'Protein', 1)}${meter('mineral', 'Mineral', 1)}${meter('health', 'Health')}${meter('mood', 'Mood')}${meter('rest', 'Rest')}${meter('trust', 'Trust')}
    </div>
    <button class="tasks ctl hidden" id="u-tasks" data-do="ring" aria-label="What this age needs"></button>
  </div>
  <div class="tr">
    <div class="row">
      <button class="glow ctl" id="u-glow" data-do="glow" title="Glow: what the world earns, spent on traits and things to place" aria-label="Glow">${svg('spark')}<span id="u-glown">0</span></button>
      <button class="ib ctl" data-do="settings" aria-label="Settings" title="Settings">${svg('settings')}</button>
    </div>
    <button class="ib ctl door" data-do="life" id="u-d-life" aria-label="The world" title="The world">${svg('life')}<s></s></button>
    <button class="ib ctl door" data-do="notes" id="u-d-notes" aria-label="Field notes" title="Field notes">${svg('notes')}<s></s></button>
    <button class="chip ctl hidden" data-do="water" id="u-chip" aria-label="Water" title="Water">${svg('water')}<span id="u-chipw"></span></button>
  </div>
  <div class="dock">
    <div class="tools" id="u-tools">${TOOLS.map(toolBtn).join('')}</div>
    <button class="ring ctl" id="u-ring" data-do="ring" aria-label="Growth">
      <svg viewBox="0 0 60 60" aria-hidden="true"><circle class="trk" cx="30" cy="30" r="26"/><circle class="prg" id="u-prg" cx="30" cy="30" r="26" transform="rotate(-90 30 30)"/></svg>
      <span id="u-ringic">${svg('evolve')}</span>
    </button>
  </div>
</div>
<div class="lower" id="u-lower">
  <div class="caption" id="u-cap" aria-live="polite"><p id="u-capp"></p></div>
  <div class="banner ctl hidden" id="u-banner"><span id="u-bantext"></span><button class="btn sm" data-act="hold-on">Hold on a little</button></div>
  <div class="toasts" id="u-toasts" role="status"></div>
  <div class="hint" id="u-hint" aria-live="polite"></div>
  <div class="tray ctl hidden" id="u-tray"></div>
</div>
<div class="title" id="u-title"><p class="t1" id="u-t1"></p><p class="t2" id="u-t2"></p><p class="t3" id="u-t3"></p></div>
<div class="scrim" id="u-scrim"></div>
<section class="sheet" id="u-sheet" role="dialog" aria-labelledby="u-stitle" aria-hidden="true" tabindex="-1">
  <header id="u-shead"><div class="grab"></div><h2 id="u-stitle"></h2><button class="ib" id="u-sclose" data-act="close" aria-label="Close">${svg('close')}</button></header>
  <nav class="tabs hidden" id="u-tabs" role="tablist"></nav>
  <div class="body" id="u-sbody"></div>
</section>`;
    for (const n of root.querySelectorAll('[id]')) el[n.id.slice(2)] = n;
    el.toolBtns = Array.from(el.tools.children);

    root.addEventListener('pointerdown', wake, true);
    root.addEventListener('click', onClick);
    el.sbody.addEventListener('input', onInput);
    el.scrim.addEventListener('click', closeSheet);
    el.capp.addEventListener('click', () => endCaption());
    // Swipe the sheet's header down to close it.
    let dragY = null;
    el.shead.addEventListener('pointerdown', e => { dragY = e.clientY; });
    el.shead.addEventListener('pointermove', e => { if (dragY !== null && e.clientY - dragY > 70) { dragY = null; closeSheet(); } });
    el.shead.addEventListener('pointerup', () => { dragY = null; });
    el.shead.addEventListener('pointercancel', () => { dragY = null; });
    window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (sheet) closeSheet(); else if (trayOpen) setTray(false); } });
    window.addEventListener('resize', () => { seen.barY = null; });
  }

  // ---------------------------------------------------------------- clicks

  function onClick(e) {
    const t = e.target.closest('[data-tool],[data-do],[data-act]');
    if (!t || !root.contains(t)) return;
    if (t.dataset.tool) return pickTool(t.dataset.tool);
    if (t.dataset.do) return door(t.dataset.do);
    act(t.dataset.act, t.dataset.id, t);
  }

  function pickTool(id) {
    if (id === 'habitat') { setTray(!trayOpen); return; }
    tool = id;
    setTray(false);
    markTool();
  }
  function markTool() {
    const building = tool === 'remove' || tool.indexOf('place:') === 0;
    for (const b of el.toolBtns) { const on = b.dataset.tool === tool || (b.dataset.tool === 'habitat' && (building || trayOpen)); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
    seen.tray = null;
  }
  function setTray(on) {
    trayOpen = on;       // a piece already chosen stays in hand
    if (on) endCaption();
    markTool();
    drawTray();
  }

  function door(id) {
    if (id === 'ring') id = 'evolve';
    if (id === 'glow') { id = 'life'; if (sheet !== 'life') tab.life = 'body'; }       // glow is spent on the body
    if (sheet === id) return closeSheet();
    openSheet(id);
  }

  function act(name, id) {
    const sim = app.sim, s = sim.s;
    switch (name) {
      case 'close': closeSheet(); break;
      case 'tab': tab[sheet] = id; confirmHeir = 0; pickPlace = ''; skeleton(); el.sbody.scrollTop = 0; break;
      case 'evolve': if (sim.evolve(id || undefined)) closeSheet(); else toast('The world is not ready.'); break;
      case 'buy': if (!sim.buyTrait(id)) toast(DENY.cost); refreshSheet(); break;
      case 'pass-ask': { confirmHeir = +id; refreshSheet(); const q = el.sbody.querySelector('.confirm'); if (q && q.scrollIntoView) q.scrollIntoView({ block: 'nearest' }); break; }
      case 'pass-no': confirmHeir = 0; refreshSheet(); break;
      case 'pass-yes': if (sim.passLight(+id)) { confirmHeir = 0; seen = {}; refreshSheet(); } else toast('Not now.'); break;
      case 'hold-on': s.launchT = Math.min(600, Math.max(0, s.launchT) + 60); seen.banner = null; break;
      case 'let-go': s.launchT = 0.05; closeSheet(); break;
      case 'place-pick': pickPlace = pickPlace === id ? '' : id; refreshSheet(); break;
      case 'pick': {
        const why = sim.canPlace(id);
        if (why === 'locked' || why === 'max') { toast(DENY[why]); break; }
        if (why === 'cost') toast(DENY.cost);
        tool = 'place:' + id; trayOpen = false; markTool(); drawTray(); break;
      }
      case 'pick-remove': tool = 'remove'; trayOpen = false; markTool(); drawTray(); break;
      case 'tray-done': tool = 'feed'; trayOpen = false; markTool(); drawTray(); break;
      case 'tray-open': setTray(true); break;
      // settings
      case 'toggle': app.setSetting(id, !s.settings[id]).then(() => { if (sheet === 'settings') skeleton(); }); break;
      case 'narrate': app.setSetting('narrate', id).then(() => { if (id === 'off') endCaption(); if (sheet === 'settings') skeleton(); }); break;
      case 'zoom': app.zoom = 1; toast('Zoom reset.'); break;
      case 'rename': { const inp = el.sbody.querySelector('#u-rename'); if (inp && app.rename(inp.value)) { toast('Renamed.'); seen.sub = null; } else toast('It needs a name.'); break; }
      case 'copy': copyCode(); break;
      case 'paste-open': pasteOpen = !pasteOpen; codeShown = ''; skeleton(); break;
      case 'paste-load': {
        const ta = el.sbody.querySelector('#u-code');
        if (ta && app.importSave(ta.value)) { pasteOpen = false; closeSheet(); toast('Save loaded.'); } else toast('That is not a save code.');
        break;
      }
      case 'wipe-ask': step = 1; skeleton(); break;
      case 'wipe-no': step = 0; skeleton(); break;
      case 'wipe-yes': step = 0; closeSheet(); app.reset(); break;
    }
  }
  function onInput(e) {
    if (e.target.id === 'u-vol') app.setSetting('volume', +e.target.value / 100);
  }
  function copyCode() {
    const code = app.exportSave();
    const fallback = () => { codeShown = code; pasteOpen = false; skeleton(); const ta = el.sbody.querySelector('#u-codeout'); if (ta) { ta.focus(); ta.select(); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => toast('Save code copied.'), fallback);
    else fallback();
  }

  // ---------------------------------------------------------------- the HUD, every frame

  function setMeter(id, v, on) {
    const node = el['m-' + id];
    if (put('mv:' + id, on ? 1 : 0)) show(node, on);
    if (!on) return;
    const q = Math.round(U.clamp01(v) * 50) / 50;
    if (put('m:' + id, q)) {
      node.querySelector('i').style.transform = `scaleX(${q})`;
      node.classList.toggle('warn', q < 0.3 && q >= 0.15);
      node.classList.toggle('low', q < 0.15);
    }
  }

  function frame(dt, snap) {
    if (!app) return;
    const sim = app.sim, s = sim.s, c = s.c;
    if (capTimer > 0) { capTimer -= dt; if (capTimer <= 0) endCaption(); }
    const busy = !!(M.Render && M.Render.raining && M.Render.raining()) || titleOn;
    if (put('c-sheet', sheet ? 1 : 0)) root.classList.toggle('sheet-open', !!sheet);
    if (put('c-tray', trayOpen ? 1 : 0)) root.classList.toggle('tray-open', trayOpen);
    if (put('c-busy', busy ? 1 : 0)) root.classList.toggle('busy', busy);
    if (put('c-cap', capTimer > 0 ? 1 : 0)) root.classList.toggle('cap-on', capTimer > 0);
    // Nobody should come back to a world that let go while they were reading about being away.
    if (sheet === 'away' && s.launchT > 0 && s.launchT < 90) s.launchT = 90;

    if (put('born', c.born ? 1 : 0)) { show(el.hud, c.born); show(el.pre, !c.born); if (!c.born) { tool = 'feed'; trayOpen = false; } }
    if (!c.born) {
      const line = ['Tap the water.', 'Again.', 'Once more.'][Math.min(2, c.birthTaps)];
      if (put('pre', line)) el.pre.textContent = line;
      if (put('banner', '')) show(el.banner, false);
      return;
    }

    // Fast things: cheap, and each only written when it changes.
    const glow = U.fmt(s.essence);
    if (put('glow', glow)) el.glown.textContent = glow;
    setMeter('energy', snap.energy, true);
    setMeter('protein', snap.protein, s.stage >= 2);
    setMeter('mineral', snap.mineral, s.stage >= 2);
    setMeter('health', snap.health, true);
    setMeter('mood', snap.mood, s.stage >= 4);
    setMeter('rest', snap.rest, s.stage >= 4);
    setMeter('trust', snap.bond, s.stage >= 4);
    const last = s.stage >= D.LAST;
    const prog = Math.round(snap.growth * 200) / 200;
    if (put('prog', prog)) el.prg.style.strokeDashoffset = (163.4 * (1 - prog)).toFixed(1);
    const ready = last ? sim.canLaunch() : sim.canEvolve();
    if (put('ready', ready ? 1 : 0)) el.ring.classList.toggle('ready', !!ready);
    if (put('morph', snap.morph >= 0 ? 1 : 0)) el.hud.classList.toggle('morph', snap.morph >= 0);
    if (s.stage >= 2) {
      const cd = Math.ceil(Math.max(0, s.timers.beam) / 14 * 20) / 20;
      if (put('beam', cd)) el.toolBtns[3].style.setProperty('--cd', cd);
    }
    // the drop is letting go
    const going = snap.launchT >= 0 ? `The drop is letting go · ${clock(snap.launchT)}` : '';
    if (put('banner', going)) { el.bantext.textContent = going; show(el.banner, !!going); }
    if (sheet === 'settings' && el.mic) el.mic.style.transform = `scaleX(${U.clamp01(app.micLevel()).toFixed(2)})`;

    if (hint) { hint.shown += dt; }
    slowT += dt;
    if (slowT >= 0.25) { slowT = 0; slow(snap); }
    portraitT += dt;
    if (sheet && portraitT > 2) { portraitT = 0; drawPortraits(true); }
  }

  // Four times a second: words, what is unlocked, hints, and whichever sheet is open.
  function slow(snap) {
    const sim = app.sim, s = sim.s, c = s.c, st = sim.def();
    const where = (s.world.rare ? '✦ ' : '') + (s.world.prep || 'on') + ' ' + s.world.name;
    if (put('where', where)) { el.where.textContent = where; el.where.classList.toggle('rare', !!s.world.rare); }
    if (put('name', st.name)) el.name.textContent = st.name;
    const n = snap.pop, left = snap.left >= 0 ? ` · ${clock(snap.left)} left` : '';
    const sub = `${n} ${n === 1 ? 'life' : 'lives'} · day ${Math.floor(c.age / sim.dayLen()) + 1}${s.world.n > 1 ? ' · world ' + s.world.n : ''}${left}`;
    if (put('sub', sub)) { el.sub.textContent = sub; el.sub.classList.toggle('warn', snap.left >= 0 && snap.left < 120); }
    const hue = G.hueDeg(c.g);
    if (put('hue', hue)) root.style.setProperty('--accent', `hsl(${hue} 34% 80%)`);

    if (put('stage', s.stage)) {
      for (let i = 0; i < TOOLS.length; i++) show(el.toolBtns[i], s.stage >= TOOLS[i].stage);
      show(el.chip, s.stage >= 2);
      el.ringic.innerHTML = svg(s.stage >= D.LAST ? 'seed' : 'evolve');
      el.ring.setAttribute('aria-label', s.stage >= D.LAST ? 'The seed crystal' : 'Growth: tap when the ring is full');
      const t = TOOLS.find(x => x.id === tool);
      if ((t && s.stage < t.stage) || (!t && s.stage < 1)) tool = 'feed';
      markTool();
    }

    // What the age needs from you: always there, louder once the growing is done.
    const tasks = sim.tasks(), waiting = c.ready && s.stage < D.LAST && tasks.some(t => !t.done);
    let th = '';
    if (tasks.length && s.stage < D.LAST && !(c.ready && !waiting)) {
      th = `<span class="th">${waiting ? 'Waiting on you' : 'This age needs'}</span>` + tasks.map(t => `<span class="t${t.done ? ' done' : ''}"><i></i>${esc(t.text)}${!t.done && t.n > 1 ? ` <em>${t.have}/${t.n}</em>` : ''}</span>`).join('');
    }
    if (put('tasks', th)) { el.tasks.innerHTML = th; show(el.tasks, !!th); }
    if (put('waiting', waiting ? 1 : 0)) { el.tasks.classList.toggle('waiting', waiting); el.ring.classList.toggle('waiting', waiting); }

    // The water chip: quiet unless something needs you.
    if (s.stage >= 2) {
      const env = s.env;
      let word = '', warn = true;
      if (env.O2 < 0.35 && !sim.mods.lungs) word = 'air';
      else if (env.clarity < 0.5) word = 'murk';
      else if (s.stage >= 3 && c.warmth < 0.5) word = 'cold';
      else { warn = false; word = env.weather ? D.WEATHER[env.weather.type].name.toLowerCase() : ''; }
      if (put('chip', word + (warn ? '!' : ''))) { el.chipw.textContent = word; el.chip.classList.toggle('warn', warn); }
    }
    if (put('b-life', badge.life ? 1 : 0)) el['d-life'].classList.toggle('badge', badge.life);
    if (put('b-notes', badge.notes ? 1 : 0)) el['d-notes'].classList.toggle('badge', badge.notes);
    // keep the microscope's scale bar clear of the dock
    if (M.Render && put('barY', window.innerHeight)) { const r = el.ring.getBoundingClientRect(); M.Render.barY = (r.top || window.innerHeight - 70) - 14; }

    // A piece in hand that can no longer be placed goes back to feeding.
    if (tool.indexOf('place:') === 0) { const why = sim.canPlace(tool.slice(6)); if (why === 'max' || why === 'locked') { tool = 'feed'; markTool(); } }
    drawTray();
    pickHint(snap, tasks);
    if (sheet) refreshSheet();
  }

  function pickHint(snap, tasks) {
    const sim = app.sim, s = sim.s, x = { sim, s, c: s.c, snap, app, tasks };
    let next = null;
    if (!s.c.morph && !sheet && snap.launchT < 0) {
      for (const h of HINTS) {
        const key = 'hint:' + h.id;
        if (!h.again && s.flags[key]) continue;
        if (!h.again && h.until && h.until(x)) { s.flags[key] = 1; continue; }
        if (hint && hint.h === h && !h.again && hint.shown > (h.life || 16)) { s.flags[key] = 1; continue; }
        if (h.when(x)) { next = h; break; }
      }
    }
    if ((hint && hint.h) !== next) hint = next ? { h: next, shown: 0 } : null;
    const text = next && !trayOpen ? (next.say ? next.say(x) : next.text) : '';
    if (put('hint', text)) { el.hint.textContent = text; el.hint.classList.toggle('on', !!text); }
  }

  // ---------------------------------------------------------------- the tray of things to place

  function drawTray() {
    const sim = app.sim;
    const placing = tool.indexOf('place:') === 0 ? tool.slice(6) : '';
    let html = '';
    if (trayOpen) {
      const rows = D.BUILDABLE.map(id => {
        const f = D.FIXTURES[id], why = sim.canPlace(id), n = sim.count(id), max = sim.fixtureMax(id);
        const note = why === 'locked' ? `Arrives with the ${D.STAGES[f.stage].name}` : esc(f.desc);
        return `<button class="row${why === 'locked' ? ' locked' : ''}${why === 'max' ? ' full' : ''}${why === 'cost' ? ' poor' : ''}" data-act="pick" data-id="${id}">
          <span class="t"><b>${f.name}</b><small>${note}</small></span>
          <span class="n">${why === 'locked' ? '' : `${n}/${max}`}</span><span class="c">${why === 'locked' ? '' : glowN(sim.fixtureCost(id))}</span></button>`;
      }).join('');
      html = `<div class="list">${rows}<button class="row" data-act="pick-remove"><span class="t"><b>Take a piece out</b><small>Tap one to remove it. Some glow comes back.</small></span></button></div>`;
    } else if (placing && D.FIXTURES[placing]) {
      const why = sim.canPlace(placing);
      html = `<div class="inhand"><span>Tap the water to place <b>${D.FIXTURES[placing].name}</b> ${why === 'cost' ? '<i>not enough glow</i>' : glowN(sim.fixtureCost(placing))}</span><button class="btn sm" data-act="tray-open">Other</button><button class="btn sm" data-act="tray-done">Done</button></div>`;
    } else if (tool === 'remove') {
      html = '<div class="inhand"><span>Tap a piece to take it out</span><button class="btn sm" data-act="tray-done">Done</button></div>';
    }
    if (put('tray', html)) { el.tray.innerHTML = html; show(el.tray, !!html); el.tray.classList.toggle('open', trayOpen); }
  }

  // ---------------------------------------------------------------- captions, toasts and the title card

  function caption(text, pri, dur) {
    if (!el.cap) return;
    el.capp.textContent = text;
    el.cap.classList.toggle('big', pri >= 4 && text.length < 200);
    el.cap.classList.toggle('long', text.length > 190);
    el.cap.classList.toggle('xlong', text.length > 290);
    el.cap.classList.remove('on');
    void el.cap.offsetWidth;        // restart the fade
    el.cap.classList.add('on');
    capTimer = dur || 6;
  }
  function endCaption() {
    capTimer = 0;
    if (el.cap) el.cap.classList.remove('on');
  }

  function toast(text, opens) {
    if (!el.toasts || !text) return;
    if (el.toasts.lastChild && el.toasts.lastChild.textContent === text) return;
    while (el.toasts.children.length >= 1) el.toasts.removeChild(el.toasts.firstChild);
    const n = document.createElement(opens ? 'button' : 'div');
    n.className = 'toast' + (opens ? ' ctl' : '');
    if (opens) n.dataset.do = opens;
    n.textContent = text;
    el.toasts.appendChild(n);
    setTimeout(() => n.classList.add('out'), opens ? 4200 : 2600);
    setTimeout(() => { if (n.parentNode) n.parentNode.removeChild(n); }, opens ? 4700 : 3100);
  }

  // Over the dry-up, the cloud and the fall: where the drop has come down this time.
  function titleCard(world, forced) {
    for (const t of titleT) clearTimeout(t);
    const set = (a, b, c2) => { el.t1.textContent = a; el.t2.textContent = b; el.t3.textContent = c2; };
    el.title.classList.remove('on', 'two');
    set(forced ? 'It is gone.' : 'The drop lets go.', '', '');
    titleOn = true;
    titleT = [
      setTimeout(() => { titleOn = false; }, 10900),
      setTimeout(() => el.title.classList.add('on'), 350),
      setTimeout(() => el.title.classList.remove('on'), 4300),
      setTimeout(() => { set('World ' + world.n, (world.prep || 'on') + ' ' + world.name, world.rare ? 'somewhere strange' : ''); el.title.classList.add('on', 'two'); }, 5600),
      setTimeout(() => el.title.classList.remove('on'), 10400),
    ];
  }

  let floatSum = 0, floatT = 0;
  function floatGlow(val) {
    floatSum += val;
    clearTimeout(floatT);
    floatT = setTimeout(() => {
      const n = document.createElement('i');
      n.className = 'plus';
      n.textContent = '+' + U.fmt(floatSum);
      floatSum = 0;
      el.glow.appendChild(n);
      el.glow.classList.remove('bump'); void el.glow.offsetWidth; el.glow.classList.add('bump');
      setTimeout(() => { if (n.parentNode) n.parentNode.removeChild(n); }, 1100);
    }, 60);
  }

  function event(e) {
    if (!app) return;
    const quiet = app.sim.s.settings.narrate === 'off';
    switch (e.type) {
      case 'collect': floatGlow(e.val); break;
      case 'deny': toast(DENY[e.why] || 'Not here.'); break;
      case 'weather': if (e.on && app.sim.s.settings.narrate !== 'full') toast(e.line); break;   // the narrator covers it otherwise
      case 'learned': badge.life = sheet !== 'life'; if (quiet) toast(`Learned: ${D.BEHAVIOURS[e.beh].name} at ${D.CUES[e.cue].name}.`); break;
      case 'discover': badge.notes = sheet !== 'notes'; toast(`Noted: ${e.name}`, 'notes'); break;
      case 'heir': seen = {}; if (quiet) toast(`The eye follows ${e.name} now.`); break;
      case 'evolveReady': if (quiet) toast(e.last ? 'The seed crystal is whole.' : 'The world is grown.'); break;
      case 'journal': if (sheet !== 'notes' && quiet) badge.notes = true; break;
      case 'evolveStart': closeSheet(); setTray(false); break;
      case 'evolveMid': seen.stage = null; break;
      case 'launch': closeSheet(); tool = 'feed'; trayOpen = false; seen = {}; endCaption(); titleCard(e.world, e.forced); badge.notes = true; break;
    }
  }

  function tapped(result) {
    if (result === 'none' && tool === 'remove') toast('Tap a piece to take it out.');
  }

  // ---------------------------------------------------------------- sheets

  const TITLES = { evolve: 'The next age', life: 'The world', water: 'Water', notes: 'Field notes', settings: 'Settings', away: 'While you were away' };
  const TABS = { life: [['lives', 'Lives'], ['body', 'Body'], ['mind', 'Mind']], notes: [['visitors', 'Visitors'], ['places', 'Places'], ['journal', 'Journal']] };

  function openSheet(id) {
    sheet = id; step = 0; confirmHeir = 0; pasteOpen = false; codeShown = ''; pickPlace = '';
    if (id === 'life') badge.life = false;
    if (id === 'notes') badge.notes = false;
    setTray(false);
    if (!el.sheet.classList.contains('on')) focusWas = document.activeElement;
    el.sheet.classList.add('on'); el.scrim.classList.add('on');
    el.sheet.setAttribute('aria-hidden', 'false');
    skeleton();
    el.sbody.scrollTop = 0;
    try { el.sclose.focus({ preventScroll: true }); } catch (e) { /* focus is a nicety */ }
  }
  function closeSheet() {
    if (!sheet) return;
    sheet = null; el.mic = null;
    el.sheet.classList.remove('on'); el.scrim.classList.remove('on');
    el.sheet.setAttribute('aria-hidden', 'true');
    // Hand the keyboard back to wherever it was, or to the water.
    const back = focusWas && root.contains(focusWas) && !el.sheet.contains(focusWas) ? focusWas : document.getElementById('world');
    focusWas = null;
    try { if (back && el.sheet.contains(document.activeElement)) back.focus({ preventScroll: true }); } catch (e) { /* fine */ }
    if (app) app.save();
  }

  // Lay out the open sheet's sections, then fill them.
  function skeleton() {
    const t = tab[sheet];
    const secs = {
      evolve: ['ev'], water: ['w-note', 'w-g', 'w-c'], settings: ['set'], away: ['away'],
      life: t === 'body' ? ['b-head', 'b-vit', 'b-drift', 'b-genes', 'b-own', 'b-buy'] : t === 'mind' ? ['m-head', 'm-tricks', 'm-teach', 'm-mem'] : ['l-head', 'l-all', 'l-line'],
      notes: t === 'places' ? ['p-now', 'p-rare', 'p-plain', 'p-past'] : t === 'journal' ? ['j'] : ['v'],
    }[sheet] || [];
    el.stitle.textContent = sheet === 'evolve' && app.sim.s.stage >= D.LAST ? 'The seed crystal' : (TITLES[sheet] || '');
    show(el.tabs, !!TABS[sheet]);
    el.sheet.classList.toggle('tabbed', !!TABS[sheet]);      // a fixed height, so changing tab does not make the sheet jump
    if (TABS[sheet]) el.tabs.innerHTML = TABS[sheet].map(x => `<button role="tab" aria-selected="${t === x[0] ? 'true' : 'false'}" class="${t === x[0] ? 'on' : ''}" data-act="tab" data-id="${x[0]}">${x[1]}</button>`).join('');
    el.sbody.className = 'body s-' + sheet;
    el.sbody.innerHTML = secs.map(k => `<div class="sec" data-sec="${k}"></div>`).join('');
    el.secs = {};
    for (const n of el.sbody.children) el.secs[n.dataset.sec] = n;
    for (const k in seen) if (k.indexOf('sec:') === 0) delete seen[k];
    refreshSheet();
  }
  function sec(key, html) {
    const n = el.secs && el.secs[key];
    if (!n || !put('sec:' + key, html)) return false;
    n.innerHTML = html;
    secChanged = true;
    return true;
  }
  let secChanged = false;

  function refreshSheet() {
    if (!sheet) return;
    secChanged = false;
    const sim = app.sim, s = sim.s, snap = sim.snapshot(), t = tab[sheet];
    if (sheet === 'evolve') fillEvolve(sim, s, snap);
    else if (sheet === 'life') { if (t === 'body') fillBody(sim, s, snap); else if (t === 'mind') fillMind(sim, s, snap); else fillLives(sim, s, snap); }
    else if (sheet === 'water') fillWater(sim, s, snap);
    else if (sheet === 'notes') { if (t === 'places') fillPlaces(sim, s); else if (t === 'journal') fillJournal(s); else fillVisitors(sim, s); }
    else if (sheet === 'settings') { if (!seen['sec:set']) fillSettings(sim, s); }
    else if (sheet === 'away') fillAway(s);
    if (secChanged) drawPortraits(false);
  }

  function taskList(tasks) {
    return tasks.length ? `<ul class="todo">${tasks.map(t => `<li class="${t.done ? 'done' : ''}"><i></i><span>${esc(t.text)}</span>${t.n > 1 ? `<em>${t.have} of ${t.n}</em>` : ''}</li>`).join('')}</ul>` : '';
  }

  function fillEvolve(sim, s, snap) {
    const c = s.c, tasks = sim.tasks();
    if (c.morph) return;
    if (s.stage >= D.LAST) {
      const going = snap.launchT >= 0;
      sec('ev', `<p class="over">The last work of this world</p><h3 class="stage">${pct(sim.lanternProgress())}% grown</h3>
        <p class="lead">A drop of rain does not last. The seed crystal is how they mean to leave: when it is whole, the drop lets go, dries, and rains down somewhere else.</p>
        <h4>What goes with it</h4><ul class="plain"><li>Their genes, a little changed by the journey.</li><li>${sim.mods.remember ? 'More than half' : 'About a third'} of what they learned, as instinct.</li><li>A stronger line: each new world grows faster and glows more.</li></ul>
        <h4>What stays behind</h4><ul class="plain"><li>Everyone here, and everything placed in this water.</li><li>Their adaptations. The next world begins as one bubble and earns them again.</li><li>Nearly all of your glow.</li></ul>
        <p class="dim small">Where it comes down is chance. One landing in twenty is somewhere strange.</p>
        ${going ? `<p class="lead pad">The drop is letting go in ${clock(snap.launchT)}.</p><div class="rowb"><button class="btn" data-act="let-go">Let it go now</button><button class="btn ghost" data-act="hold-on">Hold on a little</button></div>` : ''}`);
      return;
    }
    const next = D.STAGES[s.stage + 1], grown = c.growth >= sim.def().need;
    const head = `<p class="over">After ${sim.def().name}</p><h3 class="stage">${next.name}</h3><p class="lead">${esc(next.blurb)}</p><p class="dim">${esc(next.gains)}</p>`;
    if (!sim.canEvolve()) {
      const other = sim.blockers().filter(b => !tasks.some(t => b.indexOf(t.text) === 0) && b !== 'Still growing');
      sec('ev', `${head}<h4>Before it can begin</h4><ul class="todo"><li class="${grown ? 'done' : ''}"><i></i><span>The world grows</span><em>${pct(snap.growth)}%</em></li></ul>${taskList(tasks)}
        ${other.length ? `<p class="dim">${other.map(esc).join(' · ')}</p>` : ''}<p class="dim small">It grows by itself while it thrives, here or while you are away. The rest it needs from you.</p>`);
      return;
    }
    const offer = sim.offer();
    const cards = offer.length
      ? offer.map(id => { const t = D.TRAITS[id]; return `<button class="card" data-act="evolve" data-id="${id}"><b>${t.name}</b><span>${esc(t.desc)}</span></button>`; }).join('')
      : '<button class="card" data-act="evolve" data-id=""><b>Begin</b><span>Let it become what it is becoming.</span></button>';
    sec('ev', `${head}<p class="over pad">Choose what they grow</p><div class="cards">${cards}</div><p class="dim small">The others can still be grown later, for glow.</p>`);
  }

  function vital(name, v) { return `<div class="vital"><span>${name}</span>${bar(v, v < 0.15 ? 'low' : v < 0.3 ? 'warn' : '')}<em>${pct(v)}</em></div>`; }

  // ---- The world: everyone in it

  function fillLives(sim, s, snap) {
    const c = s.c, st = sim.def(), dayLen = sim.dayLen(), canPass = sim.canPass(), heirs = canPass ? sim.heirs() : [];
    sec('l-head', `<p class="over">${s.world.rare ? '✦ ' : ''}World ${s.world.n} · ${s.world.prep || 'on'} ${esc(s.world.name)}</p><h3 class="stage">${st.name}</h3><p class="lead">${esc(st.blurb)}</p>
      <div class="facts"><div><span>Lives</span><b>${snap.pop} of ${st.pop[1]}</b></div><div><span>Day</span><b>${Math.floor(c.age / dayLen) + 1}</b></div><div><span>Generation</span><b>${s.gen}</b></div><div><span>Growth</span><b>${pct(snap.growth)}%</b></div></div>`);
    const cell = (key, name, kind, extra, cls) => `<li class="${cls || ''}"><canvas class="portrait" data-p="${key}"></canvas><b>${esc(name)}</b><i>${kind}</i>${extra || ''}</li>`;
    let cells = cell('self', c.name, 'the eye follows', '', 'self');
    let confirm = '';
    for (const f of s.fixtures) {
      if (f.type !== 'kin' && f.type !== 'elder' && f.type !== 'companion') continue;
      const d = Math.floor((f.age || 0) / dayLen) + 1, heir = heirs.indexOf(f) >= 0;
      const kind = f.type === 'elder' ? 'elder' : f.type === 'companion' ? 'wild one' : `day ${d}`;
      const extra = heir ? `<button class="btn sm" data-act="pass-ask" data-id="${f.id}">Follow</button>` : '';
      cells += cell('fx:' + f.id, f.name || '·', kind, extra, heir && confirmHeir === f.id ? 'pick' : '');
      if (heir && confirmHeir === f.id) confirm = `<div class="confirm"><p>Follow ${esc(f.name)} instead? The eye moves to it: its own genes and about half of what ${esc(c.name)} learned, and the world gives up some of its growth. ${esc(c.name)} stays a while as an elder, then fades. Choosing who is followed is how you breed them.</p><button class="btn" data-act="pass-yes" data-id="${f.id}">Follow ${esc(f.name)}</button><button class="btn ghost" data-act="pass-no">Not now</button></div>`;
    }
    sec('l-all', `<h4>Everyone</h4><ul class="lives">${cells}</ul>${confirm}<p class="dim small">${s.stage === 0 ? 'One, for now. They begin dividing in the next age.' : s.stage < 5 ? 'They divide by themselves while the world thrives.' : 'From this age you can choose which of the grown ones the eye follows.'}</p>`);
    const line = s.lineage.map((a, i) => `<li><canvas class="portrait" data-p="lin:${i}"></canvas><div><b>${esc(a.name)}</b> <i>generation ${a.gen}</i>
      <span>${D.STAGES[a.stage].name}${a.place ? ' · ' + esc(a.place) : ''} · ${a.days} days${a.tricks ? ' · ' + a.tricks + ' tricks' : ''}</span></div></li>`).reverse().join('');
    sec('l-line', line ? `<h4>Those the eye followed before</h4><ul class="kin">${line}</ul>` : '');
  }

  function fillBody(sim, s, snap) {
    const c = s.c, st = sim.def();
    const words = [G.colourWord(c.g)].concat(G.describe(c.g, 3));
    sec('b-head', `<div class="hero"><canvas class="portrait big" data-p="self"></canvas><div>
      <p class="over">The eye follows</p><h3>${esc(c.name)}</h3><p>${cap1(st.one)}</p><p class="dim">${cap1(words.join(', '))}.</p></div></div>`);
    let v = vital('Food', snap.energy);
    if (s.stage >= 2) v += vital('Protein', snap.protein) + vital('Minerals', snap.mineral);
    v += vital('Health', snap.health);
    if (s.stage >= 3) v += vital('Warmth', snap.warmth);
    if (s.stage >= 4) v += vital('Mood', snap.mood) + vital('Rest', snap.rest) + vital('Trust', snap.bond);
    sec('b-vit', `<h4>How it is doing</h4><div class="vitals">${v}</div><p class="dim small">The one you follow stands for them all: when it thrives, the world grows.</p>`);

    const drift = sim.drift(), pull = {};
    for (const d of drift) { const p = D.PRESSURES[d.id].pull; for (const g in p) if (pull[g] === undefined && Math.abs(p[g] - c.g.v[g]) > 0.04) pull[g] = p[g] > c.g.v[g] ? 1 : -1; }
    const lines = drift.slice(0, 3).map(d => `<li>It is ${esc(d.text)}.</li>`).join('');
    sec('b-drift', `<h4>What is shaping it</h4>${lines ? `<ul class="plain">${lines}</ul>` : '<p class="dim">Nothing is pulling at its genes just now.</p>'}
      <p class="dim small">How it lives slowly rewrites its body. The young inherit the result.</p>`);

    const genes = D.GENES.map(def => {
      const val = c.g.v[def.id];
      if (def.circular) return `<div class="gene"><span class="gn">${def.name}</span><span class="sw" style="background:hsl(${Math.round(val * 360)} 45% 70%)"></span><span class="gw">${G.colourWord(c.g)}</span><span class="ga${pull.hue ? ' turn' : ''}"></span></div>`;
      const word = val > 0.62 ? def.hi : val < 0.38 ? def.lo : '';
      return `<div class="gene"><span class="gn">${def.name}</span><span class="gb"><i style="left:${pct(val)}%"></i></span><span class="gw">${word}</span><span class="ga${pull[def.id] > 0 ? ' up' : pull[def.id] < 0 ? ' down' : ''}"></span></div>`;
    }).join('');
    sec('b-genes', `<h4>Genes</h4><div class="genes">${genes}</div>`);

    const own = c.traits.map(id => `<li><b>${D.TRAITS[id].name}</b><span>${esc(D.TRAITS[id].desc)}</span></li>`).join('');
    sec('b-own', `<h4>Adaptations</h4>${own ? `<ul class="traits">${own}</ul>` : '<p class="dim">None yet. Each new age brings one.</p>'}`);
    const buy = sim.buyable().map(id => {
      const t = D.TRAITS[id], cost = sim.traitCost(id), ok = s.essence >= cost;
      return `<li><b>${t.name}</b><span>${esc(t.desc)}</span><button class="btn sm${ok ? '' : ' off'}" data-act="buy" data-id="${id}">${glowN(cost)}</button></li>`;
    }).join('');
    sec('b-buy', buy ? `<h4>They could also grow</h4><ul class="traits buy">${buy}</ul>` : '');
  }

  function fillMind(sim, s, snap) {
    const c = s.c;
    const doing = snap.act === 'trick' && D.BEHAVIOURS[snap.trick] ? `showing off (${D.BEHAVIOURS[snap.trick].name})` : (DOING[snap.act] || snap.act);
    const bpm = Math.round(snap.heart / 4) * 4;
    let head = `<div class="facts"><div><span>Now</span><b>${c.dormant ? 'dormant' : esc(doing)}</b></div>
      <div><span>Pulse</span><b><i class="beat" style="animation-duration:${(60 / Math.max(20, bpm)).toFixed(2)}s"></i>${bpm} a minute</b></div>
      <div><span>Diet</span><b>${sim.dietWord()}</b></div>`;
    if (s.stage >= 4) head += `<div><span>Nature</span><b>${sim.personality().join(', ')}</b></div>`;
    head += '</div>';
    if (s.stage >= 4) head += `<div class="vitals">${vital('Trust', snap.bond)}</div><p class="dim small">Trust comes from visits spread over time, meals from your hand, and seeing off what hunts them. At three quarters, it starts leaving you gifts.</p>`;
    else head += '<p class="dim">Nothing here has nerves yet. Moods, sleep and learning arrive with the first animals, the Wheelbearers.</p>';
    sec('m-head', head);

    if (s.stage >= 4) {
      const tr = sim.tricks().map(t => `<li class="${t.learned ? 'known' : ''}"><span><b>${cap1(D.BEHAVIOURS[t.beh].name)}</b> at ${D.CUES[t.cue].name}${t.learned ? '<em>learned</em>' : ''}</span>${bar(t.w)}</li>`).join('');
      sec('m-tricks', `<h4>What it has learned</h4>${tr ? `<ul class="tricks">${tr}</ul>` : '<p class="dim">Nothing yet.</p>'}`);
      const st = s.settings;
      const cues = D.CUE_IDS.map(id => `<li><b>${D.CUES[id].short}</b>${id === 'hum' && !st.mic ? ' <i>(turn on listening in settings)</i>' : id === 'tilt' && !st.tilt ? ' <i>(turn on tilt in settings)</i>' : ''}</li>`).join('');
      sec('m-teach', `<h4>Teaching</h4><p class="dim">Give a signal. If the one you follow does something you like, touch it or feed it within a few seconds. A few times, and the signal starts to mean the trick. Ignore what you do not want. The young copy what the old have learned, and a little of it survives the rain.</p><ul class="plain cues">${cues}</ul>`);
    } else { sec('m-tricks', ''); sec('m-teach', ''); }

    let cells = '';
    for (let i = 0; i < c.mem.length; i++) {
      const v = Math.round(U.clamp(c.mem[i], -1, 1) * 10) / 10;
      cells += `<i style="background:${v > 0 ? `rgba(255,214,150,${(v * 0.8).toFixed(2)})` : v < 0 ? `rgba(130,180,255,${(-v * 0.8).toFixed(2)})` : 'transparent'}"></i>`;
    }
    sec('m-mem', `<h4>Its map of the drop</h4><div class="memwrap"><div class="mem">${cells}</div><p class="dim small">Warm where good things have happened to it. Cold where it has been hurt or frightened. It wanders towards the warm.</p></div>`);
  }

  // ---- Field notes: what has been seen, and where the drop has been

  function fillVisitors(sim, s) {
    const all = D.SPECIES, known = all.filter(q => s.codex[q.id]);
    const rows = known.map(q => `<li><canvas class="portrait wild" data-p="sp:${q.id}"></canvas><div><b>${esc(q.name)}</b> <i>seen ${s.codex[q.id]} time${s.codex[q.id] === 1 ? '' : 's'}</i><span class="note">${esc(q.note)}</span></div></li>`).join('');
    const blanks = all.length - known.length;
    sec('v', `<p class="over">${known.length} of ${all.length} noted</p>
      ${rows ? `<ul class="kin notes">${rows}</ul>` : '<p class="lead">Nothing noted yet.</p>'}
      ${blanks ? `<div class="blanks">${'<i>?</i>'.repeat(blanks)}</div>` : ''}
      <p class="dim small">Other lives drift through the drop now and then. Tap one to note it down. Some only turn up in later ages, some only at night, and a few only in particular places.</p>`);
  }

  function fillPlaces(sim, s) {
    const w = s.world, here = D.PLACE[w.id] || {};
    sec('p-now', `<p class="over">World ${w.n}</p><h3 class="stage">${cap1(esc(w.name))}</h3>${w.rare && here.line ? `<p class="lead narr">${esc(here.line)}</p>` : '<p class="dim">An ordinary place for a drop of rain to end up.</p>'}`);
    const seenRare = D.SCENARIOS.filter(p => s.atlas[p.id]);
    const grid = D.SCENARIOS.map(p => (s.atlas[p.id]
      ? `<button class="pl on${pickPlace === p.id ? ' pick' : ''}" data-act="place-pick" data-id="${p.id}" style="--h:${p.hue}" aria-label="${esc(p.name)}"></button>`
      : '<span class="pl">?</span>')).join('');
    const picked = pickPlace && D.PLACE[pickPlace] && s.atlas[pickPlace] ? D.PLACE[pickPlace] : null;
    sec('p-rare', `<h4>Strange places</h4><p class="dim">${seenRare.length} of ${D.SCENARIOS.length} found. One landing in twenty comes down somewhere strange.</p><div class="atlas">${grid}</div>
      ${picked ? `<div class="confirm"><p><b>${cap1(esc(picked.name))}</b></p><p class="narr">${esc(firstSentence(picked.line))}</p></div>` : seenRare.length ? '<p class="dim small">Tap a lit square to read where that was.</p>' : ''}`);
    const plain = D.LANDINGS.filter(p => s.atlas[p.id]).map(p => `<span class="tag">${esc(p.name)}${s.atlas[p.id] > 1 ? ' ×' + s.atlas[p.id] : ''}</span>`).join('');
    sec('p-plain', `<h4>Ordinary ground</h4><div class="tags">${plain}</div>`);
    const past = s.worlds.map(p => `<li><span class="sw" style="background:hsl(${p.hue} 40% 55%)"></span><div><b>World ${p.n}</b> <i>${esc(((D.PLACE[p.id] || {}).prep || 'on') + ' ' + p.name)}</i><span>${p.forced ? 'Ran out of time at' : 'Reached'} ${D.STAGES[p.stage] ? D.STAGES[p.stage].name : ''} · ${p.pop || 1} lives</span></div></li>`).reverse().join('');
    sec('p-past', past ? `<h4>Worlds before this one</h4><ul class="kin">${past}</ul>` : '');
  }

  function fillJournal(s) {
    const j = s.journal, from = Math.max(0, j.length - 150);
    let html = '';
    for (let i = j.length - 1; i >= from; i--) html += `<li><span>Day ${j[i].day} · ${D.STAGES[j[i].stage] ? D.STAGES[j[i].stage].name : ''}</span><p>${esc(j[i].text)}</p></li>`;
    sec('j', html ? `<ul class="journal">${html}</ul>` : '<p class="dim">Nothing has happened yet.</p>');
  }

  function gauge(name, v, text) { return `<div class="gauge"><div class="gt"><b>${name}</b><em>${pct(v)}</em></div>${bar(v)}<p>${esc(text)}</p></div>`; }
  function fillWater(sim, s, snap) {
    const r = sim.waterReport(), env = s.env;
    const q = v => Math.round(U.clamp01(v) * 50) / 50;
    sec('w-note', s.stage < 2 ? '<p class="dim">The water is simple for now. Air and richness begin to matter in the age of Complex Cells.</p>' : '<p class="dim">Light grows algae and makes air. Everything alive uses air up. Waste clouds the water, then feeds the algae.</p>');
    sec('w-g', gauge('Light', q(snap.light), r.light) + gauge('Warmth', q((env.temp + 0.75) / 1.4), r.warm) + gauge('Clarity', q(env.clarity), r.clear) + gauge('Air', q(env.O2), r.air) + gauge('Richness', q(env.N), r.rich));
    const weather = env.weather ? `${D.WEATHER[env.weather.type].name}, ${span(env.weather.dur - env.weather.t)} left` : 'Calm';
    sec('w-c', `<h4>In the water</h4><div class="facts"><div><span>Weather</span><b>${weather}</b></div><div><span>Algae beds</span><b>${sim.count('algae')}</b></div>
      <div><span>Drifting algae</span><b>${sim.countFood('algae')}</b></div><div><span>Plankton</span><b>${sim.countFood('plankton')}</b></div><div><span>Murk</span><b>${s.wastes.length}</b></div><div><span>Visitors</span><b>${s.visitors.length}</b></div></div>`);
  }

  function fillSettings(sim, s) {
    const st = s.settings, sens = app.sensors;
    const sw = (key, name, note) => `<button class="switch" role="switch" aria-checked="${st[key] ? 'true' : 'false'}" data-act="toggle" data-id="${key}"><span><b>${name}</b>${note ? `<small>${note}</small>` : ''}</span><i></i></button>`;
    const seg = [['full', 'Full'], ['quiet', 'Milestones'], ['off', 'Off']].map(o => `<button class="${st.narrate === o[0] ? 'on' : ''}" aria-pressed="${st.narrate === o[0] ? 'true' : 'false'}" data-act="narrate" data-id="${o[0]}">${o[1]}</button>`).join('');
    const micNote = st.mic ? 'Hum or whistle. They listen, and later answer.<span class="lvl"><i id="u-miclvl"></i></span>' : sens.micOk === false ? 'No microphone was allowed.' : 'Hum or whistle to them. Nothing is recorded or sent.';
    const tiltNote = sens.tiltOk === false ? 'This device will not share its tilt.' : 'Tip the phone and the water runs downhill.';
    let save = `<div class="rowb"><button class="btn" data-act="copy">Copy save code</button><button class="btn" data-act="paste-open">Paste save code</button></div>`;
    if (codeShown) save += `<textarea id="u-codeout" aria-label="Your save code" readonly rows="3">${esc(codeShown)}</textarea><p class="dim small">Copy all of this and keep it somewhere.</p>`;
    if (pasteOpen) save += `<textarea id="u-code" aria-label="Save code to load" rows="3" placeholder="MOTE1:…" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea><button class="btn" data-act="paste-load">Load this save</button><p class="dim small">Loading replaces the world you have now. The old one is kept once on this device, in case.</p>`;
    const wipe = step ? `<div class="confirm"><p>Everything is lost: this world, the line, the field notes, every place it has been. This cannot be undone.</p><button class="btn danger" data-act="wipe-yes">Yes, start over</button><button class="btn ghost" data-act="wipe-no">Keep it</button></div>` : '<button class="btn ghost" data-act="wipe-ask">Start over</button>';
    sec('set', `
      <h4>Sound</h4>
      <label class="range"><span>Volume</span><input type="range" id="u-vol" min="0" max="100" value="${Math.round(st.volume * 100)}"></label>
      <div class="segrow"><span>Narrator</span><div class="seg">${seg}</div></div>
      ${sw('speak', 'Read aloud', 'The narrator speaks, using this device\'s voice.')}
      <h4>Touch and senses</h4>
      ${sw('haptics', 'Haptics', 'Feel a heartbeat when you touch one of them, on phones that can.')}
      ${sw('tilt', 'Tilt the water', tiltNote)}
      ${sw('mic', 'Let them hear you', micNote)}
      <h4>The world</h4>
      ${sw('realDay', 'Real-time days', 'Day and night in the drop follow your clock.')}
      ${sw('peaceful', 'Peaceful', 'No predators or viruses.')}
      <button class="btn" data-act="zoom">Reset zoom</button>
      <h4>The one you follow</h4>
      <div class="rowb"><input type="text" id="u-rename" aria-label="Name of the one you follow" maxlength="14" value="${esc(s.c.name)}" autocomplete="off" spellcheck="false"><button class="btn" data-act="rename">Rename</button></div>
      <h4>Save</h4>
      <p class="dim small">The game saves itself on this device, and the world carries on while you are away. A save code moves it to another device.</p>${save}
      <h4>Start over</h4>${wipe}
      <h4>Credits</h4>
      <p class="dim small">Typefaces: Jost and Newsreader, under the SIL Open Font License. Everything else, every life and every note of music, is made as you watch.</p>
      <p class="dim small">Build ${esc(app.build)}${app.dev ? ' · dev' : ''}</p>`);
    el.mic = el.sbody.querySelector('#u-miclvl');
  }

  function fillAway(s) {
    const r = awayReport;
    if (!r) { sec('away', ''); return; }
    const c = s.c, rows = [];
    if (r.dormant) rows.push('They ran out of food and went dormant. Drop food right against the still one to wake them.');
    else if (c.dormant) rows.push('They are still dormant, waiting for food.');
    else {
      rows.push(r.expected ? 'They were expecting you about now.' : 'The world carried on without you.');
      if (r.grew > 1) rows.push(r.ready ? (app.sim.canEvolve() ? 'It grew, and is ready for its next age.' : 'It grew as far as it can. It is waiting on you for the rest.') : 'It grew.');
      if (r.born > 0) rows.push(`${r.born === 1 ? 'One more was' : r.born + ' more were'} born. There are ${app.sim.pop()} now.`);
      if (c.energy < 0.25) rows.push('They are hungry.');
    }
    if (r.glow >= 1) rows.push(`${U.fmt(r.glow)} glow gathered itself while you were gone.`);
    if ((r.away || 0) > r.sec + 600) rows.push('After ten hours on its own a world slows right down and waits. It lost nothing by it.');
    const going = s.stage >= D.LAST && c.ready && s.launchT > 0;
    if (going) rows.push('The seed crystal is whole, and the drop is ready to let go. It waited so that you would be here for it.');
    const btns = going ? '<div class="rowb"><button class="btn" data-act="let-go">Let it go now</button><button class="btn ghost" data-act="close">Not just yet</button></div>' : '<button class="btn" data-act="close">Back to the water</button>';
    sec('away', `<p class="over">${span(r.away || r.sec)}</p><ul class="plain lead">${rows.map(t => `<li>${t}</li>`).join('')}</ul>${btns}`);
  }

  // ---------------------------------------------------------------- portraits

  function drawPortraits(selfOnly) {
    if (!sheet) return;
    const s = app.sim.s, dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const cv of el.sbody.querySelectorAll('canvas.portrait')) {
      const p = cv.dataset.p;
      if (selfOnly && p !== 'self' && cv.dataset.done) continue;
      const w = Math.max(1, Math.round(cv.clientWidth * dpr)), h = Math.max(1, Math.round(cv.clientHeight * dpr));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      try {
        if (p.indexOf('sp:') === 0) { const def = D.SPECIES.find(q => q.id === p.slice(3)); if (def && M.Wild) { M.Wild.portrait(cv, def); cv.dataset.done = '1'; } continue; }
        let spec = null;
        if (p === 'self') spec = { g: s.c.g, stage: s.stage, traits: s.c.traits };
        else if (p.indexOf('fx:') === 0) { const f = s.fixtures.find(x => x.id === +p.slice(3)); if (f && f.g) spec = { g: f.g, stage: s.stage, traits: s.c.traits }; }
        else if (p.indexOf('lin:') === 0) { const a = s.lineage[+p.slice(4)]; if (a && a.g) spec = { g: a.g, stage: a.stage, traits: a.traits || [] }; }
        if (!spec || !M.Render || !M.Render.portrait) continue;
        M.Render.portrait(cv, spec);
        cv.dataset.done = '1';
      } catch (e) { /* a portrait is a nicety */ }
    }
  }

  // ---------------------------------------------------------------- the module

  M.UI = {
    init(a) {
      app = a;
      root = document.getElementById('ui');
      if (!root) return;
      build();
      markTool();
    },
    frame, event, caption, toast, tapped,
    tool() { return tool; },
    away(report) { awayReport = report; if (report && app.sim.s.c.born) openSheet('away'); },
    reset() {
      tool = 'feed'; trayOpen = false; hint = null; seen = {}; badge = { life: false, notes: false };
      if (sheet) { sheet = null; el.sheet.classList.remove('on'); el.scrim.classList.remove('on'); el.sheet.setAttribute('aria-hidden', 'true'); }
      for (const t of titleT) clearTimeout(t);
      titleOn = false;
      endCaption();
      if (el.toasts) el.toasts.innerHTML = '';
      if (el.title) el.title.classList.remove('on');
      markTool(); drawTray();
    },
    // For tests and other modules.
    open: openSheet, close: closeSheet,
  };
})();

</script>
<script>
// Boot, the frame loop, the player's hands (touch, keys, tilt, voice), saving, and time away.
// Everything here talks to the page; the simulation itself knows nothing about it.
(function () {
  'use strict';
  const M = globalThis.MOTE, U = M.U, D = M.DATA;
  const BUILD = '20261125-021432';
  const SAVE_KEY = 'mote-save', BACKUP_KEY = 'mote-save-before-import';
  const qs = new URLSearchParams(location.search);

  const app = M.app = {
    build: BUILD, dev: qs.has('dev'),
    sim: null, nar: null, audio: null, actx: null,
    view: { w: 1, h: 1, dpr: 1, scale: 1, cx: 0, cy: 0 },   // cx, cy: world point at the screen centre
    zoom: 1, pointer: null, speed: 1, awake: false,
    sensors: { tilt: false, mic: false, tiltOk: null, micOk: null },
  };
  let canvas, last = 0, saveT = 0, hiddenAt = 0, saveWarned = false, lastInput = 0, lock = null;
  let dprCap = 2, slowT = 0, fastT = 0, frameAvg = 16;
  const toast = t => { if (M.UI && M.UI.toast) M.UI.toast(t); };

  // ---------------------------------------------------------------- saving

  const store = {
    get(k) { try { return localStorage.getItem(k || SAVE_KEY); } catch (e) { return null; } },
    set(v, k) { try { localStorage.setItem(k || SAVE_KEY, v); return true; } catch (e) { return false; } },
    del() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nothing to remove */ } },
  };
  app.save = function () {
    if (!app.sim) return false;
    app.sim.s.savedAt = Date.now();

      sim.cue('double', w.x, w.y);
      if (M.Render) M.Render.event({ type: 'signal', x: w.x, y: w.y });
      if (app.audio && running()) app.audio.event({ type: 'signal', x: w.x, y: w.y, pan: panOf(w.x) });
      return;
    }
    const res = sim.tap(w.x, w.y, tool, 22 / app.view.scale);
    lastTap = { t: now, x: sx, y: sy, res };
    if (M.Render) M.Render.event({ type: 'tap', x: w.x, y: w.y, res });
    if (M.UI && M.UI.tapped) M.UI.tapped(res, sx, sy);
  }

  // ---------------------------------------------------------------- the loop

  // Where a thing is on the screen, as left-to-right for the speakers.
  const panOf = x => U.clamp((x - app.view.cx) * app.view.scale / (app.view.w / 2), -1, 1) * 0.75;
  const ALWAYS = { weather: 1, evolveMid: 1, launch: 1 };      // changes to the music that must not be missed while muted

  function frame(now) {
    requestAnimationFrame(frame);
    const real = Math.min(0.25, Math.max(0, (now - last) / 1000));
    last = now;
    const sim = app.sim, st = sim.s.settings;
    if (st.realDay) { const d = new Date(); sim.clock = (((d.getHours() + d.getMinutes() / 60 - 6) + 24) % 24) / 24; } else sim.clock = null;
    // The world keeps real time however slowly the picture is being drawn.
    const n = Math.max(1, Math.ceil(real / 0.05)) * (app.speed > 1 ? app.speed : 1), sdt = real * (app.speed > 1 ? app.speed : 1) / n;
    for (let i = 0; i < n; i++) sim.step(sdt);
    const dt = Math.min(0.1, real);
    listen(dt);
    const evs = sim.events.splice(0);
    const snap = sim.snapshot();
    camera(dt);
    const sound = app.audio && running();
    for (const e of evs) {
      if (M.Render) M.Render.event(e);
      if (app.audio && (sound || ALWAYS[e.type])) { if (e.x !== undefined) e.pan = panOf(e.x); app.audio.event(e); }
      if (M.UI) M.UI.event(e);
      haptic(e);
      if (e.type === 'sing' || e.type === 'echo' || e.type === 'heard') mic.deafUntil = now + 1800;
      if (e.type === 'launch') dropHands();
      if (e.type === 'evolveEnd' || e.type === 'launch' || e.type === 'heir' || e.type === 'born') app.save();
    }
    const line = app.nar.feed(evs, real * (app.speed > 1 ? app.speed : 1), st.narrate);
    if (line) say(line);
    const t0 = performance.now();
    if (M.Render) M.Render.frame(dt, sim, app.view, app);
    if (sound) app.audio.frame(dt, snap);
    if (M.UI) M.UI.frame(dt, snap);
    pace(Math.max(real * 1000, performance.now() - t0), dt);
    if (lock && now - lastInput > 180000) letSleep();
    saveT += dt;
    if (saveT > 10) { saveT = 0; app.save(); }
  }

  // ---------------------------------------------------------------- dev tools (add ?dev to the address)

  app.devStage = function (n) {
    const sim = app.sim, s = sim.s, c = s.c;
    if (!c.born) { c.born = true; }
    let guard = 0;
    sim.devFree = true;
    while (s.stage < Math.min(n, D.LAST) && guard++ < 20) {
      c.growth = sim.def().need; c.bond = 1; c.energy = 1; c.health = 1; c.dormant = false;
      const o = sim.offer();
      sim.evolve(o[0]);
      for (let i = 0; i < 200; i++) sim.step(0.05);
    }
    sim.devFree = false;
    c.energy = 0.8; s.essence += 500 * (n + 1);
    sim.events.length = 0;
    app.view.cx = c.x; app.view.cy = c.y;
  };
  function devKeys(e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const sim = app.sim, s = sim.s;
    if (e.key === ']') app.devStage(s.stage + 1);
    else if (e.key === '[') s.essence += 1000;
    else if (e.key === 'f') app.speed = app.speed > 1 ? 1 : 8;
    else if (e.key === 'w') sim.startWeather();
    else if (e.key === 't') sim.spawnThreat(['virus', 'engulfer', 'stinger', 'hunter'][Math.min(3, Math.floor(Math.random() * 4))]);
    else if (e.key === 'g') { s.c.growth = sim.def().need; s.c.bond = 1; }
    else if (e.key === 'n') s.time += sim.dayLen() * 0.25;
  }

  // ---------------------------------------------------------------- boot

  function boot() {
    canvas = document.getElementById('world');
    const saved = qs.has('fresh') ? null : load();
    const seed = qs.has('seed') ? +qs.get('seed') : (Math.random() * 4294967295) >>> 0;
    app.sim = new M.Sim(saved || M.newState(seed));
    app.nar = new M.Narrator(app.sim);
    if (M.Render) M.Render.init(canvas, app);
    if (M.UI) M.UI.init(app);
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    input();
    if (app.dev && qs.has('stage')) app.devStage(+qs.get('stage'));
    if (app.dev) window.addEventListener('keydown', devKeys);
    // Sound and permissions are granted on the release of a touch, or a click or key, anywhere.
    for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, () => app.wake(true), { capture: true, passive: true });

    const away = saved && saved.savedAt ? Math.max(0, (Date.now() - saved.savedAt) / 1000) : 0;
    comeBack(away);
    app.view.cx = app.sim.s.c.x; app.view.cy = app.sim.s.c.y;

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        hiddenAt = Date.now(); app.save();
        dropHands(); hush(); letSleep();
        if (mic.stream) disableMic(true);          // not listening while put away
        if (app.actx && app.actx.state === 'running') app.actx.suspend();
      } else {
        const gone = hiddenAt ? (Date.now() - hiddenAt) / 1000 : 0;
        hiddenAt = 0; last = performance.now();
        if (app.actx && app.awake) app.actx.resume();
        if (mic.wanted && app.awake && !mic.stream) enableMic(true);
        // A glance at another app changes nothing. A proper absence, and the world has moved on.
        if (gone > 300) comeBack(gone);
      }
    });
    window.addEventListener('pagehide', () => app.save());
    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { voice = null; };

    last = performance.now();
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  void utter;
})();

</script>
