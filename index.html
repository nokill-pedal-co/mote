<style>
/* Mote: the page, a fine instrument's worth of readouts over the dark field, and the sheets. */
:root { --accent: hsl(190 34% 80%); --ink: rgba(236, 244, 248, .9); --glass: rgba(4, 9, 13, .74); --line: rgba(255, 255, 255, .14); --faint: rgba(255, 255, 255, .07); --warn: #e8c486; --low: #f29384; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #020507; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

#ui { position: fixed; inset: 0; pointer-events: none; color: var(--ink); font: 300 14px/1.35 'Jost', system-ui, sans-serif; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
#ui button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; letter-spacing: inherit; }
#ui .ctl, #ui .sheet, #ui .scrim.on { pointer-events: auto; touch-action: manipulation; }
#ui .hidden { display: none !important; }
#ui svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#ui b { font-weight: 500; }
#ui :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

/* Before anything lives: one line. */
.pre { position: absolute; left: 0; right: 0; bottom: calc(22% + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; text-transform: uppercase; letter-spacing: .32em; opacity: .85; animation: breathe 3.6s ease-in-out infinite; transition: opacity .6s; }
#ui.busy .pre, #ui.cap-on .pre { opacity: 0; animation: none; }
@keyframes breathe { 50% { opacity: .5; } }

/* ---- the readouts */
.hud { position: absolute; inset: 0; }
.hud .tl, .hud .tr, .hud .dock { transition: opacity .6s; }
.hud.morph .tl, .hud.morph .tr, .hud.morph .dock { opacity: .15; pointer-events: none; }
.hud.morph .ctl { pointer-events: none; }

.tl { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: flex-start; max-width: calc(100% - 150px); text-shadow: 0 0 8px #000, 0 0 2px #000; }
/* a soft dark behind the readouts, so the rim of the drop and whatever swims past do not run through the type */
.tl::before { content: ''; position: absolute; inset: -40px -70px -50px -40px; z-index: -1; background: radial-gradient(ellipse 70% 62% at 30% 42%, rgba(2, 5, 7, .78), rgba(2, 5, 7, .5) 55%, rgba(2, 5, 7, 0) 100%); pointer-events: none; }
#ui .ident { display: flex; flex-direction: column; align-items: flex-start; min-height: 44px; justify-content: center; text-align: left; }
.ident .where { font-size: 10px; text-transform: uppercase; letter-spacing: .18em; opacity: .72; line-height: 1.5; }
.ident .where.rare { color: var(--warn); opacity: .95; }
.ident .nm { font-size: 22px; font-weight: 300; letter-spacing: .02em; line-height: 1.15; }
.ident .sub { font-size: 11.5px; opacity: .6; letter-spacing: .05em; line-height: 1.5; }
.ident .sub.warn { color: var(--warn); opacity: 1; }
.meters { display: flex; flex-direction: column; gap: 7px; padding: 8px 10px 6px 0; cursor: pointer; }
.m { display: flex; align-items: center; gap: 8px; height: 9px; }
.m span { width: 52px; font-size: 9.5px; text-transform: uppercase; letter-spacing: .12em; opacity: .72; line-height: 1; }
.m b { display: block; width: 58px; height: 2px; background: rgba(255, 255, 255, .16); overflow: hidden; }
.m b i { display: block; height: 100%; background: var(--accent); transform-origin: left; transition: transform .4s, background .4s; }
.m.thin { height: 8px; margin-top: -1px; }
.m.thin span { opacity: .6; font-size: 8.5px; }
.m.thin b { width: 40px; height: 1px; }
.m.warn b i { background: var(--warn); }
.m.low b i { background: var(--low); }
.m.warn span { color: var(--warn); opacity: .9; }
.m.low span { color: var(--low); opacity: 1; }
.m.low { animation: breathe 1.4s ease-in-out infinite; }

/* what the age needs from you */
#ui .tasks { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-top: 8px; padding: 6px 0; min-height: 44px; text-align: left; opacity: .78; transition: opacity .5s; }
.tasks .th { font-size: 9.5px; text-transform: uppercase; letter-spacing: .16em; opacity: .8; margin-bottom: 1px; }
.tasks .t { display: flex; align-items: baseline; gap: 7px; font-size: 12px; line-height: 1.35; }
.tasks .t i { flex: none; width: 6px; height: 6px; border: 1px solid currentColor; border-radius: 50%; transform: translateY(-1px); }
.tasks .t.done { opacity: .62; }
.tasks .t.done i { background: currentColor; }
.tasks .t em { font-style: normal; opacity: .6; font-size: 11px; }
#ui .tasks.waiting { opacity: 1; }
.tasks.waiting .th { color: var(--warn); opacity: 1; }

.tr { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.tr .row { display: flex; align-items: center; gap: 6px; }
#ui .glow { pointer-events: auto; position: relative; display: flex; color: inherit; cursor: pointer; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); font-size: 14px; font-weight: 400; letter-spacing: .03em; }
#ui .glow svg.ic { width: 12px; height: 12px; color: #f3e7c4; fill: #f3e7c4; stroke-width: .6; }
.glow.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.07); } }
.glow .plus { position: absolute; right: 10px; top: 100%; font-style: normal; font-size: 12px; color: #f3e7c4; animation: rise 1.05s ease-out forwards; pointer-events: none; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(-6px); opacity: 0; } }
#ui .ib { position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--line); }
#ui .tr .row .ib { width: 32px; height: 32px; margin: 6px 0; }
#ui .tr .row .ib::before { content: ''; position: absolute; inset: -6px; }
#ui .ib.door { opacity: .8; width: 40px; height: 40px; }
#ui .ib.door::before { content: ''; position: absolute; inset: -3px; }
.ib s { display: none; position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.ib.badge s { display: block; }
#ui .chip { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; height: 40px; padding: 0 11px; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; opacity: .8; }
.chip span:empty { display: none; }
#ui .chip::before { content: ''; position: absolute; inset: -3px; }
#ui .chip.warn { color: var(--warn); border-color: rgba(232, 196, 134, .5); opacity: 1; }

.dock { position: absolute; left: calc(12px + env(safe-area-inset-left)); right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; justify-content: space-between; pointer-events: none; }
.tools { display: flex; gap: 0; padding: 3px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); }
#ui .tool { position: relative; width: 50px; height: 52px; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; opacity: .74; transition: background .2s, color .2s, opacity .2s; }
#ui .tool svg.ic { width: 21px; height: 21px; }
.tool span { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; line-height: 1; }
.tool em { position: absolute; top: 4px; right: 6px; font-style: normal; font-size: 9.5px; opacity: .9; }
#ui .tool.on { background: rgba(255, 255, 255, .09); color: var(--accent); opacity: 1; }
.tool::after { content: ''; position: absolute; inset: 0; background: rgba(2, 6, 10, .7); transform-origin: bottom; transform: scaleY(var(--cd, 0)); pointer-events: none; }
#ui .ring { position: relative; width: 58px; height: 58px; border-radius: 50%; background: var(--glass); display: flex; align-items: center; justify-content: center; }
.ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; }
.ring .trk { stroke: rgba(255, 255, 255, .16); stroke-width: 1; }
.ring .prg { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 163.4; stroke-dashoffset: 163.4; transition: stroke-dashoffset .6s; }
.ring span { display: flex; opacity: .65; }
#ui .ring span svg.ic { width: 22px; height: 22px; }
.ring.ready { color: #fff; animation: halo 1.9s ease-out infinite; }
.ring.ready span { opacity: 1; }
.ring.waiting .prg { stroke: var(--warn); }

    if (d < -Math.PI) d += U.TAU;

  };

  U.next = s => (s + 0x6D2B79F5) >>> 0;
  U.float = s => {
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

  };

  };

    n ^= n >>> 13; n = Math.imul(n, 0xC2B2AE35); n ^= n >>> 16;

  };

  };

    { id: 'trumpet',   name: 'Trumpet animalcule', fam: 'trumpet',  stage: [3, 9], w: 1.2, r: 34, hue: 205, note: 'A stentor: one single cell, shaped like a horn, and large enough to be rude about it.' },
    { id: 'glass',     name: 'Glass lattice',      fam: 'star',     stage: [3, 9], w: 0.4, r: 26, hue: 190, note: 'A radiolarian, a long way from the sea and not discussing it. It builds a cathedral of glass, lives in it alone, and tells no one.' },
    { id: 'nematode',  name: 'Threadworm',         fam: 'worm',     stage: [4, 9], w: 3, r: 40, hue: 40,  note: 'It thrashes. That is the whole of its method, and it has outlasted the dinosaurs with it.' },
    { id: 'flea',      name: 'Water flea',         fam: 'flea',     stage: [5, 9], w: 0.5, r: 46, hue: 30,  note: 'A daphnia, see-through, with its heart on show. It rows through the water as if late for something.' },
    { id: 'flash',     name: 'Night spark',        fam: 'disc',     stage: [4, 9], w: 0.3, r: 18, hue: 215, night: 1, note: 'A dinoflagellate, more usually found lighting up the sea. Disturb it and it flashes blue, which is its way of calling for help from anything larger than you.' },
    { id: 'foram',     name: 'Chambered shell',    fam: 'spiral',   stage: [4, 9], w: 0.4, r: 24, hue: 35, note: 'A foraminiferan, which belongs in the sea and has not said how it got here. It adds a room to its shell each time it outgrows the last, and never throws anything away.' },
    { id: 'gastro',    name: 'Hairyback',          fam: 'worm',     stage: [5, 9], w: 0.8, r: 26, hue: 180, note: 'A gastrotrich. It lives for three days and spends none of them wondering why.' },
    { id: 'pollen',    name: 'Pine pollen',        fam: 'star',     stage: [2, 9], w: 1.5, r: 15, hue: 52,  note: 'A grain of pollen with two little air sacs, fifty miles from its tree and entirely unbothered.' },
    { id: 'soot',      name: 'Soot fleck',         fam: 'chain',    stage: [0, 9], w: 1, r: 12, hue: 30, note: 'A fleck of soot from a chimney, a candle or a star. It did not say which.' },
    { id: 'snow',      name: 'Ice needle',         fam: 'sun',      stage: [0, 9], w: 0, r: 20, hue: 205, only: ['snowflake', 'glacier', 'icecube', 'cloud'], note: 'A needle of ice, six-sided to the last atom, and melting as you look at it.' },
    { id: 'salt',      name: 'Salt crystal',       fam: 'disc',     stage: [0, 9], w: 0, r: 13, hue: 0,   only: ['tear', 'ocean', 'drip', 'hotspring'], note: 'A perfect cube of salt, dissolving from the corners in.' },
    { id: 'glitter',   name: 'Glitter',            fam: 'boat',     stage: [0, 9], w: 0, r: 12, hue: 300, only: ['snowglobe', 'bubble', 'champagne'], note: 'A flake of glitter. It will outlast everything here, including the place.' },
    { id: 'letter',    name: 'Loose letter',       fam: 'crescent', stage: [0, 9], w: 0, r: 14, hue: 48,  only: ['book', 'ink', 'narrator'], note: 'A letter that has come adrift from its word. It may have been important.' },
  ];

  // Ordinary places a drop of rain comes down. out: the colour of the world beyond the drop.

  // The fifty strange places. One in twenty landings is one of these.
  // m: how the place bends the rules. m.ev: something that happens there now and then
  // (wave, shadow, quake, glitter, poison, feast, beam, sparks, freeze), every m.gap seconds.
  // line: what the narrator says on arrival. evLine: the first time the place does its thing.
  D.SCENARIOS = [
    { id: 'dognose', name: 'the nose of a sleeping dog', hue: 20, star: 30, family: 1, out: [22, 30, 14],
      m: { temp: 0.25, bond: 1.5, ev: 'wave', gap: [140, 220], fx: 'warm' },
      line: 'The drop has landed on the nose of a sleeping dog. It is warm, it rises and falls, and at any moment it may be licked off, which the dog will not remember and this world will never forget.',
      evLine: 'That was a tongue. From in here it resembles the end of the world, and it will be back.' },
    { id: 'dogbowl', prep: 'in', name: 'a dog\'s water bowl', hue: 200, star: 45, family: 0, out: [210, 14, 46],
      m: { rich: 0.5, size: 1.1, ev: 'feast', gap: [70, 120], ev2: 'wave', fx: 'warm' },
      line: 'The drop has joined a dog\'s water bowl. The water has been here since Tuesday, the bowl is steel, and a fine dust of kibble settles through it all day long.',
      evLine: 'Kibble dust, drifting down like manna. Nobody here knows what a dog is, but they are strongly in favour.' },
    { id: 'pedal', name: 'a fuzz pedal, mid-gig', hue: 285, star: 320, family: 2, out: [290, 60, 34],
      m: { glow: 1.5, learn: 1.3, ev: 'quake', gap: [9, 22], fx: 'fuzz' },
      line: 'The drop has landed on a fuzz pedal at an outdoor gig, a few inches from a boot. Every so often the whole world is stamped on, and the sky goes from loud to considerably louder.',
      evLine: 'The boot again. The inhabitants have decided it is a god, and that it is angry about something in the second verse.' },
    { id: 'string', name: 'a guitar string', hue: 40, star: 48, family: 1, out: [38, 40, 30],
      m: { learn: 1.6, visc: 0.9, ev: 'quake', gap: [14, 30], fx: 'drone' },
      line: 'The drop is clinging to a guitar string. When it is played, the whole world hums one note and everything in it has to agree.',
      evLine: 'An open E, by the feel of it. Life here will grow up believing the universe is in standard tuning.' },
    { id: 'tea', prep: 'in', name: 'a cup of tea, going cold', hue: 28, star: 30, family: 1, out: [30, 20, 60],
      m: { temp: 0.35, sweet: 1, burn: 1.15, ev: 'feast', gap: [90, 150], ev2: 'shadow', fx: 'warm' },
      line: 'The drop has fallen into a cup of tea that somebody made and keeps forgetting. It is warm, sweet and enormous, and nothing in it has any idea how lucky it is.',
      evLine: 'Biscuit. A whole civilisation could live on one crumb of it, and several are about to try.' },
    { id: 'champagne', prep: 'in', name: 'a glass of champagne', hue: 50, star: 52, family: 2, out: [48, 50, 60],
      m: { fizz: 1, sweet: 1, tipsy: 1, air: 0.2, glow: 1.3, ev: 'glitter', gap: [50, 90], fx: 'fizz' },
      line: 'The drop has landed in a glass of champagne. There are bubbles going up, music going on somewhere, and every living thing in here is about to discover that it cannot swim in a straight line.',
      evLine: 'A toast. The water has filled with light and the population has entirely lost the thread.' },
    { id: 'ink', prep: 'in', name: 'an inkwell', hue: 245, star: 250, family: 2, out: [240, 30, 8],
      m: { dark: 1, cap: 0.55, glow: 2, letters: 1, fx: 'dark' },
      line: 'The drop has fallen into an inkwell. It is the darkest water there is, and everything that lives here will have to make its own light or do without. The letters drifting about in it have not been written yet.',
      evLine: '' },
    { id: 'book', name: 'the page of an open book', hue: 44, star: 46, family: 1, out: [44, 30, 70],
      m: { letters: 1, learn: 1.8, timer: 2400, ev: 'shadow', gap: [80, 150], fx: 'paper' },
      line: 'The drop has landed on the page of an open book, and is slowly soaking in. The letters are coming loose and drifting about, and the inhabitants are eating them. It is the only way anyone here has ever got through this particular novel.',
      evLine: 'The reader has leaned in. They are wondering what that damp patch is. It is, briefly, the most advanced culture in the room.' },
    { id: 'tear', prep: 'in', name: 'a tear', hue: 200, star: 210, family: 4, out: [20, 30, 50],
      m: { salt: 1, temp: 0.2, bond: 2, size: 0.85, fx: 'soft' },
      line: 'The drop was not rain this time. It is a tear, warm and a little salt, and nobody has wiped it away yet. Be kind to them in here. Somebody out there could use it.',
      evLine: '' },
    { id: 'pan', name: 'a hot frying pan', hue: 15, star: 20, family: 1, out: [10, 60, 12],
      m: { temp: 0.6, grow: 3, burn: 1.8, timer: 600, drift: [0.25, 0], swirl: 0.6, fx: 'hiss' },
      line: 'The drop has landed in a hot frying pan and is skating about on a cushion of its own steam. Life in here will be fast, bright and about ten minutes long. Do try to keep up.',
      evLine: '' },
    { id: 'snowflake', prep: 'in', name: 'a snowflake that has not decided to melt', hue: 205, star: 210, family: 4, out: [210, 30, 80],
      m: { temp: -0.5, frost: 1, visc: 1.4, grow: 0.75, glow: 1.6, ev: 'freeze', gap: [120, 200], fx: 'ice' },
      line: 'It did not fall as rain. The line has come down inside a snowflake, which is very beautiful, very cold, and has not yet made up its mind about being water.',
      evLine: 'Colder still. Everything in here is now doing its thinking one molecule at a time.' },
    { id: 'windscreen', name: 'a windscreen at seventy miles an hour', hue: 210, star: 40, family: 0, out: [215, 20, 40],
      m: { drift: [0.3, -0.25], visc: 0.85, ev: 'wave', gap: [25, 45], fx: 'wind' },
      line: 'The drop has hit a windscreen at seventy miles an hour and is creeping up the glass against all intuition. There is a wind, there is a view, and every half minute there is a wiper.',
      evLine: 'The wiper. Everyone is regrouping, and one of them has started keeping count.' },
    { id: 'web', name: 'a spider\'s web at dawn', hue: 48, star: 44, family: 0, out: [44, 40, 60],
      m: { bright: 1, calm: 1, glow: 1.4, ev: 'quake', gap: [40, 80], ev2: 'shadow', fx: 'glass' },
      line: 'The drop is strung on a spider\'s web at dawn, one bead on a necklace of hundreds, each with the sun in it. Nothing hunts in here. The thing that owns the web is not interested in anything this small.',
      evLine: 'The web shivers. Something with eight legs has gone to see about breakfast. Breakfast, for once, is not us.' },
    { id: 'telescope', name: 'the lens of a telescope', hue: 235, star: 220, family: 2, out: [235, 40, 6],
      m: { dark: 1, stars: 1, glow: 1.5, nightGrow: 1.4, fx: 'dark' },
      line: 'The drop has condensed on the lens of a telescope, which was pointed at the sky and has been left out. It is always night here, and the stars are extremely close.',
      evLine: '' },
    { id: 'aquarium', prep: 'in', name: 'a tropical aquarium', hue: 185, star: 50, family: 3, out: [190, 60, 40],
      m: { temp: 0.2, rich: 0.55, hazard: 1.4, meat: 1, size: 1.15, ev: 'shadow', gap: [40, 80], fx: 'bubbles' },
      line: 'The drop has fallen into a tropical aquarium. It is warm, well lit and generously catered, and it is patrolled by animals four thousand times the size of anything in this story.',
      evLine: 'A fish went by. It did not notice us. The feeling was not mutual.' },
    { id: 'petri', prep: 'in', name: 'a petri dish', hue: 55, star: 200, family: 4, out: [200, 10, 70],
      m: { calm: 1, mutate: 3, rich: 0.6, ev: 'poison', gap: [100, 170], ev2: 'shadow', fx: 'lab' },
      line: 'The drop has been pipetted into a petri dish in a laboratory. Somebody is taking notes about this world. That makes two of us, and I would back my notes against theirs.',
      evLine: 'They have added something, to see what happens. What happens is that the water goes foul. This will be written up as a result.' },
    { id: 'pool', prep: 'in', name: 'a swimming pool', hue: 195, star: 48, family: 0, out: [195, 70, 55],
      m: { calm: 1, cap: 0.8, size: 1.2, rich: 0.15, ev: 'wave', gap: [50, 90], fx: 'echo' },
      line: 'The drop has joined a swimming pool. The water is chlorinated to the point of rudeness, so nothing hunts here, and nothing grows very well either. Now and again somebody does a length.',
      evLine: 'A swimmer, passing overhead like weather with elbows.' },
    { id: 'snowglobe', prep: 'in', name: 'a snow globe', hue: 200, star: 300, family: 2, out: [0, 50, 30],
      m: { calm: 1, noWeather: 1, glow: 1.3, ev: 'glitter', gap: [45, 80], shakeGlitter: 1, fx: 'chime' },
      line: 'The drop is inside a snow globe, which is a small sealed world kept on a shelf by a much larger one. There is no rain here and nothing hunts. Tilt it, and it snows glitter.',
      evLine: 'Somebody has picked us up and shaken us. Considering the alternatives, it is a surprisingly gentle sort of god.' },
    { id: 'birdbath', prep: 'in', name: 'a birdbath', hue: 175, star: 60, family: 3, out: [120, 35, 40],
      m: { rich: 0.45, ev: 'wave', gap: [60, 110], ev2: 'feast', fx: 'bird' },
      line: 'The drop has landed in a birdbath. It is shallow, green at the edges, and visited by blackbirds who treat it as both a bath and a drink, in that order.',
      evLine: 'A blackbird, washing. Everything went sideways for a while, and now there is a feather.' },
    { id: 'ocean', prep: 'in', name: 'the sea', hue: 205, star: 200, family: 3, out: [210, 60, 22],
      m: { salt: 1, rich: 0.5, hazard: 1.6, meat: 1, size: 1.3, drift: [0.08, 0], fx: 'deep' },
      line: 'The drop has fallen into the sea, and is no longer a drop in any sense that matters. This is where life came from. It was not safe then either.',
      evLine: '' },
    { id: 'kettle', prep: 'in', name: 'a kettle', hue: 25, star: 30, family: 1, out: [20, 10, 40],
      m: { temp: 0.3, grow: 2.2, timer: 900, heat: 1, fx: 'hiss' },
      line: 'The drop has fallen into a kettle, and somebody has just switched it on. It is getting warmer. Everything in here will live quickly, and then it will be steam, which is at least the right direction.',
      evLine: '' },
    { id: 'beer', prep: 'in', name: 'the head of a pint', hue: 42, star: 44, family: 1, out: [38, 60, 40],
      m: { fizz: 1, sweet: 1, tipsy: 1, rich: 0.5, air: 0.15, timer: 1800, ev: 'feast', gap: [80, 130], fx: 'fizz' },
      line: 'The drop has landed in the head of a pint of beer. It is all bubbles and sugar, the walls keep bursting, and the glass is getting emptier. Nobody in here will remember any of this, but they will all agree it was a good night.',
      evLine: 'Somebody dropped a crisp in. It is the best thing that has ever happened in here, and nobody will remember it.' },
    { id: 'paintjar', prep: 'in', name: 'a jar of paint water', hue: 300, star: 60, family: 2, out: [280, 30, 40],
      m: { hueCycle: 1, mutate: 4, cap: 0.75, glow: 1.2, fx: 'wash' },
      line: 'The drop has fallen into a jar where somebody has been rinsing their brushes. The water changes colour by the hour, and everything living in it is changing colour to keep up.',
      evLine: '' },
    { id: 'magnifier', prep: 'at', name: 'the focus of a magnifying glass', hue: 48, star: 50, family: 0, out: [46, 60, 60],
      m: { bright: 1, temp: 0.2, ev: 'beam', gap: [25, 45], glow: 1.3, fx: 'glass' },
      line: 'The drop is sitting under a magnifying glass on a sunny windowsill. It is very bright, rather warm, and there is a small fierce sun wandering about the place that has nothing to do with the real one.',
      evLine: 'The bright spot has moved again. Somewhere above us a child is conducting an experiment, and we are the experiment.' },
    { id: 'mirror', name: 'a bathroom mirror', hue: 190, star: 200, family: 4, out: [200, 8, 70],
      m: { temp: 0.15, bond: 1.3, ev: 'shadow', gap: [90, 160], fx: 'echo' },
      line: 'The drop has condensed on a bathroom mirror after somebody\'s shower. It is warm and quiet, and twice a day the largest face any of them will ever see comes right up to the glass to look at something else.',
      evLine: 'A face, very large, cleaning its teeth. It looked right at us and saw only itself.' },
    { id: 'waterclock', prep: 'in', name: 'a water clock', hue: 215, star: 40, family: 4, out: [35, 40, 30],
      m: { day: 0.4, grow: 1.5, drift: [0, 0.1], fx: 'tick' },
      line: 'The drop is one of many inside a water clock, and it is the clock\'s whole job to let it fall. Days go by more than twice as fast in here, because in here is where they are made.',
      evLine: '' },
    { id: 'phone', name: 'this very screen', hue: 220, star: 200, family: 2, out: [220, 20, 8],
      m: { tiltBoost: 2.2, stirBoost: 2.5, glow: 1.2, ev: 'wave', gap: [100, 180], fx: 'buzz' },
      line: 'The drop has landed on a screen. This one, in fact. Please do not wipe it off, and if you tilt it, do bear in mind that for everyone in here you are now the weather.',
      evLine: 'That was a thumb. Probably yours. They have added it to the list of things they do not understand, which is in no particular order and currently has everything on it.' },
    { id: 'narrator', prep: 'in', name: 'a glass of water on the narrator\'s desk', hue: 195, star: 48, family: 0, out: [30, 30, 30],
      m: { calm: 1, bond: 1.5, chatty: 1, ev: 'shadow', gap: [60, 100], fx: 'room' },
      line: 'This is awkward. The drop has landed in a glass of water on my desk. I can see them from here, and I should like it understood that I have not been drinking from it. Not recently.',
      evLine: 'That was me, leaning in for a closer look. I apologise. I have been telling this story for some time and wanted to see how they were getting on.' },
    { id: 'font', prep: 'in', name: 'a church font', hue: 210, star: 46, family: 0, out: [35, 25, 30],
      m: { calm: 1, bond: 1.4, glow: 1.2, visc: 1.05, ev: 'shadow', gap: [150, 260], fx: 'choir' },
      line: 'The drop has fallen into the font of a small stone church. It is still, cool and extremely quiet, and nothing in here has ever been in a hurry. Nothing hunts. It would not seem right.',
      evLine: 'A hand, dipped in and lifted out. Whatever that was about, it seemed to be meant kindly.' },
    { id: 'petrol', prep: 'in', name: 'a puddle with a rainbow on it', hue: 280, star: 300, family: 2, out: [0, 0, 12],
      m: { iridescent: 1, visc: 1.4, air: -0.2, grow: 0.8, glow: 2, ev: 'wave', gap: [50, 90], fx: 'wash' },
      line: 'The drop has landed in a puddle on a garage forecourt, under a slick of petrol that has spread into a rainbow. It is the most beautiful place this line has ever been, and you would not want to breathe it.',
      evLine: 'A tyre. The whole world left the ground briefly and came back in a slightly different order.' },
    { id: 'tuba', prep: 'in', name: 'the bell of a tuba', hue: 44, star: 46, family: 1, out: [44, 70, 40],
      m: { ev: 'quake', gap: [18, 40], learn: 1.4, temp: 0.1, fx: 'low' },
      line: 'The drop has settled in the bell of a tuba during the quiet bit. The quiet bit will not last. When it ends, everything in here is going to find out what a B flat is from the inside.',
      evLine: 'There it is. Fifty-eight hertz, near enough. Several of them have changed shape.' },
    { id: 'bubble', name: 'a soap bubble', hue: 300, star: 180, family: 2, out: [200, 30, 50],
      m: { iridescent: 1, soap: 1, size: 0.8, visc: 0.7, timer: 720, drift: [0.05, -0.05], glow: 1.6, fx: 'glass' },
      line: 'The drop is the skin of a soap bubble, drifting across a garden. It is the thinnest world there has ever been, it is every colour at once, and it has about twelve minutes.',
      evLine: '' },
    { id: 'icecube', prep: 'in', name: 'an ice cube in a drink', hue: 200, star: 40, family: 4, out: [30, 50, 40],
      m: { temp: -0.3, frost: 1, sweet: 1, melt: 1, size: 0.75, fx: 'ice' },
      line: 'The drop is frozen into an ice cube, in a drink, on a warm evening. The good news is that the world is getting bigger by the minute. The bad news is why.',
      evLine: '' },
    { id: 'hotspring', prep: 'in', name: 'a hot spring', hue: 170, star: 30, family: 3, out: [30, 50, 30],
      m: { temp: 0.35, minerals: 1, air: -0.15, vents: 2, rich: 0.4, fx: 'deep' },
      line: 'The drop has fallen into a hot spring: warm, mineral, and smelling strongly of eggs, if there were anyone in here with a nose. Some say life started somewhere very like this. If so, it is practically a homecoming.',
      evLine: '' },
    { id: 'stalactite', name: 'the tip of a stalactite', hue: 35, star: 40, family: 1, out: [30, 20, 8],
      m: { dark: 1, minerals: 1, glow: 1.5, ev: 'wave', gap: [150, 240], fx: 'cave' },
      line: 'The drop is hanging from the tip of a stalactite in a cave nobody has been in. It is completely dark. Once every few minutes it falls forty feet, and another one just like it takes its place, and everybody carries on as if nothing had happened.',
      evLine: 'It fell. It always falls. They have decided to regard it as a commute.' },
    { id: 'whisker', name: 'a cat\'s whisker', hue: 35, star: 40, family: 1, out: [30, 30, 20],
      m: { hazard: 1.3, ev: 'quake', gap: [20, 50], ev2: 'shadow', fx: 'warm' },
      line: 'The drop is balanced on a cat\'s whisker. The cat knows. The cat has decided to allow it, for now, in the manner of someone keeping the matter under review.',
      evLine: 'A twitch. The cat has thought of something, probably a great deal larger than us.' },
    { id: 'rainbow', name: 'the inside of a rainbow', hue: 180, star: 50, family: 2, out: [200, 60, 60],
      m: { bright: 1, hueCycle: 1, iridescent: 1, glow: 2, joy: 1, fx: 'glass' },
      line: 'The drop is still falling, and at this precise moment the sun has caught it, and from one particular hillside it is part of a rainbow. It will never know. But everything in here is having an unusually good day.',
      evLine: '' },
    { id: 'moon', prep: 'in', name: 'a puddle on the Moon', hue: 230, star: 220, family: 4, out: [0, 0, 40],
      m: { dark: 1, stars: 1, calm: 1, visc: 0.6, rich: 0.1, day: 2, glow: 1.5, fx: 'void' },
      line: 'The drop has landed in a puddle on the Moon. This is impossible, and has therefore attracted very little competition. Nothing hunts here. Nothing does anything here. The view, however, is tremendous.',
      evLine: '' },
    { id: 'storm', prep: 'in', name: 'a storm drain', hue: 195, star: 200, family: 3, out: [200, 10, 14],
      m: { drift: [0.35, 0.05], hazard: 1.3, rich: 0.55, ev: 'feast', gap: [30, 60], fx: 'rush' },
      line: 'The drop has gone down a storm drain and is travelling at speed in bad company. Everything that was ever dropped in a street is going past: some of it edible, some of it hungry.',
      evLine: 'Something went by that used to be a sandwich. It is being very well received.' },
    { id: 'greenhouse', name: 'a greenhouse pane', hue: 135, star: 60, family: 3, out: [120, 60, 36],
      m: { temp: 0.2, bright: 1, rich: 0.55, algaeBoost: 2, weather: ['bloom', 'rain'], fx: 'warm' },
      line: 'The drop has formed on the inside of a greenhouse. It is warm, bright and smells of tomatoes. Algae grows here the way rumours do.',
      evLine: '' },

// Heritable genes. A genome grows the body, sets the temperament and carries a melody.
// It is plain data, so it saves as JSON and passes from parent to young.
(function () {
  'use strict';
  const M = globalThis.MOTE = globalThis.MOTE || {};
  const U = M.U, D = M.DATA;
  const G = M.Genome = {};
  const clamp01 = U.clamp01;

  // Sum of three uniforms: bell-shaped, mean 0, range -1..1.
  const bell = rand => (rand() + rand() + rand()) / 1.5 - 1;
  const wrap01 = v => ((v % 1) + 1) % 1;

  G.random = function (rand) {
    const v = {};
    for (const id of D.GENE_IDS) v[id] = clamp01(0.5 + bell(rand) * 0.42);
    v.hue = rand();
    const song = [], rhythm = [];
    // A short melody as scale degrees: a wandering line that tends to return home.
    let deg = 0;
    for (let i = 0; i < 8; i++) {
      song.push(deg);
      const step = Math.round(bell(rand) * 3);
      deg = U.clamp(deg + (step || (rand() < 0.5 ? 1 : -1)), -3, 7);
      if (i === 6) deg = rand() < 0.6 ? 0 : 4;
      rhythm.push(rand() < 0.22 ? 0 : rand() < 0.3 ? 2 : 1);   // 0 rest, 1 short, 2 long
    }
    rhythm[0] = 2;
    return { v, song, rhythm };
  };

  G.clone = g => ({ v: Object.assign({}, g.v), song: g.song.slice(), rhythm: g.rhythm.slice() });

  // A copy with small changes; now and then one gene jumps.
  G.mutate = function (g, rand, amount) {
    const out = G.clone(g), amt = amount === undefined ? 0.07 : amount;
    for (const id of D.GENE_IDS) {
      let d = bell(rand) * amt;
      if (rand() < 0.07) d += bell(rand) * amt * 4;
      out.v[id] = id === 'hue' ? wrap01(out.v[id] + d * 0.6) : clamp01(out.v[id] + d);
    }
    for (let i = 0; i < out.song.length; i++) {
      if (rand() < amt * 2.2) out.song[i] = U.clamp(out.song[i] + (rand() < 0.5 ? 1 : -1) * (rand() < 0.25 ? 2 : 1), -3, 7);
      if (rand() < amt * 1.5) out.rhythm[i] = Math.floor(rand() * 3);
    }
    out.rhythm[0] = out.rhythm[0] || 1;
    return out;
  };

  // Young of two parents: each gene from one or the other, or between them.
  G.cross = function (a, b, rand, amount) {
    const out = G.clone(a);
    for (const id of D.GENE_IDS) {
      const r = rand();
      if (id === 'hue') {
        let d = b.v.hue - a.v.hue; if (d > 0.5) d -= 1; if (d < -0.5) d += 1;
        out.v.hue = wrap01(a.v.hue + d * (r < 0.35 ? 0 : r < 0.7 ? 1 : 0.5));
      } else out.v[id] = r < 0.35 ? a.v[id] : r < 0.7 ? b.v[id] : (a.v[id] + b.v[id]) / 2;
    }
    const cut = 2 + Math.floor(rand() * 5);
    for (let i = cut; i < out.song.length; i++) { out.song[i] = b.song[i]; out.rhythm[i] = b.rhythm[i]; }
    return G.mutate(out, rand, amount === undefined ? 0.05 : amount);
  };

  // Pull one gene a little toward a target (hue goes the short way round).
  G.nudge = function (g, id, target, rate) {
    if (id === 'hue') {
      let d = target - g.v.hue; if (d > 0.5) d -= 1; if (d < -0.5) d += 1;
      g.v.hue = wrap01(g.v.hue + d * rate);
    } else g.v[id] += (target - g.v[id]) * rate;
  };

  G.distance = function (a, b) {
    let s = 0;
    for (const id of D.GENE_IDS) {
      let d = Math.abs(a.v[id] - b.v[id]);
      if (id === 'hue') d = Math.min(d, 1 - d) * 2;
      s += d * d;
    }
    return Math.sqrt(s / D.GENE_IDS.length);
  };

  // What the genes mean for how it lives.
  G.express = function (g) {
    const v = g.v;
    return {
      speed: 0.85 + 0.3 * v.metab + 0.08 * v.long,
      burn: 0.86 + 0.3 * v.metab,
      size: 0.88 + 0.26 * v.size,
      sense: 0.9 + 0.25 * v.eye,
      bold: v.nerve,
      learn: 0.55 + 0.9 * v.wit,
      play: v.play,
      social: v.social,
      heart: 44 + 46 * v.metab - 8 * v.size,     // resting beats per minute
    };
  };

  G.hueDeg = g => Math.round(g.v.hue * 360);

  // A few words for the most pronounced genes.
  G.describe = function (g, n) {
    const scored = [];
    for (const def of D.GENES) {
      if (def.circular || !def.lo) continue;
      const x = g.v[def.id] - 0.5;
      if (Math.abs(x) > 0.18) scored.push([Math.abs(x), x > 0 ? def.hi : def.lo]);
    }
    scored.sort((a, b) => b[0] - a[0]);
    return scored.slice(0, n || 3).map(s => s[1]);
  };
  G.colourWord = function (g) {
    const h = g.v.hue * 360;
    const names = [[15, 'red'], [40, 'amber'], [70, 'gold'], [150, 'green'], [185, 'sea-green'], [215, 'cyan'], [250, 'blue'], [285, 'violet'], [330, 'rose'], [361, 'red']];
    for (const n of names) if (h < n[0]) return n[1];
    return 'red';
  };
})();

<script>
// Chooses what the narrator says, and when. It watches the simulation's events, keeps quiet
// between remarks, never says the same thing twice in a row, and muses when nothing is going on.
// Pure logic: the page shows the line and may read it aloud.
(function () {
  'use strict';
  const M = globalThis.MOTE = globalThis.MOTE || {};
  const W = M.WORDS, D = M.DATA;

  // Events that are worth a remark, how often at most (seconds), and how likely each time.
  const REACT = {
    threat: { gap: 150, p: 0.7, sub: e => e.kind },
    pop: { gap: 200, p: 0.5, sub: e => (e.kind === 'virus' || e.auto ? null : 'big') },
    hurt: { gap: 240, p: 0.6 },
    harass: { gap: 120, p: 1 },
    wake: { gap: 200, p: 1, sub: e => (e.byYou && !e.rested ? 'grumpy' : null), needSub: true },
    weather: { gap: 30, p: 1, sub: e => (e.on ? e.kind : null), needSub: true },
    dusk: { gap: 500, p: 0.6 }, dawn: { gap: 500, p: 0.6 },
    evolveReady: { gap: 60, p: 1 }, evolveStart: { gap: 5, p: 1 },
    learn: { gap: 400, p: 0.6 },
    trick: { gap: 500, p: 0.5, sub: e => (e.cue === 'none' ? 'none' : null), needSub: true },
    gift: { gap: 600, p: 0.5 },
    divide: { gap: 260, p: 0.5 },
    visitor: { gap: 500, p: 0.7 }, noticed: { gap: 240, p: 0.6 },
    place: { gap: 5, p: 1, sub: e => (e.self ? null : e.kind), needSub: true, once: true },
    gust: { gap: 300, p: 1 }, slosh: { gap: 400, p: 1 }, beam: { gap: 900, p: 0.5 }, breed: { gap: 900, p: 0.4 },
  };

  class Narrator {
    constructor(sim) {
      this.sim = sim;
      this.queue = [];
      this.quiet = 3;        // seconds until the next line may start
      this.idle = 45;        // seconds until an aside, if nothing else is said
      this.t = 0;
      this.lastAt = {};      // event key -> time last remarked on
      this.turn = {};        // pool key -> next variant to use
      this.saidOnce = {};
      this.usedAsides = [];
    }

    fill(text) {
      const s = this.sim.s;
      return text.replace(/\{name\}/g, s.c.name).replace(/\{place\}/g, s.world.name).replace(/\{where\}/g, (s.world.prep || 'on') + ' ' + s.world.name);
    }
    // Rotate through a pool so nothing repeats until the rest have had a turn.
    pick(key, pool) {
      const i = (this.turn[key] === undefined ? Math.floor(Math.random() * pool.length) : this.turn[key]) % pool.length;
      this.turn[key] = i + 1;
      return pool[i];
    }
    push(text, pri) {
      if (!text) return;
      // A full queue keeps only what matters most.
      if (this.queue.length >= 3) {
        let low = 0;
        for (let i = 1; i < this.queue.length; i++) if (this.queue[i].pri < this.queue[low].pri) low = i;
        if (this.queue[low].pri >= pri) return;
        this.queue.splice(low, 1);
      }
      this.queue.push({ text: this.fill(text), pri });
    }

    // mode: 'full', 'quiet' (milestones only) or 'off'.
    // Returns { text, pri } when a new line should be shown now, else null.
    feed(events, dt, mode) {
      this.t += dt;
      if (mode === 'off') { this.queue.length = 0; return null; }
      const s = this.sim.s;
      for (const e of events) {
        if (e.type === 'journal') { if (e.key !== 'became') this.push(e.text, e.key === 'launch' || e.key === 'washed' ? 5 : 3); continue; }
        if (e.type === 'evolveEnd') { const tell = W.stage[e.stage]; if (tell && tell.length) this.push(this.pick('stage' + e.stage, tell), 4); continue; }
        if (e.type === 'launch') { this.queue = this.queue.filter(q => q.pri >= 5); this.quiet = Math.max(this.quiet, 5); continue; }
        // The first time a strange place does its thing with anyone there to be told about it:
        // not to a lone bubble ten seconds old, and only for the thing its line describes.
        if (e.type === 'worldEvent') {
          const pl = D.PLACE[e.place], key = 'w' + s.world.n + 'ev';
          if (pl && pl.evLine && !this.saidOnce[key] && e.kind === pl.m.ev && s.stage >= 1 && this.sim.pop() >= 2) { this.saidOnce[key] = 1; this.push(pl.evLine, 3); }
          continue;
        }
        if (e.type === 'evolveReady' && e.last) continue;      // the crystal has its own line
        if (mode !== 'full') continue;
        const r = REACT[e.type];
        if (!r) continue;
        const sub = r.sub ? r.sub(e) : null;
        if (r.needSub && !sub) continue;
        const key = sub ? e.type + '.' + sub : e.type, pool = W.react[key] || (r.needSub ? null : W.react[e.type]);
        if (!pool) continue;
        if (r.once && this.saidOnce[key]) continue;
        const last = this.lastAt[key];
        if (last !== undefined && this.t - last < r.gap) continue;
        if (Math.random() > r.p) continue;
        this.lastAt[key] = this.t; this.saidOnce[key] = 1;
        this.push(this.pick(key, pool), e.type === 'evolveStart' || e.type === 'evolveReady' ? 2 : 1);
      }
      // things that are true rather than things that happen
      const wk = 'w' + s.world.n, wm = s.world.m || {};
      if (s.c.born && s.launchT > 0 && s.stage >= D.LAST && s.c.ready && !this.saidOnce[wk + 'brim']) { this.saidOnce[wk + 'brim'] = 1; this.push(W.react.brim[0], 2); }
      if (s.c.born && wm.timer && wm.timer - s.world.t < 150 && !this.saidOnce[wk + 'low']) { this.saidOnce[wk + 'low'] = 1; this.push(W.react.timeLow[0], 3); }

      if (this.quiet > 0) this.quiet -= dt;
      if (this.queue.length && this.quiet <= 0) {
        let hi = 0;
        for (let i = 1; i < this.queue.length; i++) if (this.queue[i].pri > this.queue[hi].pri) hi = i;
        const line = this.queue.splice(hi, 1)[0];
        this.quiet = Narrator.duration(line.text) + 1.6;
        this.idle = 55 + Math.random() * 40;
        return line;
      }

      // Nothing to say and nothing happening: an aside.
      if (mode === 'full' && s.c.born && !s.c.morph && this.quiet <= 0) {
        this.idle -= dt * (wm.chatty ? 2 : 1);
        if (this.idle <= 0) {
          this.idle = (this.lap ? 170 : 70) + Math.random() * (this.lap ? 150 : 60);
          const a = this.aside();
          if (a) { this.quiet = Narrator.duration(a) + 1.6; return { text: a, pri: 0 }; }
        }
      }
      return null;
    }

    aside() {
      const sim = this.sim, s = sim.s, c = s.c, env = s.env;
      const ready = c.ready && s.stage < D.LAST;
      const cond = {
        hungry: c.energy < 0.25 && !c.dormant, murky: env.clarity < 0.5, airless: s.stage >= 2 && env.O2 < 0.35, night: env.night,
        sleeping: c.sleeping, ready: ready && sim.canEvolve(), tasks: ready && !sim.canEvolve(), bonded: c.bond > 0.5 && s.stage >= 4,
        protein: s.stage >= 2 && c.protein < 0.1 && !c.dormant, teachable: s.stage >= 4 && sim.tricks().length === 0, kin: sim.pop() > 3 && s.stage >= 5,
        visitor: s.visitors.length > 0,
      };
      const fits = W.asides.filter(a => (a.min === undefined || s.stage >= a.min) && (a.max === undefined || s.stage <= a.max) && (!a.when || cond[a.when]));
      if (!fits.length) return null;
      // Remarks about what is actually going on come first; then whatever has waited longest.
      let pool = fits.filter(a => a.when && this.usedAsides.indexOf(a.text) < 0);
      if (!pool.length) pool = fits.filter(a => this.usedAsides.indexOf(a.text) < 0);
      if (!pool.length) { this.usedAsides.length = 0; pool = fits; this.lap = 1; }
      const a = pool[Math.floor(Math.random() * pool.length)];
      this.usedAsides.push(a.text);
      return this.fill(a.text);
    }

    // How long a line stays on screen, in seconds.
    static duration(text) { return Math.min(18, 2.6 + text.length * 0.055); }
  }

  M.Narrator = Narrator;
})();

</script>
<script>
// A world in a drop of rain. It starts as one bubble of chemistry and grows, mostly by itself,
// through ten ages until it outgrows the drop, which dries and rains down somewhere else.
// In here: the lives (each with a genome; the one the eye follows also has a body chemistry
// and a mind that learns), the water as a small closed ecosystem, visitors drifting through,
// and the places a drop can land, each bending the rules its own way.
// Pure logic. No DOM, no audio, no drawing; it only changes the state object and queues events.
// Deterministic for a given state (the random stream lives in the save), so Node can play it.
(function () {
  'use strict';
  const M = globalThis.MOTE = globalThis.MOTE || {};
  const U = M.U, D = M.DATA, G = M.Genome;
  const clamp = U.clamp, clamp01 = U.clamp01, TAU = U.TAU;
  const MEM = 8;   // the creature's map of the water is MEM x MEM cells

  function makeName(rand) {
    const p = a => a[Math.floor(rand() * a.length)];
    return p(D.NAME_A) + p(D.NAME_B) + p(D.NAME_C);
  }

  // Where the drop comes down. One landing in twenty is somewhere strange.
  function makeWorld(n, rand, atlas, last, force) {
    let place;
    if (force && D.PLACE[force]) place = D.PLACE[force];
    else if (n <= 1) place = D.PLACE.moss;
    else if (rand() < D.RARE_CHANCE) {
      const fresh = D.SCENARIOS.filter(q => !(atlas && atlas[q.id]));
      const pool = fresh.length ? fresh : D.SCENARIOS;
      place = pool[Math.floor(rand() * pool.length)];
    } else {
      const pool = D.LANDINGS.filter(q => q.id !== last);
      place = pool[Math.floor(rand() * pool.length)];
    }
    const m = Object.assign({}, place.m), vary = place.rare || n <= 1 ? 0 : 1;
    const num = (v, d, spread) => +(v === undefined ? d + (rand() - 0.5) * spread * vary : v).toFixed(2);
    return {
      n, id: place.id, rare: !!place.rare, name: place.name, label: place.name, prep: place.prep || 'on',
      hue: Math.round(place.hue + (rand() - 0.5) * 16 * vary), star: place.star, family: place.family, out: place.out.slice(), m,
      visc: num(m.visc, 1, 0.2), day: num(m.day, 1, 0.3), hazard: num(m.hazard, 1, 0.3), rich: num(m.rich, 0.32, 0.12),
      t: 0, evT: m.gap ? m.gap[0] * (0.5 + rand() * 0.5) : 0, evN: 0,
    };
  }

  function newCreature(name, genome) {
    const mem = []; for (let i = 0; i < MEM * MEM; i++) mem.push(0);
    return {
      born: false, birthTaps: 0, name, g: genome, x: 0, y: 0, vx: 0, vy: 0, ang: -Math.PI / 2,
      energy: 0.5, protein: 0.3, mineral: 0.3, health: 1, growth: 0, rest: 1, mood: 0.6, joy: 0.3, stress: 0, bond: 0, warmth: 1, heart: 60,
      traits: [], diet: 0, pers: { bold: 0, playful: 0, affection: 0, curious: 0 },
      press: { chase: 0, cold: 0, dark: 0, sun: 0, meat: 0, plant: 0, touch: 0, play: 0, hit: 0, fight: 0, voice: 0, idle: 0 },
      mem, q: {}, base: {}, trick: null, lastTrick: null, cueLast: null, idleTrick: 20, heard: [], voiceTarget: 0.5, day: [],
      act: 'drift', dormant: false, dormFed: 0, sleeping: false, hidden: false, held: false, morph: null, ready: false,
      age: 0, wx: 0, wy: 0, wt: 0, eatT: 0, hurtT: 0, petT: 0, lastPet: -99, taps: [], shyT: 0, shyX: 0, shyY: 0, listenT: 0, echoT: 0,
      streak: 0, streakT: 0, poop: 0, safeT: 50, playCd: 20, singCd: 30,
    };
  }

  M.newState = function (seed) {
    seed = (seed >>> 0) || 1;
    const st = D.STAGES[0], rand = U.rng(seed ^ 0x51ed);
    const visits = []; for (let i = 0; i < 24; i++) visits.push(0);
    return {
      v: D.SAVE_VERSION, seed, rs: seed, time: D.DAY * 0.1, stage: 0, gen: 1, essence: 0, nextId: 1,
      habitatR: st.habitat, viewSpan: st.view,
      world: makeWorld(1, rand), worlds: [], atlas: { moss: 1 }, atlasLast: 'moss', codex: {}, visitors: [], taskBase: {}, launchT: 0,
      c: newCreature(makeName(rand), G.random(rand)),
      foods: [], wastes: [], threats: [], motes: [], fixtures: [], beams: [], lantern: null,
      env: { temp: 0, clarity: 1, O2: 0.8, N: 0.32, weather: null, nextWeather: 150, night: false },
      timers: { threat: 70, spark: 8, ambient: 10, plankton: 6, gift: 50, builder: 45, folk: 40, tapBack: 0, beam: 0, tick: 0, tilt: 0, hum: 0, birth: 8, visitor: 25 },
      stats: { eaten: 0, pets: 0, popped: 0, days: 0, placed: 0, taps: 0, gathered: 0, dormancies: 0, played: 0, tricks: 0, heirs: 0, fed: 0, motes: 0, cleared: 0, beams: 0, calls: 0, rewards: 0, cues: 0, births: 0, found: 0, live: 0 },
      journal: [], flags: {}, lineage: [], visits, offer: null,
      settings: { peaceful: false, realDay: false, narrate: 'full', speak: false, haptics: true, tilt: false, mic: false, volume: 0.8 },
    };
  };

  // Fill anything a save from an older build is missing.
  M.hydrate = function (o) {
    const base = M.newState(o && o.seed);
    if (!o || typeof o !== 'object' || !o.c) return base;
    for (const k in base) if (o[k] === undefined || (o[k] === null && base[k] !== null)) o[k] = base[k];
    for (const k of ['c', 'env', 'timers', 'stats', 'settings', 'world']) for (const j in base[k]) if (o[k][j] === undefined) o[k][j] = base[k][j];
    for (const j in base.c.pers) if (o.c.pers[j] === undefined) o.c.pers[j] = 0;
    for (const j in base.c.press) if (!Number.isFinite(o.c.press[j])) o.c.press[j] = 0;
    if (!o.world.m || !o.world.id) o.world = base.world;
    if (!o.world.prep) o.world.prep = (D.PLACE[o.world.id] || {}).prep || 'on';
    for (const k of ['atlas', 'codex', 'taskBase']) if (!o[k] || typeof o[k] !== 'object') o[k] = base[k];
    if (!Array.isArray(o.visitors)) o.visitors = [];
    o.visitors = o.visitors.filter(v => D.SPECIES.some(sp => sp.id === v.sp));
    if (!o.c.g || !o.c.g.v) o.c.g = base.c.g;
    for (const id of D.GENE_IDS) if (!Number.isFinite(o.c.g.v[id])) o.c.g.v[id] = 0.5;
    if (!Array.isArray(o.c.mem) || o.c.mem.length !== MEM * MEM) o.c.mem = base.c.mem;
    o.stage = clamp(o.stage | 0, 0, D.LAST);
    o.c.traits = o.c.traits.filter(t => D.TRAITS[t]);
    o.fixtures = o.fixtures.filter(f => D.FIXTURES[f.type] || f.type === 'kin' || f.type === 'elder');
    for (const f of o.fixtures) if ((f.type === 'kin' || f.type === 'elder' || f.type === 'companion' || f.type === 'egg') && (!f.g || !f.g.v)) f.g = G.mutate(o.c.g, U.rng(f.id || 1), 0.1);
    o.c.trick = null;
    o.v = D.SAVE_VERSION;
    return o;
  };

  // Brightness of the sky for a phase of the day (0 = dawn).
  M.lightOfPhase = function (p) {
    let v;
    if (p >= 0.94 || p < 0.06) v = U.smooth(((p + 0.06) % 1) / 0.12);
    else if (p < 0.54) v = 1;
    else if (p < 0.66) v = 1 - U.smooth((p - 0.54) / 0.12);
    else v = 0;
    return 0.12 + 0.88 * v;
  };

  class Sim {
    constructor(state) {
      this.s = state;
      this.events = [];
      this.lure = null;       // {x, y} while a finger is held on the water
      this.grav = { x: 0, y: 0 };   // the tilt of the phone, as a pull on everything that floats
      this.cur = { x: 0, y: 0 };    // tilt plus whatever current this place has
      this.shade = 0;               // seconds of shadow left, when something vast is overhead
      this.clock = null;      // day phase from the real clock, when the player wants real days
      this.danger = 0;        // eased 0..1, how threatened the creature is right now
      this.activity = 0;      // eased 0..1, how much is going on
      this.sky = 1;
      this.refresh();
    }

    rand() { const s = this.s; s.rs = U.next(s.rs); return U.float(s.rs); }
    rr(a, b) { return a + (b - a) * this.rand(); }
    emit(type, o) { const e = o || {}; e.type = type; this.events.push(e); return e; }
    def() { return D.STAGES[this.s.stage]; }

    // Abilities from traits, genes and the worlds before.
    refresh() {
      const s = this.s, m = Object.assign({}, D.BASE_MODS);
      for (const id of s.c.traits) {
        const t = D.TRAITS[id];
        if (!t) continue;
        for (const k in t.mod) { if (D.ADDITIVE[k]) m[k] += t.mod[k]; else m[k] *= t.mod[k]; }
      }
      const wm = s.world.m || {};
      m.grow *= (1 + 0.12 * Math.min(10, s.world.n - 1)) * (wm.grow || 1);
      m.essence *= (1 + 0.15 * Math.min(10, s.world.n - 1)) * (wm.glow || 1);
      m.burn *= wm.burn || 1; m.bondRate *= wm.bond || 1; m.learn *= wm.learn || 1;
      if (wm.remember) m.remember += 1;
      this.mods = m;
      this.gx = G.express(s.c.g);
      return m;
    }

    cells() { return 5 + this.mods.cells; }
    bodyR() {
      const st = this.def();
      return (st.kind === 'colony' ? st.r * (1.55 + 0.11 * this.cells()) : st.r) * this.gx.size;
    }
    speed() { return this.def().speed * this.mods.speed * this.gx.speed / Math.sqrt(this.s.world.visc); }
    sense() { return this.def().sense * this.mods.sense * this.gx.sense; }
    canSing() { return this.s.stage >= 6 || (this.mods.sing > 0 && this.s.stage >= 5); }
    kinMax() { return this.def().pop[1]; }
    wm() { return this.s.world.m || {}; }
    pop() { let n = this.s.c.born ? 1 : 0; for (const f of this.s.fixtures) if (f.type === 'kin') n++; return n; }

    dayLen() { return D.DAY * this.s.world.day; }
    dayPhase() {
      const s = this.s;
      if (s.settings.realDay && this.clock !== null) return this.clock;
      const L = this.dayLen();
      return (s.time % L) / L;
    }
    daylight() { const wm = this.wm(); return wm.dark ? 0.14 : wm.bright ? 1 : M.lightOfPhase(this.dayPhase()); }

    lightAt(x, y) {
      const s = this.s;
      let L = this.sky;
      for (const b of s.beams) {
        const d = Math.hypot(x - b.x, y - b.y);
        if (d < b.r) L = Math.max(L, (1 - (d / b.r) * (d / b.r)) * Math.min(1, b.t / 2, (b.life - b.t) / 3));
      }
      for (const f of s.fixtures) {
        if (f.type !== 'glowcap' && f.type !== 'cairn') continue;
        const rad = f.type === 'glowcap' ? 230 : 110, d = Math.hypot(x - f.x, y - f.y);
        if (d < rad) L = Math.max(L, (f.type === 'glowcap' ? 0.8 : 0.4) * (1 - d / rad) + 0.12);
      }
      if (s.lantern) { const d = Math.hypot(x - s.lantern.x, y - s.lantern.y); if (d < 320) L = Math.max(L, (0.35 + 0.5 * this.lanternProgress()) * (1 - d / 320) + 0.12); }
      return clamp01(L);
    }

    tempAt(x, y) {
      let t = this.s.env.temp;
      for (const f of this.s.fixtures) {
        if (f.type !== 'vent') continue;
        const d = Math.hypot(x - f.x, y - f.y);
        if (d < 260) t += 0.9 * (1 - d / 260);
      }
      return t;
    }

    wellbeing() {
      const s = this.s, c = s.c;
      if (!c.born || c.dormant) return 0;
      return clamp01(0.45 * Math.min(1, c.energy / 0.6) + 0.35 * c.health + 0.2 * (s.stage >= 4 ? c.mood : s.env.clarity));
    }

    // Write a line in the journal. key picks from the narrator's lines; vars fill {blanks}.
    log(key, vars) {
      const s = this.s, W = M.WORDS, lines = W && W.lines[key];
      let text = lines ? lines[Math.floor(this.rand() * lines.length)] : key;
      const v = Object.assign({ name: s.c.name, world: s.world.name, place: s.world.name, where: s.world.prep + ' ' + s.world.name }, vars || {});
      text = text.replace(/\{(\w+)\}/g, (all, k) => (v[k] === undefined ? all : v[k]));
      const e = { t: Math.round(s.time), day: Math.floor(s.c.age / this.dayLen()) + 1, text, stage: s.stage };
      s.journal.push(e);
      if (s.journal.length > 300) s.journal.splice(0, s.journal.length - 300);
      this.emit('journal', { text, key });
      return text;
    }
    once(flag, key, vars) {
      if (this.s.flags[flag]) return false;
      this.s.flags[flag] = 1;
      this.log(key || flag, vars);
      return true;
    }
    // Something worth dreaming about later.
    note(tag) { const d = this.s.c.day; if (d[d.length - 1] !== tag) { d.push(tag); if (d.length > 10) d.shift(); } }

    // ---------------------------------------------------------------- stepping

    step(dt) {
      const s = this.s, c = s.c;
      if (!c.born) return;
      if (dt > 0.1) dt = 0.1;
      s.time += dt;
      c.age += dt;
      const wm = this.wm(), tb = wm.tiltBoost || 1;
      this.cur.x = this.grav.x * tb + (wm.drift ? wm.drift[0] : 0); this.cur.y = this.grav.y * tb + (wm.drift ? wm.drift[1] : 0);
      this.sky = this.daylight();
      if (this.shade > 0) { this.shade -= dt; this.sky = Math.min(this.sky, 0.16); }
      this.stepWorld(dt);
      if (!s.c.born) return;          // the place let go of the drop
      this.stepEnv(dt);
      this.stepEco(dt);
      if (c.morph) this.stepMorph(dt); else this.stepCreature(dt);
      this.stepFoods(dt);
      this.stepWastes(dt);
      this.stepThreats(dt);
      this.stepMotes(dt);
      this.stepFixtures(dt);
      this.stepBrood(dt);
      this.stepVisitors(dt);
    }

    // ---- the place itself: its timer, and whatever it does now and then
    stepWorld(dt) {
      const s = this.s, w = s.world, wm = w.m || {}, c = s.c;
      w.t += dt;
      if (wm.timer && w.t >= wm.timer && !c.morph) { this.launch(true); return; }
      if (!wm.ev || c.morph) return;
      w.evT -= dt;
      if (w.evT > 0) return;
      w.evT = this.rr(wm.gap[0], wm.gap[1]);
      // some places do two things, turn and turn about
      const kind = wm.ev2 && w.evN % 2 === 1 ? wm.ev2 : wm.ev;
      w.evN++;
      this.worldEvent(kind);
    }
    worldEvent(kind) {
      const s = this.s, c = s.c, R = s.habitatR, ang = this.rand() * TAU;
      const spot = () => { const a = this.rand() * TAU, d = Math.sqrt(this.rand()) * R * 0.85; return [Math.cos(a) * d, Math.sin(a) * d]; };
      let dur = 3;
      if (kind === 'wave') {
        const vx = Math.cos(ang) * 240, vy = Math.sin(ang) * 240;
        for (const list of [s.foods, s.wastes, s.motes, s.visitors]) for (const o of list) { o.vx += vx; o.vy += vy; }
        for (const t of s.threats) if (!t.att) { t.vx += vx * 0.6; t.vy += vy * 0.6; }
        for (const f of s.fixtures) if (f.type === 'toy' || f.type === 'kin' || f.type === 'companion' || f.type === 'elder') { f.vx += vx * 0.7; f.vy += vy * 0.7; }
        c.vx += vx * 0.7; c.vy += vy * 0.7; c.stress = clamp01(c.stress + 0.25);
        if (c.sleeping) this.wake(false);
        dur = 2.6;
      } else if (kind === 'shadow') { this.shade = 7; c.stress = clamp01(c.stress + 0.15); dur = 7; }
      else if (kind === 'quake') {
        const kick = o => { o.vx += (this.rand() - 0.5) * 160; o.vy += (this.rand() - 0.5) * 160; };
        for (const list of [s.foods, s.wastes, s.motes]) for (const o of list) kick(o);
        kick(c); if (s.stage >= 4) c.joy = clamp01(c.joy + 0.03 * this.gx.play);
        dur = 1.6;
      } else if (kind === 'glitter') { for (let i = 0; i < 14 && s.motes.length < 26; i++) { const p = spot(); this.addMote(p[0], p[1], 1.2); } dur = 4; }
      else if (kind === 'poison') { for (let i = 0; i < 6; i++) { const p = spot(); this.addWaste(p[0], p[1]); } dur = 5; }
      else if (kind === 'feast') { const n = this.wm().noAmbient ? 4 : 12; for (let i = 0; i < n && s.foods.length < 58; i++) { const p = spot(); this.addFood(this.rand() < 0.25 ? 'plankton' : 'nutrient', p[0], p[1]); } dur = 4; }
      else if (kind === 'beam') { const p = spot(); s.beams.push({ x: p[0], y: p[1], r: 150, t: 0, life: 20 }); dur = 3; }
      else if (kind === 'sparks') { for (let i = 0; i < 4 && s.motes.length < 26; i++) { const p = spot(); this.addMote(p[0], p[1], 1.5); } c.stress = clamp01(c.stress + 0.1); dur = 1; }
      else if (kind === 'freeze') { if (!s.env.weather) this.startWeather('chill'); dur = 4; }
      this.emit('worldEvent', { kind, dur, ang, x: c.x, y: c.y, first: s.world.evN === 1, place: s.world.id });
    }
    // What a place gives a world that is just starting in it.
    settle() {
      const s = this.s, wm = this.wm(), R = s.habitatR * 0.6;
      const drop = (type, n) => { for (let i = 0; i < n; i++) { const a = this.rand() * TAU, d = (0.4 + 0.6 * this.rand()) * R; this.addFixture(type, Math.cos(a) * d, Math.sin(a) * d, true); } };
      if (wm.vents) drop('vent', wm.vents);
      if (wm.cleaners) drop('cleaner', wm.cleaners);
      if (wm.cairns) drop('cairn', wm.cairns);
      if (wm.gift) { const pool = D.TRAIT_IDS.filter(id => D.TRAITS[id].stage <= 3); const id = pool[Math.floor(this.rand() * pool.length)]; s.c.traits.push(id); this.refresh(); }
      s.env.N = s.world.rich; s.env.O2 = clamp01(0.8 + (wm.air || 0));
    }

    stepEnv(dt) {
      const s = this.s, env = s.env, st = this.def(), T = s.timers;
      const wm = this.wm(), grown = wm.melt ? Math.min(1.7, 1 + s.world.t / 1500) : 1;
      s.habitatR += (st.habitat * (wm.size || 1) * grown - s.habitatR) * U.ease(0.6, dt);
      s.viewSpan += (st.view - s.viewSpan) * U.ease(0.6, dt);

      const L = this.sky, night = this.shade > 0 ? env.night : L < 0.4;
      if (night !== env.night) {
        env.night = night;
        this.emit(night ? 'dusk' : 'dawn');
        if (night) this.once('firstNight'); else s.stats.days++;
      }

      for (let i = s.beams.length - 1; i >= 0; i--) { s.beams[i].t += dt; if (s.beams[i].t >= s.beams[i].life) s.beams.splice(i, 1); }
      if (T.beam > 0) T.beam -= dt;
      if (T.tapBack > 0) T.tapBack -= dt;
      if (T.tilt > 0) T.tilt -= dt;
      if (T.hum > 0) T.hum -= dt;
      T.tick += dt;

      // Weather comes and goes.
      const w = env.weather;
      let tempTarget = (L - 0.6) * 0.3 + (wm.temp || 0) + (wm.heat ? 0.6 * Math.min(1, s.world.t / (wm.timer || 900)) : 0);
      if (w) {
        w.t += dt;
        w.tick = (w.tick || 0) + dt;
        const R = s.habitatR * 0.92;
        const spot = () => { const a = this.rand() * TAU, d = Math.sqrt(this.rand()) * R; return [Math.cos(a) * d, Math.sin(a) * d]; };
        if (w.type === 'rain' && w.tick >= 0.4) {
          w.tick = 0;
          const p = spot();
          this.emit('raindrop', { x: p[0], y: p[1] });
          if (s.wastes.length && this.rand() < 0.4) s.wastes.splice(Math.floor(this.rand() * s.wastes.length), 1);
          if (this.rand() < 0.2 && s.foods.length < 50) this.addFood('nutrient', p[0], p[1]);
        } else if (w.type === 'bloom' && w.tick >= 2.2) {
          w.tick = 0;
          const p = spot();
          if (s.foods.length < 50) this.addFood('algae', p[0], p[1]);
        } else if (w.type === 'starfall' && w.tick >= 0.5) {
          w.tick = 0;
          const p = spot();
          if (s.motes.length < 26) this.addMote(p[0], p[1], 1.4);
        } else if (w.type === 'chill') {
          tempTarget = -0.75;
        }
        if (w.t >= w.dur) { env.weather = null; env.nextWeather = this.rr(150, 260); this.emit('weather', { on: false, kind: w.type }); }
      } else if (!s.c.morph && !s.c.dormant && !wm.noWeather) {
        env.nextWeather -= dt;
        if (env.nextWeather <= 0) this.startWeather();
      }
      env.temp += (tempTarget - env.temp) * U.ease(0.08, dt);

      // Murk: every bit of waste clouds the water.
      const target = Math.min(wm.cap || 1, 1 - clamp01(s.wastes.length / (12 + s.stage * 2)));
      env.clarity += (target - env.clarity) * U.ease(0.25, dt);

      // A little food turns up on its own, so a quiet drop is never quite barren.
      T.ambient -= dt * (wm.sweet ? 3 : 1);
      if (T.ambient <= 0 && !wm.noAmbient) {
        T.ambient = this.rr(16, 30);
        if (s.foods.length < (wm.sweet ? 24 : 14)) { const a = this.rand() * TAU, d = Math.sqrt(this.rand()) * s.habitatR * 0.85; this.addFood(wm.minerals && this.rand() < 0.5 ? 'mineral' : 'nutrient', Math.cos(a) * d, Math.sin(a) * d); }
      }
      if (s.stage >= 2) {
        T.plankton -= dt * (0.4 + env.N) * (wm.meat ? 2 : 1);
        if (T.plankton <= 0) {
          T.plankton = this.rr(12, 20);
          if (this.countFood('plankton') < 2 + Math.floor(s.stage / 2) + (wm.meat ? 3 : 0) && env.O2 > 0.25) { const a = this.rand() * TAU; this.addFood('plankton', Math.cos(a) * s.habitatR * 0.9, Math.sin(a) * s.habitatR * 0.9); }
        }
      }
    }

    // The water breathes: light makes air and food, life uses both up, waste feeds the next round.
    stepEco(dt) {
      const s = this.s, env = s.env, w = env.weather;
      if (s.stage < 2) { env.O2 += (0.82 - env.O2) * U.ease(0.2, dt); env.N += (s.world.rich - env.N) * U.ease(0.05, dt); return; }
      const Lp = Math.max(0, this.sky - 0.2) / 0.8;
      const q = 1 + 0.5 * env.temp;
      let nAlg = 0, lit = 0;
      for (const f of s.fixtures) if (f.type === 'algae') { nAlg++; lit += Math.max(0, this.lightAt(f.x, f.y) - 0.2) / 0.8; }
      const floatAlg = this.countFood('algae'), plank = this.countFood('plankton');
      let kin = 0, bub = 0;
      for (const f of s.fixtures) { if (f.type === 'kin' || f.type === 'elder' || f.type === 'companion') kin++; else if (f.type === 'bubbler') bub++; }
      const k = 0.26;   // overall pace of the water chemistry
      let dO = 0;
      dO += (lit + floatAlg * 0.25 * Lp) * 0.0042;                             // photosynthesis
      dO -= (nAlg - lit + floatAlg * 0.25 * (1 - Lp)) * 0.0009;                // plants breathe too, in the dark
      dO -= 0.0022 * (1 + s.stage * 0.22) * (s.c.dormant ? 0.1 : 1);           // the creature
      dO -= plank * 0.0004 + kin * 0.0007 + s.wastes.length * 0.0009 * q;      // everything else, and rot
      env.O2 += dO * k * dt;
      const wm = this.wm();
      env.O2 += (0.72 + (wm.air || 0) - env.O2) * 0.012 * (w && w.type === 'rain' ? 5 : 1) * dt;   // the surface
      if (wm.fizz) env.O2 += 0.004 * dt;
      env.O2 += bub * 0.0042 * dt;
      env.O2 = clamp01(env.O2);

      env.N += s.wastes.length * 0.0006 * q * k * dt;
      env.N -= (lit + floatAlg * 0.2 * Lp) * 0.0017 * k * dt * (0.3 + env.N);
      env.N += (s.world.rich - env.N) * (w && w.type === 'rain' ? 0.02 : 0.0015) * dt;
      env.N = clamp01(env.N);

      if (env.O2 < 0.22 && !s.c.dormant) this.once('airless');
      // Water this rich blooms by itself.
      if (env.N > 0.82 && Lp > 0.5 && !w && floatAlg < 26 && this.rand() < dt * 0.02) {
        env.weather = { type: 'bloom', t: 0, dur: D.WEATHER.bloom.dur, tick: 0, wild: 1 };
        this.emit('weather', { on: true, kind: 'bloom', line: D.WEATHER.bloom.line, wild: 1 });
        this.once('wildBloom');
      }
    }

    countFood(kind) { let n = 0; for (const f of this.s.foods) if (f.kind === kind) n++; return n; }

    startWeather(force) {
      const s = this.s, opts = [];
      for (const k in D.WEATHER) {
        if (D.WEATHER[k].stage > s.stage) continue;
        if (k === 'swarm' && (s.settings.peaceful || s.c.safeT > 0 || this.wm().calm)) continue;
        if (this.wm().weather && this.wm().weather.indexOf(k) < 0) continue;
        opts.push(k);
      }
      const type = force || opts[Math.floor(this.rand() * opts.length)];
      const def = D.WEATHER[type];
      if (!def) return;
      s.env.weather = { type, t: 0, dur: def.dur, tick: 0 };
      this.emit('weather', { on: true, kind: type, line: def.line });
      if (type === 'swarm') {
        const a = this.rand() * TAU, n = 3 + Math.floor(s.stage / 2);
        for (let i = 0; i < n; i++) this.spawnThreat('virus', a + this.rr(-0.5, 0.5));
        this.once('firstThreat');
      }
    }

    stepMorph(dt) {
      const s = this.s, c = s.c, m = c.morph;
      m.t += dt;
      c.vx *= Math.exp(-3 * dt); c.vy *= Math.exp(-3 * dt);
      c.x += c.vx * dt; c.y += c.vy * dt;
      this.bound(c, this.bodyR(), dt);
      if (!m.done && m.t >= m.dur * 0.5) {
        m.done = true;
        s.stage = Math.min(s.stage + 1, D.LAST);
        if (m.trait && c.traits.indexOf(m.trait) < 0) { c.traits.push(m.trait); c.diet = clamp(c.diet + 0.3 * (D.TRAITS[m.trait].diet || 0), -1, 1); }
        c.growth = 0; c.ready = false; s.offer = null; s.taskBase = Object.assign({}, s.stats);
        c.health = 1; c.energy = Math.max(c.energy, 0.7); c.stress = 0; c.joy = Math.min(1, c.joy + 0.3);
        c.safeT = 60; c.hidden = false; c.sleeping = false; c.trick = null;
        s.threats.length = 0;
        // Each change of form reshuffles the genes a little.
        c.g = G.mutate(c.g, () => this.rand(), 0.035);
        this.refresh();
        const st = this.def();
        if (s.stage === D.LAST) this.raiseLantern();
        if (s.stage === 4) { let any = 0; for (const cue in c.q) for (const b in c.q[cue]) if (c.q[cue][b] > 0.12) any = 1; if (any) this.once('ancestral'); }
        // a new shape for everyone; where the new age holds fewer, the many gather into the few
        { const kin = s.fixtures.filter(f => f.type === 'kin'), keep = Math.max(0, st.pop[0] - 1); for (let i = keep; i < kin.length; i++) s.fixtures.splice(s.fixtures.indexOf(kin[i]), 1); }
        this.log('became', { stage: st.name });
        this.emit('evolveMid', { stage: s.stage });
      }
      if (m.t >= m.dur) { c.morph = null; this.emit('evolveEnd', { stage: s.stage }); }
    }

    stepCreature(dt) {
      const s = this.s, c = s.c, st = this.def(), m = this.mods, env = s.env, T = s.timers, gx = this.gx;
      const R = this.bodyR();

      c.eatT = Math.max(0, c.eatT - dt * 2.5);
      c.hurtT = Math.max(0, c.hurtT - dt * 1.5);
      c.petT = Math.max(0, c.petT - dt * 1.2);
      if (c.shyT > 0) c.shyT -= dt;
      if (c.safeT > 0) c.safeT -= dt;
      if (c.listenT > 0) c.listenT -= dt;
      if (c.streakT > 0) { c.streakT -= dt; if (c.streakT <= 0) c.streak = 0; }

      // ---- dormancy: sealed up, waiting for food
      if (c.dormant) {
        c.vx = (c.vx + this.cur.x * 20 * dt) * Math.exp(-2 * dt); c.vy = (c.vy + this.cur.y * 20 * dt) * Math.exp(-2 * dt);
        c.x += c.vx * dt; c.y += c.vy * dt;
        this.bound(c, R, dt);
        for (let i = s.foods.length - 1; i >= 0; i--) {
          const f = s.foods[i];
          if (Math.hypot(f.x - c.x, f.y - c.y) < R + f.r + 6) {
            s.foods.splice(i, 1); c.dormFed++; c.eatT = 1;
            this.emit('eat', { x: c.x, y: c.y, kind: f.kind, streak: c.dormFed });
          }
        }
        if (c.dormFed >= 3) {
          c.dormant = false; c.dormFed = 0; c.energy = 0.55; c.health = 0.45; c.safeT = 40;
          this.log('revive'); this.emit('revive');
        }
        c.heart += (gx.heart * 0.25 - c.heart) * U.ease(0.5, dt);
        this.danger += (0 - this.danger) * U.ease(1, dt);
        return;
      }

      // ---- body: hunger, light, warmth, air, health
      const speedNow = Math.hypot(c.vx, c.vy), speedMax = this.speed();
      const effort = clamp01(speedNow / (speedMax + 1));
      const light = this.lightAt(c.x, c.y);
      const q10 = 1 + 0.25 * env.temp;
      c.energy -= dt / st.empty * m.burn * gx.burn * q10 * (c.sleeping ? 0.4 : 0.75 + 0.5 * effort);
      if (m.photo) c.energy += dt / st.empty * 0.75 * light * m.photo;
      c.energy = clamp01(c.energy);

      if (s.stage >= 3) {
        const felt = m.warm ? 0.2 : this.tempAt(c.x, c.y);
        c.warmth = clamp01(c.warmth + (felt > -0.3 ? 0.05 : -0.022) * dt);
      } else c.warmth = 1;

      const chem = s.stage >= 2;              // protein, minerals and air only matter once it has rooms inside
      if (!chem) { c.protein = 0.5; c.mineral = 0.5; }
      const attached = this.attached();
      const foul = env.clarity < 0.3 && !m.lungs;
      const airless = chem && env.O2 < 0.2 && !m.lungs;
      if (c.energy <= 0) c.health -= 0.011 * dt;
      else if (c.energy > 0.3 && !attached && !c.held && c.health < 1 && (env.clarity >= 0.55 || m.lungs)) {
        const mend = 0.022 * (chem ? 0.3 + 0.7 * clamp01(c.mineral / 0.2) : 1) * dt;
        c.health += mend;
        if (chem) c.mineral = Math.max(0, c.mineral - mend * 0.45);
      }
      const wm = this.wm();
      if (chem) c.mineral = Math.max(0, c.mineral - dt / 1500 * (wm.salt ? 3 : 1));
      if (wm.joy) c.joy = Math.max(c.joy, 0.5);
      if (foul) c.health -= (s.stage < 2 ? 0.004 : 0.008) * dt;
      if (airless) c.health -= 0.007 * dt;
      if (c.warmth < 0.2) c.health -= 0.004 * dt;
      c.health = clamp01(c.health);
      if (c.health <= 0) {
        c.dormant = true; c.dormFed = 0; c.sleeping = false; c.hidden = false; c.trick = null; c.act = 'dormant';
        c.growth *= 0.9; c.bond = Math.max(0, c.bond - 0.03); c.ready = false;
        for (let i = s.threats.length - 1; i >= 0; i--) if (s.threats[i].att) s.threats.splice(i, 1);
        s.stats.dormancies++;
        this.log('dormant'); this.emit('dormant');
        return;
      }

      // ---- mind: rest, joy, stress, mood, bond, heartbeat
      if (s.stage >= 4) {
        if (c.sleeping) c.rest = clamp01(c.rest + dt / 55 * m.restRate * (c.hidden ? 1.4 : 1));
        else c.rest = clamp01(c.rest - dt / 330 * (0.7 + 0.6 * effort));
      } else c.rest = 1;
      c.joy = clamp01(c.joy - dt / 150);
      c.stress = clamp01(c.stress - dt / 14);
      const moodTarget = clamp01(0.28 * Math.min(1, c.energy / 0.6) + 0.2 * c.health + 0.14 * c.rest + 0.1 * c.warmth + 0.08 * env.clarity + 0.3 * c.joy - 0.45 * c.stress - (airless ? 0.2 : 0));
      c.mood += (moodTarget - c.mood) * U.ease(0.12, dt);
      c.bond = clamp01(c.bond - dt * 0.00003 / m.bondRate);
      const beat = gx.heart * (1 + 0.6 * c.stress + 0.35 * effort + 0.5 * this.danger) * (c.sleeping ? 0.62 : 1) * (0.9 + 0.2 * q10);
      c.heart += (beat - c.heart) * U.ease(0.6, dt);

      // ---- growth: it grows while it thrives, and growing takes protein
      let thrive = clamp01((c.energy - 0.3) / 0.4) * clamp01(c.health / 0.6);
      if (s.stage >= 4) thrive *= 0.55 + 0.6 * c.mood;
      if (s.stage >= 3) thrive *= 0.7 + 0.3 * c.warmth;
      if (env.clarity < 0.5 && !m.lungs) thrive *= 0.5 + env.clarity;
      if (chem) {
        thrive *= 0.35 + 0.65 * clamp01(c.protein / 0.22);
        if (env.O2 < 0.35 && !m.lungs) thrive *= 0.45 + env.O2 * 1.5;
      }
      // a world grows faster the more lives it holds
      let g = dt * thrive * m.grow * (1 + 0.05 * (this.pop() - 1));
      if (c.sleeping && m.sleepEssence >= 2) g *= 1.5;
      if ((m.stargazer || wm.nightGrow) && env.night) g *= 1.4;
      if (c.growth < st.need) {
        c.growth += g;
        if (chem) c.protein = Math.max(0, c.protein - g * 0.0017);
      }
      if (!c.ready && c.growth >= st.need) {
        c.ready = true;
        this.emit('evolveReady', { last: s.stage >= D.LAST });
        if (s.stage >= D.LAST) { this.once('lantern'); s.launchT = 45; }
      }
      // the crystal is whole: the drop holds on a little longer, then lets go
      if (s.stage >= D.LAST && c.ready && s.launchT > 0) {
        s.launchT -= dt;
        if (s.launchT <= 0) { this.launch(); return; }
      }

      // ---- glow: a thriving creature sheds light you can gather
      const w = this.wellbeing();
      s.essence += 0.045 * st.glow * m.essence * w * dt * (c.sleeping && m.sleepEssence ? 1 + m.sleepEssence : 1) * (1 + 0.04 * this.count('cairn'));
      T.spark -= dt * (0.3 + w);
      if (T.spark <= 0) {
        T.spark = this.rr(9, 16);
        if (w > 0.4 && s.motes.length < 9) this.addMote(c.x, c.y, 1, true);
      }
      if (c.bond >= 0.75) {
        T.gift -= dt;
        if (T.gift <= 0) { T.gift = this.rr(60, 95); const mo = this.addMote(c.x, c.y, 4, true); mo.gift = 1; this.once('bond75'); this.emit('gift'); }
      }
      if (c.bond >= 0.25) this.once('bond25');
      if (c.bond >= 0.5) this.once('bond50');
      if (c.bond >= 0.98) this.once('bond100');

      if (this.canSing()) {
        c.singCd -= dt * (0.5 + c.mood) * (m.sing ? 1.6 : 1);
        if (c.singCd <= 0 && !c.sleeping && !c.trick) { c.singCd = this.rr(30, 55); this.emit('sing', { mood: c.mood }); this.once('sing'); }
        // After you fall silent, it answers with what it heard.
        if (c.echoT > 0) {
          c.echoT -= dt;
          if (c.echoT <= 0 && c.heard.length >= 2 && !c.sleeping) {
            this.emit('echo', { notes: c.heard.slice() });
            // Each answer writes a little of your song into its own.
            const i = Math.floor(this.rand() * c.g.song.length), n = c.heard[i % c.heard.length];
            c.g.song[i] = clamp(n, -3, 7);
            c.bond = clamp01(c.bond + 0.004 * m.bondRate); c.joy = clamp01(c.joy + 0.1);
            this.once('echo');
          }
        }
      }
      if (m.builder) {
        T.builder -= dt;
        if (T.builder <= 0) {
          T.builder = this.rr(70, 110);
          if (s.wastes.length) { const wst = s.wastes.pop(); s.env.N = clamp01(s.env.N + 0.02); this.emit('clean', { x: wst.x, y: wst.y, fx: c.x, fy: c.y }); }
          if (this.count('algae') < D.FIXTURES.algae.max) {
            const a = this.rand() * TAU, d = this.rr(80, 200);
            if (this.addFixture('algae', c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, true)) this.once('builder');
          }
        }
      }

      this.adapt(dt, light);

      // An unrewarded trick slowly loses its link to the cue.
      const lt = c.lastTrick;
      if (lt && s.time - lt.at > 5) {
        if (!lt.rewarded && lt.cue !== 'none' && c.q[lt.cue] && c.q[lt.cue][lt.beh]) c.q[lt.cue][lt.beh] *= 0.965;
        c.lastTrick = null;
      }
      if (T.tick >= 1) {
        T.tick = 0;
        for (let i = 0; i < c.mem.length; i++) c.mem[i] *= 0.997;
        this.gx = G.express(c.g);
      }

      this.think(dt, R, light);
      c.held = false;
    }

    // ---- living shapes the body: sustained pressures pull the genes
    adapt(dt, light) {
      const s = this.s, c = s.c, P = c.press, m = this.mods;
      const k = U.ease(1 / 40, dt), kUp = U.ease(1 / 10, dt);
      const to = (id, on) => { P[id] += ((on ? 1 : 0) - P[id]) * (on && P[id] < 1 ? kUp : k); };
      to('chase', c.act === 'flee');
      to('cold', s.stage >= 3 && c.warmth < 0.6);
      to('dark', light < 0.35);
      to('sun', light > 0.8 && m.photo > 0);
      to('meat', c.diet > 0.3);
      to('plant', c.diet < -0.3);
      for (const id of ['touch', 'play', 'hit', 'fight', 'voice']) P[id] += (0 - P[id]) * k;
      to('idle', P.chase < 0.06 && P.play < 0.06 && P.touch < 0.06 && P.hit < 0.06);
      const rate = dt * 0.0022 * (this.wm().mutate || 1);
      for (const id in D.PRESSURES) {
        if (!(P[id] > 0.08)) continue;
        const pull = D.PRESSURES[id].pull;
        for (const gene in pull) G.nudge(c.g, gene, pull[gene], rate * P[id]);
      }
      if (P.voice > 0.08) G.nudge(c.g, 'voice', c.voiceTarget, rate * 3 * P.voice);
    }
    // What is shaping it right now, strongest first.
    drift() {
      const P = this.s.c.press, out = [];
      for (const id in D.PRESSURES) if (P[id] > 0.2 && (id !== 'idle' || P[id] > 0.9)) out.push({ id, text: D.PRESSURES[id].text, strength: P[id] });
      out.sort((a, b) => b.strength - a.strength);
      return out;
    }

    attached() { let n = 0; for (const t of this.s.threats) if (t.att) n++; return n; }
    count(type) { let n = 0; for (const f of this.s.fixtures) if (f.type === type || (type === 'egg' && f.type === 'kin')) n++; return n; }
    nearestFixture(type, x, y, max) {
      let best = null, bd = max || 1e9;
      for (const f of this.s.fixtures) {
        if (f.type !== type) continue;
        const d = Math.hypot(f.x - x, f.y - y);
        if (d < bd) { bd = d; best = f; }
      }
      return best;
    }

    // ---- memory of places: good things and bad things leave a mark on its map of the water
    memIndex(x, y) {
      const R = this.s.habitatR, n = MEM;
      const ix = clamp(Math.floor((x / R * 0.5 + 0.5) * n), 0, n - 1), iy = clamp(Math.floor((y / R * 0.5 + 0.5) * n), 0, n - 1);
      return iy * n + ix;
    }
    remember(x, y, val) { const c = this.s.c, i = this.memIndex(x, y); c.mem[i] = clamp(c.mem[i] + val, -1, 1); }
    feeling(x, y) { return this.s.c.mem[this.memIndex(x, y)]; }

    // Decide what it wants right now and swim toward it.
    think(dt, R, light) {
      const s = this.s, c = s.c, st = this.def(), m = this.mods, gx = this.gx;
      const sense = this.sense(), night = s.env.night;
      let gx_ = c.x, gy = c.y, pace = 0, act = 'wander';

      // What is hunting it?
      let threat = null, td = 1e9, dangerNow = 0;
      for (const t of s.threats) {
        if (t.att) { dangerNow = Math.max(dangerNow, 0.6); continue; }
        if (t.state === 'leave') continue;
        const d = Math.hypot(t.x - c.x, t.y - c.y) - t.r - R;
        const near = clamp01(1 - d / (sense * 1.15));
